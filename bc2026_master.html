ative, *Nikkhama-dhatu* is liberating effort, *Parakkama-dhatu* is exertion, and *Thama-dhatu* represents the powerful, fully established force of effort."}, {"qNum": 179, "q": "179. “නිද්දාසීලී සභාසීලී - අනුට්ඨාතා ච යෝ නරෝ", "options": ["නිතර නිදන සුළු බව *(Sleeping habit)*", "ස්ත්‍රීන් කෙරෙහි ලොල් බව *(Infatuation with women)*", "දොඩමළු බව *(Talkativeness / Fond of company)*", "උත්සාහයෙන් තොර බව *(Inactivity/Lack of effort)*", "අලස බව *(Laziness)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** While *itthi-dhutta* (infatuation with women) is mentioned as a cause of downfall in a different stanza of the Parabhava Sutta, it is not mentioned in this particular stanza, which lists *Niddasili* (sleepy), *Sabhasili* (company-loving/talkative), *Anutthata* (effortless), *Alaso* (lazy), and *Kodhapanano* (angry/irritable)."}, {"qNum": 180, "q": "180. මධ්‍යම ආසියාවට සහ චීනයට බුදුදහම ව්‍යාප්ත කිරීමේ දී සුවිශේෂී දායකත්වයක් දැක්වූ කුෂාණ පාලකයා කවුරුන් ද?", "options": ["අශෝක අධිරාජයා *(Emperor Ashoka)*", "කණිෂ්ක අධිරාජයා *(Emperor Kanishka)*", "මිලිඳු රජතුමා *(King Milinda / Menander)*", "හර්ෂ අධිරාජයා *(Emperor Harsha)*", "ධර්මපාල රජතුමා *(King Dharmapala)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** Emperor Kanishka of the Kushan Dynasty patronized Sarvastivada Buddhism and actively facilitated its propagation across Central Asia and into China."}, {"qNum": 181, "q": "181. බුරුම බෞද්ධ සංස්කෘතියට අනුව, සෑම පිරිමියෙකු ම විවාහ වීමට හෝ රාජ්‍ය තනතුරක් ලැබීමට පෙර අනිවාර්යයෙන් ම ලැබිය යුතු සුදුසුකමක් වන්නේ,", "options": ["විහාර කර්මාන්තයට දායක වීම. *(Contributing to temple construction.)*", "උසස් අධ්‍යාපනයක් ලැබීම. *(Acquiring higher education.)*", "තාවකාලික පැවිද්ද ලැබීම. *(Undergoing temporary ordination [Shinbyu].)*", "ත්‍රිපිටකය කටපාඩම් කිරීම. *(Memorizing the Tipitaka.)*", "විදේශ වන්දනාවක නිරත වීම. *(Going on a foreign pilgrimage.)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** In Myanmar and Thailand, temporary novice ordination (*Shinbyu*) is considered a vital passage of rite for young boys to gain moral maturity and merit for parents."}, {"qNum": 182, "q": "182. පුද්ගලයෙකුගේ මෙලොව වශයෙන් දියුණුවක් ඇති කර ගැනීමට වැදගත් සූත්‍ර දේශනාවක් වශයෙන් මංගල කරුණු දේශනා කොට ඇත. එහි ඇතුළත් කරුණු සංඛ්‍යාව වනුයේ,", "options": ["තිස්හතරකි *(34)*", "තිස්පහකි *(35)*", "තිස්හයකි *(36)*", "තිස්හතකි *(37)*", "තිස්අටකි *(38 blessings)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** පුද්ගල මෙලොව සහ පරලොව දියුණුව පිණිස මංගල සූත්‍රය තුළ දේශනා කර ඇති උතුම් මංගල කරුණු සංඛ්‍යාව **38කි (තිස් අටකි)**."}, {"qNum": 183, "q": "183. භාරතීය ආගමික හා දාර්ශනික පරිසරය තුළ ශ්‍රමණ සම්ප්‍රදාය බිහි වූයේ බ්‍රාහ්මණ ඉගැන්වීම් ප්‍රතික්ෂේප කරමින් ඊට ප්‍රතිචාරයක් වශයෙනි. එහෙත් ඇතැම් බ්‍රාහ්මණ ඉගැන්වීම් ශ්‍රමණ සම්ප්‍රදාය විසින් සපුරා ප්‍රතික්ෂේප නොකරන ලදුව ඒ මට්ටමෙන් ම ඉගැන්වීම් පරීක්ෂා කිරීමෙන් පැහැදිලි වේ. මේ අනුව ඇතැම් ශ්‍රමණයන් විසින් ද පිළිගත් බ්‍රාහ්මණ ඉගැන්වීමක් ලෙස හඳුනා ගත හැක්කේ,", "options": ["ඊශ්වර නිර්මාණවාදය යි. *(Issaranirmana-vada / Theism)*", "කුලභේදය යි. *(Caste distinctions)*", "නිදහස් චින්තනය යි. *(Free thinking)*", "යාගය යි. *(Sacrifice)*", "කර්ම විපාක පිළිගැනීම යි. *(Belief in Karma and its Vipaka)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** විෂය නිර්දේශයේ සම්මත කරුණු සහ ඓතිහාසික සාධක අනුව වරණ **(5)** නිවැරදි පිළිතුර වේ."}, {"qNum": 184, "q": "184. තෙවන ධර්ම සංගායනාවේ ප්‍රතිඵලයක් ලෙස නොසැලකිය හැකි කරුණ කුමක්ද?", "options": ["නව රට ශාසනය පිහිටුවීමයි. *(Establishing the dispensation in nine regions.)*", "ථේරවාදි හා මහාසාංඝික ලෙස භික්ෂූන් නිකාය දෙකකට බෙදීමයි. *(The split of monks into Theravada and Mahasanghika.)*", "භික්ෂු විනය කර්ම කිරීම නැවත ආරම්භ වීමයි. *(Resumption of monastic Vinaya acts.)*", "කථාවත්ථුප්පකරණය සම්පාදනය කිරීමයි. *(Compilation of the Kathavatthu.)*", "අභිධර්ම පිටකය සම්පූර්ණ වීමයි. *(Completion of the Abhidhamma Pitaka.)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** The great schism between Theravada and Mahasanghika occurred following the Second Buddhist Council, not the Third Council. The Third Council refined and consolidated the Theravada scriptures."}, {"qNum": 185, "q": "185. බුදුදහම හඳුන්වාදෙන ලද සෙසු ථේරවාද බෞද්ධ රටවලට සාපේක්ෂව මියන්මාර් (බුරුම) සමාජයේ සිදු වූ සුවිශේෂී වෙනසක් ලෙස හඳුනාගත හැක්කේ,", "options": ["බුදුදහම රාජ්‍ය ආගම බවට පත් කිරීමයි. *(Making Buddhism the state religion.)*", "පාලි ත්‍රිපිටකය ස්වකීය භාෂාවට පරිවර්තනය කිරීමයි. *(Translating the Tipitaka into the native language.)*", "පැවති ආගමික විශ්වාස සපුරා බැහැර කිරීමයි. *(Completely eradicating existing local beliefs.)*", "තාවකාලික පැවිද්ද ක්‍රියාත්මක වීමයි. *(The practice of temporary ordination.)*", "කුලභේදය නොසලකා කටයුතු කිරීමයි. *(Disregarding caste differences in monastic affairs.)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** In Myanmar (and Thailand), temporary ordination (Shinbyu/Noviciate) is an essential social custom where every young Buddhist male ordains temporarily for a brief period to gain maturity, parental blessing, and social status before marriage or employment. This is absent in Sri Lanka."}, {"qNum": 186, "q": "186. ථෙරවාදී බෞද්ධ සම්ප්‍රදායේ මූලස්ථානය මෙන් ම ලක්දිව ත්‍රිපිටකය ග්‍රන්ථාරූඪ කිරීම, පාලි අටුවා ලේඛනය කිරීම වැනි මහා ශාස්ත්‍රීය මෙහෙවරක් ඉටු කළ බෞද්ධ මධ්‍යස්ථානය වන්නේ,", "options": ["අභයගිරි විහාරය යි. *(Abhayagiri Vihara)*", "මහා විහාරය යි. *(Maha Vihara)*", "ජේතවනාරාම විහාරය යි. *(Jetavana Vihara)*", "චේතියගිරි විහාරය යි. *(Cetiyagiri Vihara)*", "දක්ඛිණගිරි විහාරය යි. *(Dakkhinagiri Vihara)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** The Anuradhapura Maha Vihara was the cradle of orthodox Theravada, preserving the Dhamma and Vinaya from the time of Mahinda, and hosting the commentary translations of Buddhaghosa."}, {"qNum": 187, "q": "187. “ද්‍රෝණවස්තු ප්‍රදේශයට” වැඩම කොට ජන්ම වර්ගයා ඇතුළු ප්‍රදේශවාසීන් සන්සිඳවීමට කටයුතු කරමින් ධර්මදූත සේවාවේ යෙදුණේ කවුද?", "options": ["කොණ්ඩඤ්ඤ තෙරුන් වහන්සේ ය. *(Bhikkhu Kondanna)*", "සැරියුත් තෙරුන් වහන්සේ ය. *(Bhikkhu Sariputta)*", "මුගලන් තෙරුන් වහන්සේ ය. *(Bhikkhu Moggallana)*", "පුණ්ණ තෙරුන් වහන්සේ ය. *(Bhikkhu Punna)*", "මහා කාශ්‍යප තෙරුන් වහන්සේ ය. *(Bhikkhu Maha Kassapa)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** Venerable Kondanna (Aññā Koṇḍañña) was born in the Brahmin village of Dronavastu (ද්‍රෝණවස්තු) near Kapilavastu. After attaining Arhatship, he returned to Dronavastu and converted many of his kinsmen and locals to Buddhism.\n\n---\n\n### Page 6"}, {"qNum": 188, "q": "188. ථේරවාදී පාළි ත්‍රිපිටකය ආරක්ෂා කොට පවත්වා ගැනීමේ ලා බුරුම රජවරුන්ගෙන් සිදු වූ මෙහෙය ප්‍රශංසනීය ය. ප්‍රකට බුරුම බෞද්ධ රජ දරුවන් අතර අනව්රත රජු කළ වැදගත් ශාසනික ධර්ම ශාස්ත්‍රීය සේවාවක් වන්නේ,", "options": ["ත්‍රිපිටකය බුරුම අක්ෂරවලින් ලියා තැබීම වේ *(Writing down the Tipitaka in Burmese script)*", "ධර්ම සංගායනාවට අනුග්‍රහය දැක්වීම වේ *(Supporting a Dhamma Council)*", "බෞද්ධ විශ්වවිද්‍යාලයක් ආරම්භ කිරීම වේ *(Starting a Buddhist university)*", "ත්‍රිපිටකය කිරිගරුඬ පුවරුවල ලිවීම වේ *(Inscribing the Tipitaka on marble slabs)*", "ස්වේදගොන් චෛත්‍යය නිර්මාණය වේ *(Constructing the Shwedagon Pagoda)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** බුරුමයේ (මියන්මාරයේ) පළමු බෞද්ධ රාජ්‍යය පිහිටුවූ අනෞරථ (Anawrahta) රජතුමා ථටෝන් දේශයෙන් ත්‍රිපිටකය සහ ධාතූන් වහන්සේලා වැඩමවා, ත්‍රිපිටකය බුරුම අක්ෂරවලින් ලියා තබමින් රට පුරා සද්ධර්මය ව්‍යාප්ත කිරීමට පුරෝගාමී මෙහෙවරක් කළේය."}, {"qNum": 189, "q": "189. ගිහි බෞද්ධ ජීවිතයේ ආර්ථික සුරක්ෂිතතාවය සඳහා බුදුදහම ධනය ඉපයීම මෙන් ම එය කළමනාකරණය ද අගය කරයි. ඒ අනුව ව්‍යග්ඝපජ්ජ සූත්‍රයේ දී ධාර්මිකව උපයන ධනය පරිහරණය කිරීමේ දී දැක්වෙන වැදගත්ම ආර්ථික සංකල්පය වන්නේ,", "options": ["ආරක්ඛ සම්පදාවයි *(Arakkha Sampada - protection of wealth)*", "උට්ඨාන සම්පදාවයි *(Utthana Sampada - industriousness)*", "කල්‍යාණ මිත්තතාවයි *(Kalyana Mittata - noble friendship)*", "සමජීවිකතාවයි *(Samajivikata - balanced living)*", "භෝග පරිහරණයයි *(Bhoga Pariharana)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** Samajivikata represents living within one's means—neither over-spending nor being miserly (balanced livelihood). It is a pillar of Buddhist lay financial management.\n\n---\n\n### Page 4"}, {"qNum": 190, "q": "190. අභිධර්ම පිටකය සඳහා 'අභිධර්ම විභාෂා' නම් වූ අටුවාවක් සම්පාදනය කරන ලද්දේ කුමන අවස්ථාවක ද?", "options": ["ප්‍රථම ධර්ම සංගායනාවේ දී ය. *(First Buddhist Council)*", "දෙවන ධර්ම සංගායනාවේ දී ය. *(Second Buddhist Council)*", "තෙවන ධර්ම සංගායනාවේ දී ය. *(Third Buddhist Council)*", "වලගම්බා රජ දවස පවත්වන ලද සංගායනාවේ දී ය. *(Aluvihara Council under Valagamba)*", "කණිෂ්ක රජුගේ අනුග්‍රහයෙන් පවත්වන ලද සිව්වන සංගායනාවේ දී ය. *(Fourth Council under King Kanishka)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** During the Fourth Council of the Sarvastivada school held in Kashmir under King Kanishka, three monumental encyclopedic commentaries (*Vibhashas*) were compiled, including the Abhidharma-mahavibhasha-shastra."}, {"qNum": 191, "q": "191. ප්‍රාග් මහින්ද යුගයේ ලක්දිව විදේශීය ආගම් හා දේශීය ආගමික ඇදහිලි පැවති බව මහා වංශය ආදී වූ මූලාශ්‍රයන්ගෙන් තොරතුරු අනාවරණය වේ. එම බොහෝ ආගම් වලට හා බොහෝ ආගමික ඇදහිලි වලට අනුග්‍රහය දැක්වූ ශ්‍රී ලාංකේය පාලකයා වන්නේ,", "options": ["දේවානම්පියතිස්ස රජතුමාය. *(King Devanampiyatissa)*", "වට්ටගාමිණී අභය රජතුමාය. *(King Valagamba)*", "දුටුගැමුණු රජතුමාය. *(King Dutugemunu)*", "ගිරිකණ්ඨශිව රජතුමාය. *(King Girikandashiva)*", "පණ්ඩුකාභය රජතුමාය. *(King Pandukabhaya)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** King Pandukabhaya, who consolidated Anuradhapura as the capital, showed immense religious tolerance by building shrines for Yakkhas, and residences for Brahmins (Sotthi-sala), Ajivikas, Niganthas (Jotiya, Giri, Kumbhanda), and other ascetics."}, {"qNum": 192, "q": "192. \"බුන්රකු\" යනු දහසය වන සියවසේ අග භාගයේදී ජනප්‍රිය වූ,", "options": ["කලා නිකේතනයකි. *(An art institute)*", "රූකඩ විශේෂයකි. *(A unique style of puppet theater / Puppetry)*", "නාට්‍ය සම්ප්‍රදායකි. *(A theater tradition)*", "සටන් කලාවකි. *(A martial art)*", "සංගීත සන්දර්ශනයකි. *(A musical concert)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** Bunraku is the classical Japanese puppet theater, dating back to the late 16th century, where large puppets are controlled with extreme precision by up to three master puppeteers."}, {"qNum": 193, "q": "193. |තායි දේශයට බුදු සමයේ ආභාසය නිසා හිමි වූ දායාදයන් ලෙස බෞද්ධ උත්සව කලාව දැක්විය හැකිය. මේ අනුව තායිලන්තයේ වාර්ෂිකව පැවැත්වෙන විවිධ බෞද්ධ උත්සව අතර තායි රජතුමා අනිවාර්යයෙන්ම සහභාගි විය යුතු උත්සවය වන්නේ,", "options": ["වෙසක් උත්සවයයි *(Vesak festival)*", "කඨින උත්සවයයි *(Kathina festival / Robe-offering)*", "ඇසළ උත්සවයයි *(Asela festival)*", "අලුත් අවුරුදු උත්සවයයි *(New Year festival / Songkran)*", "මළවුන් පිදීමේ උත්සවයයි *(Festival of honoring the dead)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** විෂය නිර්දේශයේ සම්මත කරුණු සහ ඓතිහාසික සාධක අනුව වරණ **(2)** නිවැරදි පිළිතුර වේ."}, {"qNum": 194, "q": "194. වෛදික සාහිත්‍ය ග්‍රන්ථවල සඳහන් ආකාරයට බ්‍රාහ්මණ වර්ණයට අයත් නොවන ස්වධර්ම ඇතුළත් වර්ණය වනුයේ මෙයින් කුමන වර්ණයක්ද?", "options": ["අධ්‍යාපනය, යාග කිරීම, යාග කරවීම *(Education, performing sacrifices, causing sacrifices to be performed)*", "අධ්‍යාපනය, දන් දීම, රාජ්‍යානුශාසනය *(Education, giving alms, state counsel/governing advice)*", "අධ්‍යාපනය, අධ්‍යයනය, යාග කිරීම *(Education, study, performing sacrifices)*", "අධ්‍යාපනය, යාග කිරීම, කෘෂිකර්මාන්තය *(Education, performing sacrifices, agriculture)*", "අධ්‍යාපනය, යාග කරවීම, රාජ්‍යානුශාසනය *(Education, causing sacrifices to be performed, state counsel/governing advice)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** බ්‍රාහ්මණ වර්ණයට අයත් ස්වධර්ම (කාර්යයන්) 6කි: අධ්‍යයන (ඉගෙනීම), අධ්‍යාපන (ඉගැන්වීම), යජන (තමා වෙනුවෙන් යාග කිරීම), යාජන (අනුන් උදෙසා යාග කරවීම), දාන (දන් දීම) සහ ප්‍රතිග්‍රහ (තෑගි භාර ගැනීම) යි. **කෘෂිකර්මාන්තය (Agriculture)** යනු වෛශ්‍ය වර්ණයට හිමි වෘත්තීයමය ස්වධර්මයක් වන බැවින්, එය බ්‍රාහ්මණ ස්වධර්මවලට අයත් නොවේ."}, {"qNum": 195, "q": "195. හොඳ නරක විනිශ්චය කිරීමෙහි ලා භාවිත බෞද්ධ නිර්ණායක රාශියක් බුදු දහමේ විස්තර වන අතර, එකී සෑම නිර්ණායකයක ම පාහේ ප්‍රධාන වශයෙන් ම පදනම් කරගෙන ඇත්තේ,", "options": ["කර්මය සහ විපාකය යි. *(Kamma and its results)*", "කර්ම සහ පුනර්භවය යි. *(Kamma and rebirth)*", "පුද්ගලයා සහ සමාජය යි. *(The individual and society)*", "නිවන සහ අනිත්‍ය බව යි. *(Nirvana and impermanence)*", "චේතනාව සහ විපාකය යි. *(Intention/volition [Cetana] and its consequences)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** In Buddhist ethics, intention (*Cetana*) is the defining moral factor of an action (*\"Cetanaham bhikkhave kammam vadami\"*), and its consequences on self and others form the basis of moral evaluation."}, {"qNum": 196, "q": "196. ප්‍රථම ධර්ම සංගායනාවේ ප්‍රතිඵලයක් ලෙස සූත්‍ර පිටකය නිකාය වශයෙන් පහකට වෙන් කර භාරකාර පරම්පරාවට කටපාඩමින් රැගෙන යාමට පැවරිණි. මෙහිදී \"ඛුද්දක නිකාය\" හිමි වූයේ,", "options": ["ආනන්ද හිමි ඇතුළු ශිෂ්‍ය පරම්පරාවට ය. *(To Ven. Ananda and his lineage)*", "සැරියුත් හිමි ඇතුළු ශිෂ්‍ය පරම්පරාවට ය. *(To Ven. Sariputta's lineage)*", "මහා කාශ්‍යප හිමි ඇතුළු ශිෂ්‍ය පරම්පරාවට ය. *(To Ven. Maha Kassapa's lineage)*", "පොදුවේ සියලුම භික්ෂූන්ට ය. *(To all monks collectively)*", "අනුරුද්ධ හිමි ඇතුළු ශිෂ්‍ය පරම්පරාවට ය. *(To Ven. Anuruddha's lineage)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** While Digha was given to Ven. Ananda, Majjhima to Ven. Sariputta's disciples, Samyutta to Ven. Maha Kassapa, and Anguttara to Ven. Anuruddha, the Khuddaka Nikaya was kept collectively by the entire monastic community (*Sabba-sangha*) rather than being entrusted to a single teacher lineage.\n\n---"}, {"qNum": 197, "q": "197. බුදුරජාණන් වහන්සේ සැවැත්නුවර ජේතවනාරාමයෙහි වැඩ වෙසෙද්දී එක්තරා දේවතාවෙක් උන්වහන්සේ හමුවට පැමිණ මංගල කරුණු කවරේ දැයි ප්‍රශ්න කළවිට මංගල සූත්‍රය දේශනා කළහ. එම සූත්‍රයෙහි මංගල කරුණු 38 ක් අන්තර්ගත වන අතර ඉන් එක් මංගල කරුණක් වන්නේ,", "options": ["ඉවසීම යි. *(Patience / Khanti)*", "මෛත්‍රිය යි. *(Loving-kindness)*", "සතුටුදායක බව යි. *(Happiness)*", "උත්සාහය යි. *(Effort)*", "කරුණාව යි. *(Compassion)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** විෂය නිර්දේශයේ සම්මත කරුණු සහ ඓතිහාසික සාධක අනුව වරණ **(1)** නිවැරදි පිළිතුර වේ."}, {"qNum": 198, "q": "198. බ්‍රාහ්මණයන් පුද්ගලයෙකුගේ ජීවිතය අවධි හතරකට බෙදා දක්වන ලද අතර, පහත තොරතුරුවලින් ගෘහස්ථ ආශ්‍රමයට අදාළව නොගැලපෙන්නේ,", "options": ["උපනයන කර්මය සිදු කිරීම යි. *(Performing the Upanayana sacrament.)*", "පිරිමි දරුවෙක් ප්‍රාර්ථනා කිරීම යි. *(Praying for a male child.)*", "පස්මහා සැප විඳීම යි. *(Enjoying the fivefold sensory pleasures.)*", "ගර්භාධාන සංස්කාරය සිදුකිරීම යි. *(Performing the Garbhadhana sacrament.)*", "කුලයට ගැළපෙන විවාහයක් කර ගැනීම යි. *(Marrying according to one's caste/Varna.)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** The Upanayana sacrament (the sacred thread ceremony) marks the initiation of a young boy into student life (Brahmacharya Ashrama), not the Grihastha (householder) Ashrama."}, {"qNum": 199, "q": "199. පුද්ගල චර්යා පාලනය කිරීමෙහි ලා නිතිශීලය ප්‍රබල සාධකයකි. නීතිය සමාජ සම්මතයකි. එම සම්මතයන් නො ඉක්මවා ක්‍රියා කිරීම බුදුසමය තුළ වැදගත් කොට සලකා තිබේ. මේ අදහස ඉස්මතු වන බෞද්ධ මූලාශ්‍රය වන්නේ,", "options": ["සප්ත ආර්ය ධනය යි. *(The Sevenfold Noble Wealth)*", "දස රාජ ධර්මය යි. *(The Tenfold Royal Virtue)*", "සතර බ්‍රහ්ම විහරණය යි. *(The Four Sublime States)*", "සතර සංග්‍රහ වස්තුව යි. *(The Four Bases of Sympathy)*", "සප්ත අපරිහානීය ධර්මය යි. *(The Seven Conditions of Welfare)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** විෂය නිර්දේශයේ සම්මත කරුණු සහ ඓතිහාසික සාධක අනුව වරණ **(5)** නිවැරදි පිළිතුර වේ."}, {"qNum": 200, "q": "200. මහා විහාරය හා අභයගිරි විහාරය ශ්‍රී ලංකාවේ බිහි වූ ප්‍රමුඛ බෞද්ධ මධ්‍යස්ථාන දෙකකි. ඒ අතර මහා විහාරය සම්බන්ධයෙන් සාවද්‍ය ප්‍රකාශය වන්නේ,", "options": ["කාලප්‍රාසාදය, පියංගු පිරිවෙන, ග්‍රන්ථකාර පිරිවෙන මහා විහාරයට අනුබද්ධ ආයතන වේ. *(Kalaprasada, Piyangu Pirivena, and Granthakara Pirivena were affiliated to Maha Vihara.)*", "ධාරණී ශක්තියෙන්, ප්‍රඥාවෙන් අගතැන්පත් බුද්ධිමත් භික්ෂූන් වහන්සේලා මහා විහාරයේ වැඩ විසූහ. *(Intellectual monks supreme in Dharani [mystic spells] and wisdom resided in Maha Vihara.)*", "කණිට්ඨ තිස්ස රජතුමා මහා විහාරයේ ප්‍රයෝජනය පිණිස මණිසෝම ප්‍රාසාදය තැනවීය. *(King Kanittha Tissa built the Manisoma Prasada for the benefit of Maha Vihara.)*", "මූලායතන පිහිටුවා බෞද්ධ ආරාමික අධ්‍යාපනය පෝෂණය කොට ආරක්ෂා කළේය. *(Established Mulayatanas to nurture and protect monastic education.)*", "විනය සංගායනාවක් පවත්වා ත්‍රිපිටකය ග්‍රන්ථාරූඪ කළේය. *(Held a Vinaya council and committed the Tipitaka to writing.)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** King Kanittha Tissa built the Manisoma (Mani Somasela) Vihara and its Maha Pirivena at Abhayagiri, which was historically affiliated with the Abhayagiri fraternity, not the Maha Vihara."}, {"qNum": 201, "q": "201. භාරතීය බ්‍රාහ්මණ සමාජ ධර්ම අතර බ්‍රාහ්මණ, ක්‍ෂත්‍රිය, වෛශ්‍ය, ශුද්‍ර යනුවෙන් දැක්වෙනුයේ,", "options": ["ස්ව ධර්මයි *(Sva Dharma - individual caste duties)*", "ආශ්‍රම ධර්මයි *(Ashrama Dharma - stages of life)*", "ආපද් ධර්මයි *(Apad Dharma - emergency/distress duties)*", "වර්ණ ධර්මයි *(Varna Dharma - caste division principles)*", "බ්‍රාහ්මණ ධර්මයි *(Brahmana Dharma - duties specific to Brahmins)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** The Rigvedic division of society into four classes (Brahmin, Kshatriya, Vaishya, Shudra) is known as Varna Dharma. These represent the cosmic-social hierarchy instituted by the creator deity."}, {"qNum": 202, "q": "202. මහනුවර යුගයේ උඩරට සම්ප්‍රදායට අයත් චිත්‍ර දැකිය හැකි විහාරස්ථානයක් වූයේ,", "options": ["කැලණිය පැරණි විහාරය යි. *(Kelaniya Old Temple)*", "ඇතුගල විහාරය යි. *(Athugala Temple)*", "සඳගිරි විහාරය යි. *(Sandagiri Temple)*", "මැදවල විහාරය යි. *(Medawala Temple)*", "රිදී විහාරය යි. *(Ridi Viharaya)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** Ridi Vihara (Silver Temple) in Kurunegala district houses magnificent examples of Kandyan-style temple murals restored under the patronage of King Kirti Sri Rajasinha.\n\n---"}, {"qNum": 203, "q": "203. බ්‍රාහ්මණාගමේ ඉගැන්වෙන ආපද්ධර්ම සංකල්පයට අනුව සාවද්‍ය ප්‍රකාශය වන්නේ,", "options": ["බ්‍රාහ්මණයා විසින් ක්ෂත්‍රියාට අයත් කාර්යයන් කළ හැකිය යන්නය. *(A Brahmin can perform duties of a Kshatriya.)*", "ක්ෂත්‍රියා විසින් බ්‍රාහ්මණයාට අයත් කාර්යයන් කළ හැකිය යන්නය. *(A Kshatriya can perform duties of a Brahmin.)*", "බ්‍රාහ්මණයා විසින් වෛශ්‍යයාට අයත් කාර්යයන් කළ හැකිය යන්නය. *(A Brahmin can perform duties of a Vaishya.)*", "ක්ෂත්‍රියා විසින් වෛශ්‍යයාට අයත් කාර්යයන් කළ හැකිය යන්නය. *(A Kshatriya can perform duties of a Vaishya.)*", "වෛශ්‍යයා විසින් ශුද්‍රයාට අයත් කාර්යයන් කළ හැකිය යන්නය. *(A Vaishya can perform duties of a Shudra.)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** Under Apaddharma, higher castes are allowed to adopt the professions of lower castes in times of distress (e.g., a Brahmin performing Kshatriya or Vaishya duties), but a lower caste (like Kshatriya or Vaishya) is strictly prohibited from performing the sacred duties of a Brahmin."}, {"qNum": 204, "q": "204. නිවැරදි පිළිතුර: 2 (ශරීරය පදනම් කොට ගෙනය)", "options": [], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** ඍග්වේදයේ දසවන මණ්ඩලයට අයත් **'පුරුෂ සූක්තය' (Purusha Sukta)** මඟින් චතුර්වර්ණ නිර්මාණය දිව්‍යමය මැවීමක් ලෙස විග්‍රහ කෙරේ. එහි දැක්වෙන්නේ මහා බ්‍රහ්මයා (මහා පුරුෂයා) සිය ශරීර අවයව මඟින් වර්ණ හතර මැවූ බවයි. ඒ අනුව බ්‍රාහ්මණයන් මුඛයෙන් ද, ක්ෂත්‍රියයන් බාහුවලින් ද, වෛශ්‍යයන් කලවයෙන් ද, ශුද්‍රයන් පාදවලින් ද මවන ලදී. එබැවින් මෙම වර්ග කිරීම සිදු කර ඇත්තේ ශරීරයේ අවයව පදනම් කරගෙන ය."}, {"qNum": 205, "q": "205. තමන් උපයාගත් ධනයෙන් පංච බලි ඉටු කළ යුතු බව බුදු දහම පෙන්වා දෙයි. එයින් \"මළවුන් වෙනුවෙන් චාරිත්‍ර ඉටුකිරීම\" දැක්වෙන්නේ,", "options": ["ඥාති බලි යනුවෙනි. *(Nati bali - offering to relatives)*", "අතිථි බලි යනුවෙනි. *(Atithi bali - offering to guests)*", "පුබ්බපේත බලි යනුවෙනි. *(Pubbapeta bali - offering to the departed/ancestors)*", "රාජ බලි යනුවෙනි. *(Raja bali - offering to the king/taxes)*", "දේවතා බලි යනුවෙනි. *(Devata bali - offering to the deities)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** Pubbapeta Bali is the practice of transferring merits and making offerings in honor of departed ancestors and family members.\n\n---"}, {"qNum": 206, "q": "206. සඳකඩ පහණ පිළිබඳව විවිධ විචාරකයන් විවිධාකාරයෙන් මතවාද පළකර ඇත. ඒ අතර “සඳකඩ පහණ අලංකාරයට සැරසීමට යොදාගත් උපායක් හා පාපිස්නක්” ලෙස දක්වන්නේ,", "options": ["සෙනරත් පරණවිතාන මහතාය *(Prof. Senarath Paranavitana)*", "H.C.P. බෙල් මහතාය *(H.C.P. Bell)*", "D.T. දේවේන්ද්‍ර මහතාය *(D.T. Devendra)*", "විනිවිදාරණ මහතාය *(Vinividarana)*", "විලියම් ඊ වෝඩ් මහතාය *(William E. Ward)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** While Senarath Paranavitana argued that the moonstone represents a profound spiritual journey (the Samsara cycle), D.T. Devendra rejected this, stating it was merely an aesthetic architectural element and a practical doormat/step."}, {"qNum": 207, "q": "207. ලක්දිව පාලකයින් ඉදි කළ වෙහෙර විහාර කිහිපයක් පහත දැක්වේ.", "options": ["A, B හා C ය.", "A, C හා D ය.", "C, D හා E ය.", "B, D හා E ය.", "A, B හා E ය."], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** King Dutugemunu constructed the Mirisawetiya Stupa, the Lovamahaprasada (nine-story chapter house), and started the Ruwanweli Maha Seya (Maha Thupa).\n\n---"}, {"qNum": 208, "q": "208. බ්‍රාහ්මණ සමාජ ධර්ම අතර නිර්මාණවාදී ඉගැන්වීම් ලෙස ස්වධර්ම දැක්විය හැකිය. ස්වධර්මයන් අනුව සමාජයේ උසස්ම ස්ථානය හිමිව ඇත්තේ,", "options": ["ක්ෂත්‍රියන්ට ය. *(To the Kshatriyas)*", "වෛශ්‍යයන්ට ය. *(To the Vaishyas)*", "බ්‍රාහ්මණයන්ට ය. *(To the Brahmins)*", "ශූද්‍රයන්ට ය. *(To the Shudras)*", "පරියන්තයට ය. *(To the outcasts/marginalized)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** In the Vedic/Brahminic social hierarchy, the Brahmins are positioned at the absolute top, having been created from the mouth of the cosmic Purusha. Their Svadharma (education, performing sacrifices, etc.) guarantees them the supreme and most sacred position in society.\n\n---"}, {"qNum": 209, "q": "209. බ්‍රාහ්මණ සමාජය තුළ කාන්තාවට හිමි වූ සමාජ තත්ත්වය සම්බන්ධයෙන් නොගැලපෙන ප්‍රකාශය තෝරන්න.", "options": ["ස්වාමියා සමඟ එක්ව ආගමික වතාවත්වල නිරත විය හැකි ය. *(She could engage in religious rituals together with her husband.)*", "සති පූජාව චාරිත්‍රයක් ලෙස මිය යාම උදාර කටයුත්තක් ලෙස සැලකේ. *(Self-immolation on the husband's funeral pyre [Sati] was considered noble.)*", "වැන්දඹුවන් ජීවිතාන්තය දක්වා ම හුදකලාව වාසයට යොමු විය යුතු ය. *(Widows must live in complete isolation for the rest of their lives.)*", "ස්ත්‍රිය බාල වියේ දී දෙමාපියන් යටතේ ජීවත් විය යුතු ය. *(A woman must live under her parents' authority during her childhood.)*", "විවාහය සම්බන්ධයෙන් කිසිදු ස්වාධීන තීරණයක් ගැනීමට අයිතියක් නැත. *(She had no right to make any independent decision regarding marriage.)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** Under orthodox Brahmin codes (such as Manusmriti), women were excluded from independent Vedic learning and performing sacrificial rituals, even together with their husbands."}, {"qNum": 210, "q": "210. බුදුසමය වර්ණ ධර්ම සංකල්පය ප්‍රතික්ෂේප කරමින් මානව සංහතියේ ඒකත්වය සටහන් කිරීම සඳහා විවිධ සාධක හඳුන්වා දෙයි. එම සාධක අතරින් ජීව විද්‍යාත්මක සාධක හඳුනාගත හැකි සූත්‍රය වන්නේ,", "options": ["වසල සූත්‍රය *(Vasala Sutta)*", "අම්බට්ඨ සූත්‍රය *(Ambattha Sutta)*", "චක්කි සූත්‍රය *(Cakki Sutta)*", "වාසෙට්ඨ සූත්‍රය *(Vasettha Sutta)*", "අග්ගඤ්ඤ සූත්‍රය *(Agganna Sutta)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** In the Vasettha Sutta (Majjhima Nikaya), the Buddha presents detailed biological evidence showing that while plants, insects, and animals have diverse physical species-specific features, humans are physically and biologically uniform as a single species."}, {"qNum": 211, "q": "211. ආර්ය විනයෙහි දකුණු දිශාවට නමස්කාර කිරීම යනුවෙන් හඳුන්වා ඇත්තේ........................ විෂයෙහි යුතුකම් හා ගතිගුණ ඉටු කිරීමයි.", "options": ["දෙමාපියන් *(Parents)*", "අඹු-දරුවන් *(Wife and children)*", "යහළු මිතුරන් *(Friends)*", "ගුරුවරුන් *(Teachers)*", "සේවක-සේවිකාවන් *(Servants and workers)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** සිගාලෝවාද සූත්‍රයේ එන ෂඩ් දිශාවන්ගෙන් **දකුණු දිශාව (Dakkhina Disa)** මඟින් සංකේතවත් කරන්නේ ගුරුවරුන් ය. සිෂ්‍යයෙකු විසින් ගුරුවරයාට ඉටුකළ යුතු වගකීම් සහ ගුරු-සිසු සබඳතාව එහි මැනවින් විග්‍රහ කෙරේ."}, {"qNum": 212, "q": "212. \"මිනිස් වර්ගයාගේ වැඩි ම සංඛ්‍යාවකින් පූජා ලද තැනැත්තා ලෙස ඉතා පහසුවෙන් ම වෙන් කොට දැක්විය හැක්කේ බුදු රජාණන් වහන්සේ ය.\" බුදුරජාණන් වහන්සේ පිළිබඳ නූතන ඇගයීමක් වන මෙම ප්‍රකාශය කරන ලද්දේ කවුරුන් විසින් ද?", "options": ["මහාචාර්ය ලක්ෂ්මී නරසු *(Prof. P. Lakshmi Narasu)*", "ඇල්බට් අයින්ස්ටයින් *(Albert Einstein)*", "බර්ට්‍රන්ඩ් රසල් *(Bertrand Russell)*", "මහාචාර්ය සෝන්ඩර්ස් *(Prof. Saunders)*", "එඩ්වින් ආර්නෝල්ඩ් *(Edwin Arnold)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** \"මිනිස් වර්ගයාගේ වැඩිම සංඛ්‍යාවකින් පූජා ලද තැනැත්තා ලෙස ඉතා පහසුවෙන් ම වෙන් කොට දැක්විය හැක්කේ බුදු රජාණන් වහන්සේ ය\" යන ඇගයීම් ප්‍රකාශය සිදු කරන ලද්දේ ප්‍රකට බටහිර බෞද්ධ විද්වතෙකු වූ **මහාචාර්ය සෝන්ඩර්ස් (Professor Saunders)** විසිනි."}, {"qNum": 213, "q": "213. මගධය ගේභාර, විපුල, ගිජ්ඣකූට, ඉසිගිලි, පාණ්ඩව යන පර්වත පහකින් වට වී පිහිටා ඇති මහා රාජ්‍යයකි. මුල් කාලීනව මෙහි පාලකයා බිම්බිසාර රජු වේ. ඒ අනුව පර්වත පහකින් වට වූ නිසා මෙම රාජ්‍යය හඳුන්වනු ලැබුවේ,", "options": ["ගිරිඩබ්බ නමිනි *(Giridabba)*", "ගිරිව්‍රජ නමිනි *(Girivraja)*", "පංචවිධ පර්වත නමිනි *(Panchavidha Parvata)*", "මහාමේරු පර්වත නමිනි *(Mahameru Parvata)*", "පංචචක්‍ර පර්වත නමිනි *(Panchachakra Parvata)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** මගධයේ පැරණි අගනුවර වූ රජගහ නුවර වටා ස්වභාවික පවුරක් මෙන් පර්වත පහක් (ගේභාර, විපුල, ගිජ්ඣකූට, ඉසිගිලි, පාණ්ඩව) පිහිටා තිබීම නිසා එය පර්වතවලින් වටවූ ආරක්ෂිත කොටුවක් හෙවත් **'ගිරිව්‍රජ' (Girivraja)** නමින් හැඳින්විණි."}, {"qNum": 214, "q": "214. ජීවත්වීමේ අයිතිය, සම්පත් රැක ගැනීමේ අයිතිය, සාර්ථක පවුල් ජීවිතයක් ගත කිරීමේ අයිතිය මෙන්ම සමාජය තුළ විශ්වාසයත්, සන්නිවේදනයත් ස්ථාපිත කිරීමට අනුබල දෙන මූලික බෞද්ධ ඉගැන්වීමක් ලෙස හඳුනා ගත හැක්කේ,", "options": ["බෝධිසත්ත්ව ප්‍රතිපදාව යි. *(The Bodhisattva Way)*", "නිර්වාණගාමී මාර්ගය යි. *(The Path to Nirvana)*", "සම්මා ආජීවය යි. *(Right Livelihood)*", "පංචශීල ප්‍රතිපදාව යි. *(The Five Precepts)*", "අත්තුපනායික ධර්ම පර්යාය යි. *(Atthupanaika Dharma Pariyaya)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** විෂය නිර්දේශයේ සම්මත කරුණු සහ ඓතිහාසික සාධක අනුව වරණ **(4)** නිවැරදි පිළිතුර වේ."}, {"qNum": 215, "q": "215. මහාදේව තෙරුන් පෙන්වා දුන් පස් වස්තුවට අයත් නොවන කරුණක් වන්නේ,", "options": ["රහතන් වහන්සේට නොදැනුවත්වම පති විය හැකිය. *(Wet dreams / nocturnal emissions can occur in Arahants)*", "යමෙකුට තමන් නොදැනුවත්වම රහත් විය හැකිය. *(One can be an Arahant while being ignorant of general things)*", "රහත් වුවද ධර්මය පිළිබඳ සැක ඇති විය හැකිය. *(An Arahant can have doubts on non-doctrinal matters)*", "වචනයෙන් කියා සිටීමෙන් රහත් විය හැකිය. *(One can attain Arahantship simply by being told/instructed by others)*", "භාවනාවේ යෙදී සිටියදී \"දුක්ඛං\" යන්න කීමෙන් රහත් විය හැකිය. *(One enters path by uttering \"aho dukkha\" / oh pain)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** According to Mahadeva's points, an Arahant is still physically subject to emissions (1), can have general ignorance (2), can have worldly doubts (3), needs others for spiritual verification (Paravitarna - but not just \"verbally claiming\" to be an Arahant), and utters \"aho dukkha\" during path-realization. Choice 4 is not formulated as one of the authentic five points of relaxation of Arahantship.\n\n---"}, {"qNum": 216, "q": "216. බුදුදහමට අනුව නොකළයුතු වෙළඳාම් මෙන්ම තුලකූට, කංසකූට, මානකූට, උක්කෝටන, වංචනික ආදී විවිධ වංචනික කටයුතුවලින් මුදල් ඉපයීම නොකළ යුතු යැයි දේශනා කොට ඇත. එයින් උක්කෝටන ලෙස හැඳින්වෙන්නේ,", "options": ["හොර තරාදිවලින් කරන මැනීම *(Measuring/weighing with false scales)*", "රැවටීම් මඟින් කරන වැඩ *(Deceptive work/fraud)*", "හොර පඩිවලින් කරන මැනීම *(Using false weights)*", "හොරට මැනීමෙන් කරන වැඩ *(Measuring falsely/fraudulent measurements)*", "අල්ලස් ගැනීමෙන් කරන මැනීම / අල්ලස් ගැනීම් *(Taking bribes/bribery)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** අධාර්මික වෙළඳ වංචාවල එන **'උක්කෝටන'** යන්නෙන් අදහස් කරන්නේ අල්ලස් ගැනීම (Bribery) මඟින් යුක්තිය පසිඳලීමේදී හෝ ගනුදෙනුවලදී සිදුකරන මහා පරිමාණ වංචාවන්ය."}, {"qNum": 217, "q": "217. කාලාම සූත්‍රයට අනුව \"මෙය මෙසේ යැයි ආරංචිය මාත්‍රයෙන්\" එකවරම සම්මත නොපිළිගත යුතු බව දැක්වෙන්නේ,", "options": ["මා අනුස්සවේන යනුවෙනි. *(Ma anussavena - by oral tradition)*", "මා පරම්පරාය යනුවෙනි. *(Ma paramparaya - by lineage of succession)*", "මා පිටක සම්පදාය යනුවෙනි. *(Ma pitaka-sampadana - by authority of texts)*", "මා ඉති කිරාය යනුවෙනි. *(Ma itikiraya - by hearsay/rumor)*", "මා නය හේතු යනුවෙනි. *(Ma naya-hetu - by logical reasoning)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** In the Kalama Sutta's ten-fold framework, \"Ma itikiraya\" translates to \"do not accept based on rumor or hearsay\" (\"ආරංචිය මාත්‍රයෙන්\").\n\n---"}, {"qNum": 218, "q": "218. ගන්ධාර බුද්ධ ප්‍රතිමාවක් හා මථුරා බුද්ධ ප්‍රතිමාවක් පහසුවෙන්ම හඳුනාගත හැකිය. ඒ අතර ගන්ධාර සම්ප්‍රදායට අයත් ප්‍රතිමා ලක්ෂණයක් නොවන්නේ,", "options": ["මහා කාරුණික ලීලාවයි *(Serene, compassionate expression)*", "ශාක්‍ය සිංහ ලීලාවයි *(Bold, lion-like fearless posture)*", "ආභංග සිරුරයි *(Swaying, bended body posture [Abhanga])*", "අර්ධවන් දෑසත් ය *(Half-closed eyes)*", "ස්වභාවික හිසකෙස් ය *(Natural wavy, curly hair)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** *Abhanga* (or *Tribhanga* - the tri-bent body pose) is a classic feature of indigenous Indian artistic styles (like Mathura and Gupta), whereas Gandhara art utilizes Greek-Roman realistic, standing, and symmetrical bodily alignments."}, {"qNum": 219, "q": "219. \"සබ්බ දානං ධම්ම දානං ජිනාති\" යන පාලි පාඨයෙහි සිංහල අර්ථය වන්නේ,", "options": ["සියලු දානයන්ගෙන් උසස් දානය ධර්ම දානය යි. *(The gift of Dhamma excels all other gifts)*", "සියලු සත්ත්වයන්ට දන් දිය යුතු ය. *(One must give alms to all beings)*", "දන්දීම උතුම් මංගල කරුණක් වෙයි. *(Giving is a great blessing)*", "දන්දීම යුද්ධයකට සමාන වෙයි. *(Giving is comparable to a war)*", "දානය නිවනට මඟ වෙයි. *(Dana is the path to Nirvana)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** This famous verse from the Dhammapada (v. 354) declares that among all forms of giving (such as material wealth, food, or clothing), the gift of Dhamma (sharing knowledge of truth) is the most supreme and excels them all.\n\n---"}, {"qNum": 220, "q": "220. \"අක්කෝධේන ජිනේ කෝධං - අසාධුං සාධුනා ජිනේ", "options": ["මෛත්‍රී කිරීමෙන් ය *(Loving-kindness)*", "සත්පුරුෂ කමිනි *(Goodness/virtue)*", "දන් දීමෙන් ය *(Giving/generosity [Dana])*", "සත්‍ය කථා කිරීමෙන් ය *(Speaking the truth)*", "බණ ඇසීමෙන් ය *(Listening to Dhamma)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** ධම්මපදයේ එන කෝධ වග්ගයට අයත් \"ජිනේ කදරිියං දානේන\" යන පාඨයෙන් උගන්වන්නේ මසුරු (කදරිිය) ගති ඇති පුද්ගලයා දානය හෙවත් දන් දීමෙන් (Generosity/Dana) ජයගත යුතු බවයි."}, {"qNum": 221, "q": "221. පහත දැක්වෙන්නේ බුද්ධකාලීන භාරතීය ආගමික විශ්වාස පිළිබඳ ප්‍රකාශ කිහිපයකි.", "options": ["A සහ B පමණි *(A and B only)*", "A සහ C පමණි *(A and C only)*", "A, B සහ C පමණි *(A, B, and C only)*", "A, B, C සහ D පමණි *(A, B, C, and D only)*", "A, B, C, D සහ E යන සියල්ලමය *(All A, B, C, D, and E)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** All five statements are historically and philosophically correct: Purana Kassapa taught Akiriyavada, Pakudha Kaccayana taught Seven Elements (Sasvatavada), Nigantha Nataputta taught Chatuyama Samvara, Sanjaya Belatthiputta practiced skepticism (Amaravikkhepavada) out of fear of false speech, and Isvaranirmanavada was indeed a pre-Buddhist creationist view rejected by Buddhism."}, {"qNum": 222, "q": "222. බුදුදහම පැමිණීමට පෙර ලක්දිව බොහෝ ආගමික ඇදහීම් හා විශ්වාස පැවතිණි. එම ඇදහීම් හා විශ්වාසයන්ට අනුග්‍රහ දැක් වූ රජෙකු ලෙස පණ්ඩුකාභය රජු හඳුනාගත හැකිය. රජු ආගමික කටයුතු ඉටු කිරීමට පහසුකම් සපයා දීමක් ලෙස 'සොත්ථි ශාලා' නම් ගොඩනැගිලි විශේෂයක් කරවා දුන් බව මහා වංශයේ සඳහන් වේ. එම ගොඩනැගිලි විශේෂය තනවා දෙන ලද්දේ,", "options": ["බ්‍රාහ්මණයින් උදෙසා ය *(For the Brahmins)*", "පරිබ්‍රාජකයින් උදෙසා ය *(For the Parivrajakas)*", "නිගණ්ඨයින් උදෙසා ය *(For the Niganthas)*", "ආජීවකයින් උදෙසා ය *(For the Ajivikas)*", "තාපසයන් උදෙසා ය *(For the Tapasas / Ascetics)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** මහාවංශය සහ එහි ටීකාව වන වංශත්ථප්පකාසිනියට අනුව, පණ්ඩුකාභය රජතුමා විසින් කරවන ලද 'සොත්ථි ශාලා' (Sotthi-sala) යනු **බ්‍රාහ්මණයන් උදෙසා** ඔවුන්ගේ වෛදික යාග, ස්වස්ති (ආශිර්වාද) කටයුතු හෝ ආරෝග්‍ය ශාලා කටයුතු සිදු කිරීම සඳහා පහසුකම් සැලසූ සුවිශේෂී මන්දිර වේ."}, {"qNum": 223, "q": "223. 'මේ කාරණය මෙසේ යැයි ද මට අදහසක් නැත. මේ කාරණය එසේ ම යැයි ද මට අදහසක් නැත. මේ කාරණය වෙනත් සැටියකින් යැයි ද මට අදහසක් නැත...' යනාදි වශයෙන් දැක්වූ දෘෂ්ටිය වන්නේ,", "options": ["නියතිවාදය යි *(Fatalism / Niyativada)*", "සංසාර සුද්ධිවාදය යි *(Purification through Samsara)*", "පුබ්බේකතහේතුවාදය යි *(Past-karma determinism)*", "අමරාවික්ඛේපවාදය යි *(Amaravikkhepavada / Skepticism)*", "භෞතිකවාදය යි *(Materialism)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** Amaravikkhepavada (eel-wriggling skepticism), advocated by Sanjaya Belatthiputta, is characterized by avoiding any definitive stance on philosophical questions."}, {"qNum": 224, "q": "224. ක්‍රි.පූ. 6 වන සියවසේ භාරතය ඉතා දියුණු වාණිජකරණයකට හා නාගරීකරණයකට ලක් වූ අතර පහත දැක්වෙන නාගරික ලක්ෂණයක් ලෙස හඳුනාගත හැක්කේ,", "options": ["සමහර පාලකයින් 'මිථ්‍යා' යන්න නාමවලට එක්කර ගැනීම. *(Some rulers adding 'Mithya' to their names.)*", "සිටුවරුන් ඇතුළු විවිධ ධනවත් සහ උසස් පන්තීන් බිහිවීම. *(The emergence of various wealthy elite classes, including Guild Lords/Setthis.)*", "මගධ කෝට්ටයට අයුධ ප්‍රහාර එල්ල කර ගැනීම. *(Attacking the Magadha fort with weapons.)*", "ශාක්‍ය කෝලිය වංශිකයන් අතර ජලය පිළිබඳ අරගලයක් හටගැනීම. *(Water disputes arising between the Sakyans and Koliyans.)*", "කපිලවස්තු බමුණා ගෝත්‍රික ජීවනෝපාය ජය ගැනීම. *(The Brahmin of Kapilavastu conquering tribal livelihood.)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** Urbanization in the Ganges Valley led to the rise of a powerful merchant and banker class (*Setthis* and *Gahapatis*), who heavily patronized new religious movements."}, {"qNum": 225, "q": "225. යහපත් රාජ්‍ය පාලකයෙක් ගෙනයෑම සඳහා ප්‍රජාව විසින් ද ඉටු කළ යුතු යුතුකම් හා වගකීම් රාශියක් ඇත. ඒ අනුව 'අභිණ්හං සාලිපාතං ... භාග අනුප්පදාස්සාමි' යනුවෙන් බදු ගෙවීම පිළිබඳ ජනතාව පොරොන්දු වී ඇති බව සඳහන් වන්නේ,", "options": ["කූටදන්ත සූත්‍රය තුළ ය. *(Kutadanta Sutta)*", "මහා පරිනිබ්බාන සූත්‍රය තුළ ය. *(Maha Parinibbana Sutta)*", "අංගුත්තර නිකායේ සූත්‍ර තුළ ය. *(Anguttara Nikaya)*", "සංගාහවත්ථු සූත්‍රය තුළ ය. *(Sangahavatthu Sutta)*", "රාජ්‍ය සූත්‍රය තුළ ය. *(Rajja Sutta)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** This canonical quote regarding the systematic offering of portions of harvest as taxes is outlined in the economic and social discourses of the Anguttara Nikaya."}, {"qNum": 226, "q": "226. ෂට් ශාස්තෘන් අතර නාස්තිකවාදී ආගමික දර්ශනයක් හඳුන්වාදෙන ලද්දේ,", "options": ["පූරණ කස්සපය *(Purana Kassapa)*", "මක්ඛලී ගෝසාලය *(Makkhali Gosala)*", "පකුධ කච්චායනය *(Pakudha Kaccayana)*", "අජිත කේසකම්බලය *(Ajita Kesakambala)*", "නිගණ්ඨනාතපුත්තය *(Nigantha Nataputta)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** Ajita Kesakambala was a well-known materialist (Ucchedavada / Nastikavada) who taught that humans are made of four elements and there is no life after death, no fruits of moral actions, and no spiritual world."}, {"qNum": 227, "q": "227. දෙවියන් සහිත ලෝකයාට දිවසින් දැක සම්පරායික යන උභයාර්ථ සිද්ධිය පිණිස අනුශාසනා කරන බැවින් ද දෙවි මිනිසුන්ට ශාස්තෘවරයා මෙන් ම ගුරුවරයා වන බැවින් ද, බුදු රජාණන් වහන්සේ සුවිශේෂ නාමයකින් හඳුන්වන බව අටුවා බුදුගුණ විවරණයෙන් පැහැදිලි වේ. එම බුදුගුණය හැඳින්වෙන්නේ,", "options": ["ලෝකවිදූ නමිනි *(Lokavidu)*", "අරහං නමිනි *(Araham)*", "සත්ථාදේවමනුස්සානං නමිනි *(Sattha deva manussanam)*", "භගවා නමිනි *(Bhagava)*", "සම්මාසම්බුද්ධ නමිනි *(Samma sambuddha)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** 'සත්ථා දේවමනුස්සානං' යනු දෙවි මිනිසුන් ඇතුළු ලෝකයාට මෙලොව ජීවිතය සාර්ථක කරගන්නා ආකාරය (දිට්ඨධම්මික) සහ පරලොව සැප ලබාගන්නා ආකාරය (සම්පරායික) පිළිබඳ අනුශාසනා කරමින්, ඔවුන් සසර කතරින් එතෙර කරවන ශ්‍රේෂ්ඨතම ශාස්තෘවරයා සහ ගුරුවරයා වන බැවින් බුදුරදුන්ට ලැබුණු සුවිශේෂී ගුණයයි."}, {"qNum": 228, "q": "228. බුද්ධ පරිනීර්වාණයෙන් සත් මසක් යෑමට මත්තෙන් ශාසනයේ ඇති වූ අධර්මවාදී ක්‍රියාවන් හේතුවෙන් මහා තෙරුන් විසින් සංගායනාවක් පැවැත්වීමට තීරණය කර ඇත. එසේ ගන්නා ලද තීරණයට අනුව පළමු සංගායනාව පැවැත්වීමට සියලු කටයුතු මහාකාශ්‍යප මහරහතන් වහන්සේ සූදානම් කළ අතර එහි දී මුලින්ම සංගායනා කිරීමට තීරණය කරන ලද්දේ,", "options": ["සුභද්‍ර තෙරුන්ගේ ප්‍රකාශනය සත්‍යාපනය කිරීමයි *(Verifying Subhadra's statement)*", "ධර්මය පිළිබඳ ආනන්ද හිමියන්ගෙන් ප්‍රශ්න කිරීමයි *(Inquiring about Dhamma from Ananda Thera)*", "විනය පිළිබඳ උපාලි තෙරණුවන්ගෙන් විමසීමයි *(Inquiring about Vinaya from Upali Thera)*", "ආනන්ද හිමිට නැගුණ චෝදනාවන්ගෙන් උන්වහන්සේ නිදහස් කිරීමයි *(Exonerating Ananda Thera from accusations)*", "කුඩා අනුකුඩා ශික්ෂා පද පිළිබඳවයි *(Regarding minor training rules)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** ප්‍රථම ධර්ම සංගායනාවේදී මහා කාශ්‍යප මහරහතන් වහන්සේගේ ප්‍රධානත්වයෙන් \"විනයෝ නාම සාසනස්ස ආයු\" යන සිද්ධාන්තය මත මුලින්ම විනය සංගායනා කිරීමට තීරණය කළ අතර, ඒ සඳහා විනයධරයන් අතර අග්‍ර වූ උපාලි මහතෙරුන් වහන්සේගෙන් විනය කරුණු ප්‍රශ්න කරන ලදී."}, {"qNum": 229, "q": "229. බුදුරජාණන් වහන්සේගේ දින චරියාවෙහි දෙවි බඹුන් හමු වී සාකච්ඡා කිරීමට වෙන් කර තිබූ කාලය හැඳින්වෙන්නේ,", "options": ["පෙර බත් කිස නමිනි. *(Pera-bath-kisa - morning session)*", "පසු බත් කිස නමිනි. *(Pasu-bath-kisa - afternoon session)*", "පෙරයම කිස නමිනි. *(Perayama-kisa - first watch of the night)*", "මැදියම් කිස නමිනි. *(Madiyam-kisa - middle watch of the night)*", "පසුයම කිස නමිනි. *(Pasuyama-kisa - last watch of the night)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** The middle watch of the night (Madiyam-kisa, from 10 PM to 2 AM) was reserved for the Buddha to answer queries and preach the Dhamma to celestial beings (Devas and Brahmas).\n\n---"}];

    let currentIdx = 0;
    let userAnswers = {};
    let score = 0;

    function initQuiz() {
      const select = document.getElementById('pagerSelect');
      select.innerHTML = '';
      QUESTIONS.forEach((q, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `ප්‍රශ්නය ${idx + 1} / ${QUESTIONS.length}`;
        select.appendChild(opt);
      });
      renderQuestion();
    }

    function renderQuestion() {
      const qData = QUESTIONS[currentIdx];
      const container = document.getElementById('quizContainer');
      const userAns = userAnswers[currentIdx];
      const isAnswered = userAns !== undefined;

      document.getElementById('statProgress').textContent = `${currentIdx + 1} / ${QUESTIONS.length}`;
      document.getElementById('pagerSelect').value = currentIdx;

      document.getElementById('prevBtn').disabled = currentIdx === 0;
      document.getElementById('nextBtn').disabled = currentIdx === QUESTIONS.length - 1;

      let optionsHtml = '';
      const optLabels = ['(1)', '(2)', '(3)', '(4)', '(5)'];
      
      qData.options.forEach((optText, optIdx) => {
        let extraClass = '';
        if (isAnswered) {
          if (optIdx === qData.correct) {
            extraClass = 'correct';
          } else if (optIdx === userAns) {
            extraClass = 'wrong';
          }
        }

        optionsHtml += `
          <button class="opt-btn ${extraClass}" 
                  ${isAnswered ? 'disabled' : ''} 
                  onclick="selectOption(${optIdx})">
            <span style="font-weight:800;">${optLabels[optIdx] || optIdx + 1}</span>
            <span>${optText}</span>
          </button>
        `;
      });

      let expHtml = '';
      if (isAnswered) {
        expHtml = `
          <div class="exp-box show">
            <div class="exp-title">💡 නිල පිළිතුරු විග්‍රහය (Marking Scheme & Academic Explanation):</div>
            <div class="exp-text">${qData.explanation}</div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="q-header">
          <span class="q-num-badge">ප්‍රශ්නය ${currentIdx + 1} / ${QUESTIONS.length}</span>
        </div>
        <div class="q-text">${qData.q}</div>
        <div class="options-grid">
          ${optionsHtml}
        </div>
        ${expHtml}
      `;
    }

    function selectOption(optIdx) {
      if (userAnswers[currentIdx] !== undefined) return;
      
      userAnswers[currentIdx] = optIdx;
      if (optIdx === QUESTIONS[currentIdx].correct) {
        score++;
      }
      
      updateStats();
      renderQuestion();
    }

    function updateStats() {
      const answeredCount = Object.keys(userAnswers).length;
      document.getElementById('statScore').textContent = `${score} / ${answeredCount}`;
      const pct = answeredCount > 0 ? Math.round((score / answeredCount) * 100) : 0;
      document.getElementById('statPercent').textContent = `${pct}%`;
    }

    function prevQ() {
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
      }
    }

    function nextQ() {
      if (currentIdx < QUESTIONS.length - 1) {
        currentIdx++;
        renderQuestion();
      }
    }

    function jumpToQ(idxStr) {
      currentIdx = parseInt(idxStr, 10);
      renderQuestion();
    }

    window.onload = initQuiz;
  </script>
