  <style>
    :root {
      --bg-dark: #09120c;
      --bg-card: rgba(18, 36, 24, 0.88);
      --bg-card-solid: #122418;
      --border-card: rgba(16, 185, 129, 0.28);
      
      --emerald-primary: #10b981;
      --emerald-light: #d1fae5;
      --emerald-glow: rgba(16, 185, 129, 0.45);

      --amber-accent: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.35);

      --good: #10b981;
      --good-soft: #34d399;
      --good-bg: rgba(16, 185, 129, 0.16);

      --bad: #f43f5e;
      --bad-soft: #fb7185;
      --bad-bg: rgba(244, 63, 94, 0.16);

      --text-main: #f0fdf4;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Serif Sinhala', serif;
      background: radial-gradient(circle at 50% 0%, #153220 0%, var(--bg-dark) 75%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 880px;
    }

    .header-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 1.8rem 1.5rem;
      text-align: center;
      margin-bottom: 1.8rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .header-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #10b981, #f59e0b, #3b82f6, #10b981);
      background-size: 300% 100%;
      animation: gradientFlow 6s linear infinite;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 0%; }
      100% { background-position: 300% 0%; }
    }

    .badge-bar {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }

    .badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--emerald-primary);
      color: #6ee7b7;
      padding: 0.35rem 0.9rem;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.6rem;
      line-height: 1.4;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      margin-top: 1.2rem;
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.8rem 0.5rem;
      text-align: center;
    }

    .stat-val {
      font-size: 1.4rem;
      font-weight: 800;
      color: #34d399;
    }

    .stat-lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .q-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 1.8rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .q-num-badge {
      background: linear-gradient(135deg, var(--emerald-primary), #059669);
      color: #fff;
      padding: 0.35rem 0.8rem;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .q-text {
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.65;
      color: #ffffff;
      margin-bottom: 1.4rem;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .opt-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 1rem 1.2rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.98rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      line-height: 1.5;
    }

    .opt-btn:hover:not(:disabled) {
      background: rgba(16, 185, 129, 0.12);
      border-color: var(--emerald-primary);
      transform: translateX(4px);
    }

    .opt-btn.correct {
      background: var(--good-bg) !important;
      border-color: var(--good) !important;
      color: var(--good-soft) !important;
      font-weight: 700;
    }

    .opt-btn.wrong {
      background: var(--bad-bg) !important;
      border-color: var(--bad) !important;
      color: var(--bad-soft) !important;
    }

    .exp-box {
      margin-top: 1.2rem;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-left: 4px solid #3b82f6;
      border-radius: 12px;
      padding: 1.2rem;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .exp-box.show {
      display: block;
    }

    .exp-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #60a5fa;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .exp-text {
      font-size: 0.92rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 0.75rem 1.4rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--emerald-primary);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .pager-select {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-card);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

ttha Vanijja)*", "මත්ද්‍රව්‍ය විකිණීමයි *(Trading in intoxicants / Majja Vanijja)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** *Sattha* (Sanskrit: *Sastra*) means weapons or instruments of violence. Selling weapons is one of the five prohibited trades for a lay Buddhist because it facilitates violence and killing."}, {"qNum": 9, "q": "09. අනාගාරික ජීවිතය සංවර්ධනය සඳහා උපදෙස් සපයන උපදේශයක් ලෙස මහා මංගල සූත්‍රය පෙන්වා දිය හැකිය. එහි එන 'විරජං' යනු,", "options": ["පාපයෙන් වැළකීම යි. *(Refraining from sin/evil.)*", "ලද දෙයින් සතුටු වීම යි. *(Contentment with what is received.)*", "ශෝක රහිත බව යි. *(Being free of sorrow / Asokam)*", "සැදැහැවතුන්ට ගරු කිරීම යි. *(Honoring the worthy.)*", "කෙලෙස් රහිත බව යි. *(Being completely free of the dust of defilements.)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** \"Virajam\" literally means \"passionless\" or \"free of dust,\" referring to a mind completely cleansed of the dust of mental defilements (*raga*, *dosa*, *moha*)."}, {"qNum": 10, "q": "10. \"ජන්මීය සාධක\" (ජර්මීය සාධක) පදනම් කරගෙන මානව වර්ගයා උසස් පහත් ලෙස වර්ගීකරණය කිරීම බුදුසමය ප්‍රතික්ෂේප කරයි. මෙය තහවුරු වන්නේ,", "options": ["ඓතිහාසික සාධකයෙනි *(Historical evidence)*", "සමාජ විද්‍යාත්මක සාධකයෙනි *(Sociological evidence)*", "ජීව විද්‍යාත්මක සාධකයෙනි *(Biological evidence)*", "ආචාර විද්‍යාත්මක සාධකයෙනි *(Ethical evidence)*", "මනෝ විද්‍යාත්මක සාධකයෙනි *(Psychological evidence)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** In the Vasettha Sutta, the Buddha presents biological arguments, showing that while plants and animals have distinct biological species-specific features (lingam jatimayam), humans are biologically one unified species. Thus, birth-based division has no biological basis."}, {"qNum": 11, "q": "11. සෙන් බුදුදහමේ ආභාසයෙන් ගොඩනැගුණ ජපන් සංස්කෘතිය තුළ විශේෂ කලා සම්ප්‍රදායන් ඇති විය. ඒ සම්ප්‍රදායන් අතරින් නෝ කබුකි ලෙස හැඳින්වෙන්නේ,", "options": ["ඔකුමි නාට්‍ය කලාවයි *(Noh-Kabuki theatrical/drama art)*", "මල් සැකසුම් කලාවයි *(Flower arrangement art [Ikebana])*", "චිත්‍ර කලාවයි *(Painting art)*", "ගීත කලාවයි *(Music/song art)*", "තේපොනෝත්සවයයි *(Tea ceremony [Chado])*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** සෙන් බුදුදහමේ ආභාසය සහ සංකල්ප මත ගොඩනැඟුණු ජපන් සාම්ප්‍රදායික රංග කලා ශෛලීන් වන්නේ **'නෝ' (Noh) සහ 'කබුකි' (Kabuki)** නාට්‍ය කලා සම්ප්‍රදායන්ය."}, {"qNum": 12, "q": "12. දෙවන ධර්ම සංගායනාව සඳහා ප්‍රධාන වූයේ වජ්ජි පුත්තක භික්ෂූන් විසින් ඉදිරිපත් කරන ලද දස වස්තුව වේ. එහි 'අවාස කල්ප' ලෙස සඳහන් වන්නේ,", "options": ["අඟක ලුණු තබාගෙන භාවිතය කැප ය *(Alonaka-kappa: keeping salt in a horn is permissible)*", "දෑඟුලක් ඉර අවරට ගිය කල වැළඳීම කැප ය *(Dwangula-kappa: eating after noon within two finger breadths of shadow is permissible)*", "එකම ආවාසයක පිරිස වෙන වෙනම විනය කර්ම කිරීම කැපය *(Avasa-kappa: performing Vinaya acts in different residences within the same boundary is permissible)*", "කිරිත්, දිකිරිත් නොවූ මැද මට්ටමේ කිරි වැළඳීම කැපය *(Amathita-kappa: drinking unchurned milk/curds is permissible)*", "නොපැසවූ සුරා පානය කිරීම කැපය *(Jalogi-kappa: drinking unfermented palm juice is permissible)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** දෙවන සංගායනාවට හේතු වූ වජ්ජිපුත්තක භික්ෂූන්ගේ දස වස්තුවෙන් **'ආවාස කල්පය' (Avasa-kappa)** යනු එකම සීමාවක් (පරිශ්‍රයක්) ඇතුළත පිහිටි වෙන වෙනම ආවාසවල වෙසෙන භික්ෂූන් පොදුවේ එක් නොවී, වෙන වෙනම පොහොය විනය කර්ම සිදු කිරීම කැපයැයි පැවසීමයි."}, {"qNum": 13, "q": "13. බුද්ධකාලීන භාරතයේ පාලකයින් බුදුදහම වැළඳ ගැනීම නිසා ඔවුන්ගේ දේශපාලන ක්‍රියාවලියට ධාර්මික මුහුණුවරක් ලැබුණි. මීට කදිම නිදසුනක් වන්නේ,", "options": ["අජාසත් රජු මගධයේ බලය අල්ලා ගැනීම. *(King Ajatasattu capturing Magadha's throne.)*", "කෝසල රජු බරණැස ආක්‍රමණය කිරීම. *(King Kosala invading Varanasi.)*", "බිම්බිසාර රජු යුද්ධයෙන් සතුරන් මර්දනය කිරීම. *(King Bimbisara crushing enemies in war.)*", "අශෝක රජු 'දිග්විජය' ප්‍රතිපත්තිය අත්හැර 'ධර්මවිජය' ප්‍රතිපත්තිය වැළඳ ගැනීම. *(King Ashoka abandoning military conquest [Dig-vijaya] in favor of righteous conquest [Dharma-vijaya].)*", "උදේන රජු බමුණන්ට දඬුවම් පැමිණවීම. *(King Udena punishing Brahmins.)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** Emperor Ashoka, moved by the horrors of the Kalinga war, renounced violent military expansions and dedicated his empire to the propagation of ethical values and peace (Dharma-vijaya)."}, {"qNum": 14, "q": "14. තායිලන්තයේ මුල් කාලීන 'ද්වාරවතී' බෞද්ධ ශිෂ්ටාචාරයේ දක්නට ලැබෙන බුද්ධ ප්‍රතිමා කෙරෙහි දැඩි ලෙස බලපා ඇත්තේ,", "options": ["ගන්ධාර කලා සම්ප්‍රදාය යි. *(Gandhara style)*", "මථුරා කලා සම්ප්‍රදාය යි. *(Mathura style)*", "සාරනාත් කලා සම්ප්‍රදාය යි. *(Sarnath style)*", "අනුරාධපුර මහා විහාර සම්ප්‍රදාය යි. *(Anuradhapura Maha Vihara style)*", "අමරාවතී කලා සම්ප්‍රදාය යි. *(Amaravati style)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** The bronze standing Buddha images from the Dvaravati period (7th–11th century CE) bear striking stylistic similarities to the classical Buddha statues of Anuradhapura, Sri Lanka."}, {"qNum": 15, "q": "15. සොළොස්මහා ජනපද වලින් එකක් වන අවන්ති ජනපදයේ අගනුවර ලෙස හැඳින්වෙන්නේ,", "options": ["උදේනි නුවර යි. *(Ujjayani / Udeni)*", "රජගහ නුවර යි. *(Rajagaha)*", "සැවැත් නුවර යි. *(Savatthi)*", "කොසඹෑ නුවර යි. *(Kosambi)*", "මධුරා නුවර යි. *(Madhura)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** The kingdom of Avanti (modern Malwa region) had its capital at Ujjayani (Udeni) in its northern part and Mahissati in the south.\n\n---"}, {"qNum": 16, "q": "16. පුද්ගලයාගේ ආධ්‍යාත්මික සංවර්ධනය සඳහා යොමුවීම ආශ්‍රම ධර්මවල අවසාන අංග දෙකෙන් අවධාරණය කෙරේ. පුද්ගලයාගේ ආධ්‍යාත්මික සංවර්ධනය බුදුසමය අගය කරන නමුත් බ්‍රාහ්මණ සම්ප්‍රදායට අයත් එම ඉගැන්වීම විචාරයට හා විවේචනයට ලක් කරයි. ඊට පදනම්ව ඇත්තේ,", "options": ["ආධ්‍යාත්මික සංවර්ධනය ජීවිතයේ ඕනෑම කාලයක දී කළ හැකිය යන්නය. *(Spiritual development can be pursued at any stage of life.)*", "එය කාන්තාවන්ට පමණක් සීමා විය යුතු බැවිනි. *(It should be restricted to women only.)*", "සන්න්‍යාසීන්ට පමණක් ආධ්‍යාත්මික දියුණුව හිමි වන බැවිනි. *(Only ascetics are entitled to spiritual progress.)*", "බ්‍රාහ්මණ පූජකයන්ගේ මඟපෙන්වීමකින් තොරව එය කළ නොහැකි බැවිනි. *(It cannot be done without the guidance of Brahmin priests.)*", "එය හුදෙක් ලෞකික සම්පත් රැස් කිරීමක් පමණක් වන බැවිනි. *(It is merely a collection of worldly resources.)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** Buddhism rejects the idea that spiritual striving must wait until old age (the Vanaprastha/Sannyasa stages). According to Buddhism, anyone can strive for and attain Nirvana at any stage of life, even in youth (as seen with young monks like Rahula or Sumana).\n\n---\n\n### Page 2"}, {"qNum": 17, "q": "17. පුද්ගලයා කරනු ලබන ක්‍රියා කුසල ක්‍රියා හා අකුසල ක්‍රියා වශයෙන් දෙයාකාර වේ. එවැනි කුසලාකුසල ගණයට වැටෙන ක්‍රියා කිහිපයක් පහත දැක්වේ.", "options": ["A, B, C", "B, C, E", "B, C, F", "C, E, F", "D, E, F"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** Slandering (C), Adultery (B), and holding wrong views (F) are part of the ten unwholesome actions (*Dasa Akusala*), while Veyyavacca, Apacayana, and Ditthijukamma are wholesome (*Dasa Punna Kriya*)."}, {"qNum": 18, "q": "18. නිහඬගිරි මධ්‍ය මහා විද්‍යාලයේ බෞද්ධ ශිෂ්‍ය සංගමයේ රැස්වීම් මාසයකට වරක් පැවැත්වේ. එහිදී විදුහල්පතිතුමා අනුශාසනාවක් පවත්වමින්, \"ගුණ ගරුක යහපත් දරුවන් වීමට නම් තමා වෙතින් වැරදි, අනුන් වෙතින් වැරදිත් වළක්වා, අනුන් කරන වැරද අනුබල නො දී කටයුතු කළ යුතු බවත් එම අවබෝධය ඇති දරුවා තමන්ටත් අනුන්ටත් වරදක් නො කරන බවත්\" සදහන් කළේය. මෙහි කියැවෙන බෞද්ධ මූලධර්මය වන්නේ,", "options": ["අත්තුපනායික ධර්ම පර්යාය යි. *(Atthupanaika Dharma Pariyaya)*", "ත්‍රිකෝටි පාරිශුද්ධ ශීලය යි. *(Trikoti Parishuddha Seela / Threefold Purity of Virtue)*", "පංචශීල ප්‍රතිපත්තිය යි. *(The Five Precepts)*", "ත්‍රිවිධ අධිපති ධර්මය යි. *(The Threefold Governing Principle)*", "විරතිය හා සමාදානය යි. *(Abstention and Practice)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** වි . *(Atthi sukha - happiness of ownership)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** In the Anana Sutta, the Buddha explains four types of happiness for a householder. The first is Atthi Sukha—the joy of ownership, knowing one possesses righteously acquired wealth earned through hard work.\n\n---"}, {"qNum": 22, "q": "22. බ්‍රාහ්මණ ඉගැන්වීම් මඟින් කාන්තාව විවිධ වූ ගිහි වීථි වලට යටත් කොට පාලනය කරන ලදි. ඇය සිය ජීවිත කාලය පුරාවට ස්වාමියාට පති භක්තියෙන් යුතුව වාසය කළ යුතු ද ඉටුකළ යුතු ය. ඒ අනුව බිරිඳ තම ස්වාමියා වෙනුවෙන් ඉටුකළ යුතු උසස්ම චාරිත්‍රය වන්නේ,", "options": ["ස්වාමියාගේ දෙමව්පියන් හොඳින් රැකබලා ගැනීමයි. *(To take good care of her husband's parents.)*", "දරුවන්ගේ හා නිවසේ කටයුතු සියල්ල මැනවින් ඉටු කිරීමයි. *(To perform all duties of the children and the household well.)*", "ස්වාමි පුරුෂයාට නොඅඩුව සිය සිතැඟි ඉටු කර ගැනීමට ඉඩ දීමයි. *(To allow her husband to fulfill his desires without lack.)*", "ස්වාමි පුරුෂයා මියගිය පසු වැඩිමහල් පුතු යටතේ විවාහක ජීවිතයක් ගත කිරීමයි. *(To live a married life under the eldest son after the husband dies.)*", "ස්වාමි පුරුෂයා මළ පසු සති පූජාව පැවැත්වීමයි. *(To perform the Sati ritual [self-immolation] after her husband's death.)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** වෛදික හා පසු-වෛදික බ්‍රාහ්මණ සමාජයේ (විශේෂයෙන් මනුස්මෘති ඉගැන්වීම් තුළ) කාන්තාව පුරුෂයාට අතිශයින්ම යටත් කර තිබුණි. එහිදී බිරිඳකගෙන් බලාපොරොත්තු වූ අත්‍යන්ත පතිභක්තියේ උසස්ම සහ කූටප්‍රාප්ත චාරිත්‍රය වූයේ ස්වාමිපුරුෂයා මියගිය පසු ඔහුගේ දේහය දැවෙන දරසෑයට පැන සිය දිවි හානි කරගැනීම හෙවත් **'සති පූජාව' (Sati Rite)** යි."}, {"qNum": 23, "q": "23. “ජපන් අශෝක”, “දෙවන අශෝක” යන විරුදාවලි නාමයන්ගෙන් හැඳින්වෙන ජපන් රාජ්‍ය පාලකයා වන්නේ,", "options": ["කිමීදෙයි රජුය *(Emperor Kimmei)*", "ෂෝතොකු තෛෂි කුමාරයාය *(Prince Shotoku Taishi)*", "යොෂිමෙයි රජුය *(Emperor Yoshimei)*", "මොන්නොනොබේ වංශිකයාය *(The Mononobe clan leader)*", "නකනොමේ වංශිකයාය *(The Nakatomi clan leader)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** Prince Shotoku Taishi (574–622 AD) is hailed as the \"Ashoka of Japan\" because he adopted Buddhism, proclaimed it the state religion, authored the 17-Article Constitution based on Buddhist principles, and built numerous temples (like Horyu-ji)."}, {"qNum": 24, "q": "24. බුදුදහම සමාජයේ සාමකාමී පැවැත්ම උදෙසා පංචශීල ප්‍රතිපදාව අවධාරණය කරයි. මෙහි දී තුන්වන ශික්ෂාපදය වන \"කාමේසුමිච්ඡාචාරා වේරමණී\" ශික්ෂාපදයෙන් මූලිකවම ආරක්ෂා කෙරෙන්නේ,", "options": ["ජීවත්වීමේ අයිතියයි *(The right to life)*", "පෞද්ගලික දේපළ අයිතියයි *(The right to private property)*", "පවුල් සංස්ථාවේ පවිත්‍රත්වය හා සුරක්ෂිතභාවයයි *(Purity and security of the family institution)*", "සත්‍යය ප්‍රකාශ කිරීමේ අයිතියයි *(The right to speak the truth)*", "ශාරීරික සෞඛ්‍යයයි *(Physical health)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** The third precept protects trust, mutual respect, and stability within marital relationships and families, preventing social conflicts arising from sexual misconduct."}, {"qNum": 25, "q": "25. මහාවංශයේ වංශකථාවන්හි සඳහන් වන ආකාරයට ශ්‍රී මහා බෝධීන් වහන්සේ ලංකාවට වැඩම කරවන පෙරහැරකින් අනුරාධපුර නගරය කරා වැඩම කරද්දී එක්තරා බ්‍රාහ්මණ ග්‍රාමයක දින තුනක් තැන්පත් කර තබා පුද පූජා පැවැත් වූ බව සදහන් වේ. එම ග්‍රාමය වන්නේ,", "options": ["පණ්ඩුල බ්‍රාහ්මණ ග්‍රාමය යි. *(Pandula Brahmana village)*", "නිවත්ත බ්‍රාහ්මණ ග්‍රාමය යි. *(Nivatta Brahmana village)*", "සෝතිජ බ්‍රාහ්මණ ග්‍රාමය යි. *(Sotija Brahmana village)*", "උපතිස්ස බ්‍රාහ්මණ ග්‍රාමය යි. *(Upatissa Brahmana village)*", "තිවක්ක බ්‍රාහ්මණ ග්‍රාමය යි. *(Tivakka Brahmana village)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** විෂය නිර්දේශයේ සම්මත කරුණු සහ ඓතිහාසික සාධක අනුව වරණ **(5)** නිවැරදි පිළිතුර වේ."}, {"qNum": 26, "q": "26. අදිටන් ලාභයට ස්ත්‍රීත්වය බාධාවක් නොවන බව පැවැසෙන්නේ,", "options": ["බුදුරදුන් කොසොල් රජු සැනසීමට කළ ප්‍රකාශයෙනි. *(Buddha's statement comforting King Kosala.)*", "කුණ්ඩලකේසී පිළිබඳ කතා ප්‍රවෘත්තියෙනි. *(The story of Kundalakesi.)*", "සෝමා තෙර ons in Savatthi, Kosala.\n\n---\n\n### Page 3"}, {"qNum": 48, "q": "48. පුද්ගලයාගේ ජීවන ගමන බ්‍රාහ්මණ ඉගැන්වීම් මඟින් ආශ්‍රම ධර්ම හතරකට බෙදා පෙන්වයි. ඒ අනුව බ්‍රාහ්මණයෙකු තම ජීවිතයේ අවසාන භාගයේ දී නිවන හෝ මෝක්ෂය සාක්ෂාත් කර ගැනීම සඳහා ගත යුතු ආශ්‍රමය වන්නේ,", "options": ["බ්‍රහ්මචර්ය ආශ්‍රමයයි *(Brahmacarya - student stage)*", "ගෘහස්ථ ආශ්‍රමයයි *(Grhastha - householder stage)*", "වානප්‍රස්ථ ආශ්‍රමයයි *(Vanaprastha - forest-dweller stage)*", "සන්න්‍යාස ආශ්‍රමයයි *(Sannyasa - ascetic/renunciant stage)*", "ශුද්‍රාශ්‍රමයයි *(Shudra stage)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** Sannyasa is the fourth and final stage of the Ashrama system where a person renounces all worldly possessions and lives as an ascetic to attain Moksha."}, {"qNum": 49, "q": "49. භාරතය තුළ වාණිජකරණය ජාත්‍යන්තර වශයෙන් දියුණු තත්ත්වයකට පත්ව තිබුණු බවට දැක්විය හැකි සාධකය වන්නේ,", "options": ["භාණ්ඩ නිෂ්පාදනය කිරීම ඉහළ යෑමයි. *(Increase in production of goods.)*", "නගර නිර්මාණය වීමයි. *(The creation/urbanization of cities.)*", "සේද මාවත ඔස්සේ කළ වෙළඳාමයි. *(Trade conducted along the Silk Road.)*", "ගංගා මිටියාවත ඔස්සේ භාණ්ඩ වෙළඳාමයි. *(Trade of goods along the river valleys.)*", "කෘෂි නිෂ්පාදනවලින් ස්වයංපෝෂණය වීමයි. *(Self-sufficiency in agricultural products.)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** පුරාණ භාරතීය ආර්ථිකයේ ජාත්‍යන්තර වෙළඳ සබඳතා දියුණු මට්ටමක පැවති බව තහවුරු වන ප්‍රධානතම සාධකය වන්නේ ගොඩබිම් සහ සමුද්‍රීය **සේද මාවත (Silk Road)** ඔස්සේ රෝමය, පර්සියාව, මැදපෙරදිග සහ චීනය වැනි දේශයන් සමඟ සිදුකළ මහා පරිමාණ වෙළඳ කටයුතුයි."}, {"qNum": 50, "q": "50. ශ්‍රී ලංකාවේ ඉපැරණි බෞද්ධ මධ්‍යස්ථාන මඟින් ඉටු වූ ශාසනික කාර්යභාරය අතිමහත් ය. ඒ අනුව ත්‍රිපිටකය ග්‍රන්ථාරූඪ කිරීම, පාලි අටුවා රචනා කිරීම, විනය සංගායනාවක් පැවැත්වීම ආදී ධර්ම ශාස්ත්‍රීය සේවාවන් ඉටු කරන ලද්දේ,", "options": ["අභයගිරි විහාරයේ මූලිකත්වයෙන් ය *(The leadership of Abhayagiri Vihara)*", "මහා විහාරයේ මූලිකත්වයෙන් ය *(The leadership of Maha Vihara)*", "ජේතවන විහාරයේ මූලිකත්වයෙන් ය ons.)*", "කයින් තුනක් ද වචනයෙන් හතරක් ද මනසින් තුනක් වශයෙනි. *(3 bodily, 4 verbal, and 3 mental actions.)*", "කයින් හතරක් ද, වචනයෙන් හතරක් ද, මනසින් දෙකක් වශයෙනි. *(4 bodily, 4 verbal, and 2 mental actions.)*", "කයින් හතරක් ද, වචනයෙන් දෙකක් ද, මනසින් හතරක් වශයෙනි. *(4 bodily, 2 verbal, and 4 mental actions.)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** දස කුසල් සිදු වන්නේ: කය ද්වාරයෙන් 3ක් (ප්‍රාණඝාත, අදත්තාදාන, කාමේසුමිච්ඡාචාරවලින් වැළකීම), වචනයෙන් 4ක් (මුසාවාද, පිසුණාවාච, පරුසාවාච, සම්ඵප්පලාපවලින් වැළකීම), මනසින් 3ක් (අභිජ්ඣා, ව්‍යාපාද, සම්මාදිට්ඨි ඇති කර ගැනීම) වශයෙනි."}, {"qNum": 54, "q": "54. පහත දැක්වෙන්නේ බුද්ධකාලීන ශ්‍රාවකයන් වහන්සේලා විසින් දේශනා කරන ලද සූත්‍ර කිහිපයකි.", "options": ["A, B, C *(A, B, and C)*", "A, C, D *(A, C, and D)*", "B, C, E *(B, C, and E)*", "B, D, E *(B, D, and E)*", "C, D, E *(C, D, and E)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** Suttas such as the Sangiti Sutta (A) and Dasuttara Sutta (C), along with Gulissani Sutta (D), were delivered by Sariputta to assist monks in systemizing and memorizing doctrinal terms."}, {"qNum": 55, "q": "55. සෞන්දර්ය රසස්වාදය බුදුසමයට අනුචිත නොවන්නකි. තථාගතයන් වහන්සේ මෙන්ම විරාගී සත්ත්වයන් ද නිරාමිස සෞන්දර්ය රසස්වාදය කළ බව බෞද්ධ මූලාශ්‍ර තුළ දක්නට ලැබේ. එහි සෞන්දර්ය රසස්වාදයේ මුලිම පදනම ලෙස දක්වා ඇත්තේ,", "options": ["ප්‍රසාදය හා නිර්වේදය ඉපදවීම යි. *(Generating inspiration/clarity and spiritual disillusionment [Prasada and Nirveda])*", "සුඛාස්වාදය ජනිත කරවීම යි. *(Producing mundane pleasure)*", "ඉන්ද්‍රිය පිනවීම යි. *(Gratification of the senses)*", "ආමිස සුවය විඳ ගැනීම යි. *(Enjoying worldly comforts)*", "විරාගය ඇති කිරීම යි. *(Cultivating passionlessness)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** විෂය නිර්දේශයේ සම්මත කරුණු සහ ඓතිහාසික සාධක අනුව වරණ **(1)** නිවැරදි පිළිතුර වේ."}, {"qNum": 56, "q": "56. මහත් වූ ප්‍රඥා ඇති ශ්‍රාවකයින් අතරින් අග්‍රස්ථානයට පත් වූයේ,", "options": ["මුගලන් මහරහතන් වහන්සේ ය. *(Ven. Maha Moggallana)*", "සැරියුත් මහරහතන් වහන්සේ ය. *(Ven. Sariputta)*", "කාශ්‍යප මහරහතන් වහන්සේ ය. *(Ven. Maha Kassapa)*", "අස්සජී මහරහතන් වහන්සේ ය. *(Ven. Assaji)*", "අඤ්ඤාකොණ්ඩඤ්ඤ මහරහතන් වහන්සේ ය. *(Ven. Anna Kondanna)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** Ven. Sariputta was declared by the Buddha as the chief disciple (*Etadagga*) in supreme wisdom (*Maha-prajna*).\n\n---"}, {"qNum": 57, "q": "57. බුදුසමය ලක්දිවට පැමිණීමට පෙර මෙරට ජනතාව අතර විවිධ වූ ඇදහිලි ක්‍රම පැවතිණි. ඒ අතර මළවුන් පිදීම, යක්ෂ වන්දනාව ප්‍රධාන විය. මළවුන් පිදීම බෞද්ධකරණය වූයේ,", "options": ["ස්තූප වන්දනාව හඳුන්වා දීමෙනි. *(Introducing Stupa worship.)*", "මළගිය ඥාතීන්ට පිං පැමිණවීමේ චාරිත්‍රය හඳුන්වා දීමෙනි. *(Introducing the ritual of transferring merits to deceased relatives [Pattidana/Pattanumodana].)*", "බෝධි පූජා පැවැත්වීමෙනි. *(Conducting Bodhi Pujas.)*", "දේව වන්දනාව ආරම්භ කිරීමෙනි. *(Starting deity worship.)*", "යක්ෂයින් පලවා හැරීමෙනි. *(Chasing away Yakkhas.)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** Early Sri Lankans believed that ancestors became Yakkhas who needed to be appeased. Buddhism redirected this by teaching that living relatives can perform meritorious deeds (like giving alms) and transfer the merits to the deceased, converting a superstitious ritual into an ethical-spiritual act of gratitude."}, {"qNum": 58, "q": "58. බුදුසමයේ දක්නට ලැබෙන චින්තන නිදහස සහ විමර්ශනශීලී බව මැනවින් පැහැදිලි වන සූත්‍ර දේශනාව වන්නේ,", "options": ["සිඟාලෝවාද සූත්‍රයයි *(Sigalovada Sutta)*", "ව්‍යග්ඝපජ්ජ සූත්‍රයයි *(Vyagghapajja Sutta)*", "කාලාම සූත්‍රයයි *(Kalama Sutta)*", "මංගල සූත්‍රයයි *(Mangala Sutta)*", "ධම්මචක්කප්පවත්තන සූත්‍රයයි *(Dhammacakkappavattana Sutta)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** In the Kalama Sutta, the Buddha advises the Kalamas of Kesaputta not to accept teachings blindly out of tradition, hearsay, or respect for a teacher, but to examine them logically and accept them only when they are found to be wholesome and beneficial."}, {"qNum": 59, "q": "59. “තේජෝ බල පරාක්‍රමයෙන් යුතු රජ කුල ලක්ෂ සංඛ්‍යාත රජදරුවන්ගෙන් ගැවසීගත් ලෝක ඉතිහාසය නැමැති ගගන තලයේ අශෝක දීප්තිමත් තාරකාවක් ලෙස විරාජමාන වෙයි.” සංක්ෂිප්ත ලෝක ඉතිහාසයක් රචනා කළ H.G. වෙල්ස් අශෝක රජු දුටු අයුරුයි. එතුමා පිළිබඳ සාවද්‍ය කරුණ වන්නේ,", "options": ["තෙවන ධර්ම සංගායනාවට දායකත්වය හා රාජ්‍ය අනුග්‍රහය ලබා දීමයි. *(Providing state patronage to the Third Buddhist Council.)*", "වෙහෙර විහාර අසූහාර දහසක් ඉදි කිරීමයි. *(Constructing 84,000 monasteries and stupas.)*", "විනය විභාෂා ග්‍රන්ථ හා උපදේශ ශාස්ත්‍රය තඹ තහඩුවල ලියා ගල්මුවා මංජුසාවක තැන්පත් කර මහා සෑයක් ඉදිකිරීමයි. *(Writing Vinaya Vibhasha and Upadesha Sastra on copper plates, placing them in stone boxes, and erecting a stupa.)*", "ධර්මදූත කණ්ඩායම් නවයක් පිටත් කර හැරීමයි. *(Sending out nine Dhamma missionary groups.)*", "ධර්මමහාමාත්‍ර නම් නිලධාරීන් පත් කර බුදුදහමේ ව්‍යාප්තිය සිදු කිරීමයි. *(Appointing Dharma-mahamatras to expand Buddhism.)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** Writing the commentaries on copper plates and placing them in a stupa was a service rendered by King Kanishka during the Fourth Buddhist Council in Kashmir, not by King Ashoka."}, {"qNum": 60, "q": "60. 'සිබ්බිකාසාලා' සහ 'සොත්ථිසාලා' යන ගොඩනැගිලි ඉදි කළ පැරණි ලාංකේය පාලකයා කවුරුන් ද?", "options": ["දේවානම්පියතිස්ස රජතුමා ය. *(King Devanampiya Tissa)*", "පණ්ඩුකාභය රජතුමා ය. *(King Pandukabhaya)*", "දුටුගැමුණු රජතුමා ය. *(King Dutugemunu)*", "වලගම්බා රජතුමා ය. *(King Valagamba)*", "මහසෙන් රජතුමා ය. *(King Mahasen)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** King Pandukabhaya constructed various religious and welfare structures in Anuradhapura, including the 'Sivika-sala' (associated with Shiva/Sakti worship) and 'Sotthi-sala' (hospitals or halls for Brahmins)."}, {"qNum": 61, "q": "61. පුද්ගලයෙකු විසින් නොකළ යුතු වෙළඳාම් 5ක් වණිජ්ජා සූත්‍රයෙහි සඳහන් වේ. එයින් \"මජ්ජ වණිජ්ජා\" යනු,", "options": ["වහලුන්, සතුන් වෙළඳාමයි. *(Satta vanijja - human/animal trafficking)*", "ආයුධ වෙළඳාමයි. *(Sattha vanijja - trade in weapons)*", "වස විෂ වෙළඳාමයි. *(Visa vanijja - trade in poisons)*", "මස් වෙළඳාමයි. *(Mamsa vanijja - trade in meat/livestock for slaughter)*", "මත්පැන් හා මත් ද්‍රව්‍ය වෙළඳාමයි. *(Majja vanijja - trade in intoxicants)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** Majja Vanijja is the trade in intoxicating drinks and recreational drugs, which is strictly prohibited for a lay follower practicing Right Livelihood.\n\n---"}, {"qNum": 62, "q": "62. දස රාජ ධර්මයට ඇතුළත් නොවන කරුණක් වන්නේ,", "options": ["දානය යි. *(Dana - Almsgiving/Liberality)*", "ශීලය යි. *(Sila - Morality)*", "පරිත්‍යාගය යි. *(Pariccaga - Self-sacrifice)*", "භාවනාව යි. *(Bhavana - Meditation)*", "අවිහිංසාව යි. *(Avihimsa - Non-violence)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** The Ten Royal Virtues are Dana, Sila, Pariccaga, Ajjava (honesty), Maddava (gentleness), Tapa (self-control), Akkodha (non-anger), Avihimsa (non-violence), Khanti (patience), and Avirodhana (non-opposition). Meditation (Bhavana) is a spiritual practice, not part of this statecraft list.\n\n---"}, {"qNum": 63, "q": "63. විද්‍ය සූත්‍රයන් (or Vijaya Sutta) තුළ පැවතිය යුතු ගුණාංග කිහිපයක් බුදුරජාණන් වහන්සේ දේශනා කර ඇත. එහිදී තපෝ වැදගත් වනුයේ,", "options": ["සීලයෙන් වැඩි යන්න යි. *(Greater in virtue)*", "ගුණයෙන් වැඩි යන්න යි. *(Greater in qualities)*", "නැණවත් බවින් වැඩි යන්න යි. *(Greater in wisdom/intelligence)*", "වයසින් වැඩි යන්න යි. *(Greater in age)*", "නුවණින් වැඩි යන්න යි. *(Greater in intellect)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** Tapa (ascetic fervor) denotes self-control and burning away impurities, which in Buddhist scriptural analysis is linked to the development of higher wisdom and restraint.\n\n---"}, {"qNum": 64, "q": "64. නාරා යුගයේදී විනයේ ප්‍රචලිතව පැවති බෞද්ධ සම්ප්‍රදායන් හයක් ජපානය තුළ ක්‍රියාත්මක වී ඇත. එයින් විනය පදනම් කරගත් සම්ප්‍රදාය හඳුන්වන්නේ,", "options": ["කුෂා නමිනි. *(Kusha-shu - Kusha school)*", "ජෝජිත්සු නමිනි. *(Jojitsu-shu)*", "රිත්සු නමිනි. *(Ritsu-shu / Ritsu school)*", "සන්රොන් නමිනි. *(Sanron-shu)*", "කෙගොන් නමිනි. *(Kegon-shu)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** The Ritsu school (Ritsu-shu) was founded in Japan by the Chinese monk Jianzhen (Ganjin), focusing entirely on Vinaya rules, ordination lineage, and monastic discipline.\n\n---"}, {"qNum": 65, "q": "65. ධන සම්පත් කළමනාකරණය පිළිබඳ වටිනා ධර්ම උපදේශයක් සපයන සිඟාලෝවාද සූත්‍රයේ 'ඒකේන භෝගේ භුඤ්ජෙය්‍ය...' යන ගාථාවට අනුව යමෙකු තමා උපයන කළ යුත්තේ කොටස්", "options": ["එකකි. *(One portion)*", "දෙකකි. *(Two portions)*", "තුනකි. *(Three portions)*", "හතරකි. *(Four portions)*", "පහකි. *(Five portions)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** The stanza instructs dividing income into four parts: one part for consumption, two parts for business/investment, and one part saved for emergencies."}, {"qNum": 66, "q": "66. වීරාසනයෙන් හෝ පද්මාසනයෙන් හෝ හිඳ උකුළ මත විවෘත කල වම් අල්ල උඩ දකුණු අල්ල පිහිටුවා සන්සුන් ව සිටින ඉරියව්ව හැඳින්වෙන්නේ,", "options": ["ධ්‍යාන මුද්‍රාව ලෙසයි *(Dhyana Mudra - meditation posture)*", "ධර්ම චක්‍ර මුද්‍රාව ලෙසයි *(Dharmachakra Mudra - turning the wheel of Dhamma)*", "අභය මුද්‍රාව ලෙසයි *(Abhaya Mudra - fearlessness)*", "භූමි ස්පර්ශ මුද්‍රාව ලෙසයි *(Bhumisparsha Mudra - touching the earth)*", "වරද මුද්‍රාව ලෙසයි *(Varada Mudra - boon-granting)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** පද්මාසනයෙන් වැඩ හිඳ, දකුණු අල්ල වම් අල්ල මත උඩු අතට තබාගෙන, දෑස් අඩවන්ව භාවනානුයෝගීව සන්සුන්ව වැඩ සිටින ඉරියව්ව නිරූපණය වන බුද්ධ ප්‍රතිමා කලාවේ ප්‍රකට ශෛලිය **'ධ්‍යාන මුද්‍රාව' (Dhyana Mudra)** නම් වේ."}, {"qNum": 67, "q": "67. \"නත්ථි මහාරාජ හේතු, නත්ථි පච්චයෝ සත්තානං සංකිලේශාය... සත්තා සංකිලිස්සන්ති... නත්ථි හේතු නත්ථි පච්චයෝ සත්තානං විසුද්ධියා...\" යනාදී ඉගැන්වීම් ඉදිරිපත් කළ ශාස්තෘවරයා වූයේ,", "options": ["අජිත කේස . *(Abhayagiri Stupa)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** During the Buddha's first visit to Sri Lanka (to Mahiyangana), God Sumana Saman attained Sotapanna and requested a relic. The Buddha gave him a lock of hair, which Sumana enshrined in an emerald stupa, founding Mahiyangana Seya.\n\n---"}, {"qNum": 79, "q": "79. පහත සඳහන් ප්‍රකාශ අතුරින් බුද්ධකාලීන භාරතීය කාන්තාව පිළිබඳ බ්‍රාහ්මණ ඉගැන්වීම් වලට අදාළව වඩාත්ම නිවැරදි ප්‍රකාශය වන්නේ,", "options": ["ජීවිතාන්තය දක්වාම පුරුෂාධිපත්‍යයට යටත්ව වාසය කළ යුතුය. *(Must live under male authority until death.)*", "ස්වාමියා මළ පසු සති පූජාව පැවැත්වීම අනිවාර්ය විය. *(Performing Sati after husband's death was mandatory.)*", "කාන්තාවට ආගමික කටයුතුවලට සහභාගි වීමට හැකි වූයේ ස්වාමියා සමඟ පමණි. *(Could participate in religious activities only with her husband.)*", "කාන්තාවට ප්‍රමාණවත් ආගමික නිදහසක් හිමි විය. *(Had adequate religious freedom.)*", "විවාහයෙන් පසුව පිරිමි දරුවෙකු බිහි කිරීම අනිවාර්ය විය. *(Giving birth to a male child after marriage was mandatory.)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** According to Manu Smrti, a woman must never be independent. She is protected by her father in childhood, her husband in youth, and her sons in old age (\"na stri svatantryam arhati\")."}, {"qNum": 80, "q": "80. ලාංකේය රාජ්‍ය පාලනයට බුදුදහමේ ආභාසය ලැබී ඇති ආකාරය විවිධ සාධකයන්ගෙන් හඳුනාගත හැකිය. ඒ අතර වැදගත් ලක්ෂණයක් වන්නේ ලාංකේය පාලකයින්ට අනුශාසනා කිරීමට භික්ෂූන් මූලික වීම යි එහි දී දුටුගැමුණු රජුට අනුශාසනා කරන ලද්දේ,", "options": ["මිහිඳු මහ රහතන් වහන්සේ ය *(Mihindu Maha Arahant)*", "ගෝධගත්තතිස්ස හිමියන් ය *(Godhagatta Tissa Thera)*", "කුටිකණ්ණ තිස්ස හිමියන් ය *(Kutikanna Tissa Thera)*", "මලියදේව හිමියන් ය *(Maliyadeva Thera)*", "අරිට්ඨ තෙරුන් ය *(Aritta Thera)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** දුටුගැමුණු රජු සහ සද්ධාතිස්ස කුමරු අතර ඇති වූ දෙසොහොයුරු අර්බුදයේදී දෙමටමල් විහාරයේ භික්ෂූන්ගේ උපකාරයෙන් බේරී ගිය තිස්ස කුමරු පසුව දීඝවාපි (Ananda Thera)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** චණ්ඩශෝක ලෙස මහා යුද්ධ මෙහෙයවූ අශෝක රජතුමා, වීදිය දිගේ සංසුන්ව වැඩම කළ සත් හැවිරිදි **නිග්‍රෝධ සාමණේරයන් වහන්සේගේ** ඉරියව් දැක පැහැදී, පසුව උන්වහන්සේගෙන් අප්පමාද වග්ගයට අයත් දහම් කරුණු ශ්‍රවණය කොට බුදුදහම වැළඳගෙන ධර්මාශෝක බවට පත් විය."}, {"qNum": 89, "q": "89. සද්ධර්මාලංකාරයේ එන \"ස්වර්ණ තිලකා\" කථා වස්තුව ඇසුරින් නිර්මිත රමණීය දෘශ්‍ය කාව්‍යයක් වන්නේ,", "options": ["ප්‍රේමතෝ ජායතී සෝකෝ නාට්‍යය යි. *(Premato Jayati Soko)*", "ලෝමහංස නාට්‍යය යි. *(Lomahansa)*", "මනමේ නාට්‍යය යි. *(Maname)*", "මහාසාර නාට්‍යය යි. *(Mahasara)*", "කදා වළලු නාට්‍යය යි. *(Kada Valalu)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** Dr. Ediriweera Sarachchandra's musical drama \"Premato Jayati Soko\" (grief arises from love) is directly adapted from the tragic romantic legend of Swarna Tilaka and Uddula in the Saddharmalankaraya.\n\n---"}, {"qNum": 90, "q": "90. සෞන්දර්ය රසස්වාදයේදී බෞද්ධයා විසින් අවධානයට ලක් කළ යුතු මූලික කාරණය වන්නේ,", "options": ["සෞන්දර්ය රසස්වාදය ගිහි පැවිදි සැම දෙනාටම තහනම් කර ඇති බවයි. *(Aesthetics is prohibited for everyone)*", "උපාදාන අකල්පයෙන් තොරව දැහැමිව සෞන්දර්ය රසවිඳීම වරදක් නොවන බවයි. *(Righteous aesthetic appreciation without attachment/grasping is not a fault)*", "සෞන්දර්ය රසස්වාදය වැරදි ක්‍රියාවක් බවයි. *(Aesthetics is inherently a bad act)*", "සෞන්දර්ය රසස්වාදයෙන් ඉන්ද්‍රිය සංවරය පිරිහෙන බවයි. *(Aesthetics always destroys self-control)*", "සෞන්දර්ය රසස්වාදයෙන් තොර මිනිසා සමාජයෙන් ප්‍රතික්ෂේප වන බවයි. *(A man without aesthetics is rejected by society)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** Buddhism does not reject beauty or aesthetics; instead, it encourages dispassionate, unattached appreciation (Viraaga-rasa-vindana) which values beauty without leading to lust, obsession, or attachment (*upadana*).\n\n---"}, {"qNum": 91, "q": "91. මිහිඳු මහ රහතන් වහන්සේ ශ්‍රී ලංකාද්වීපයට බුදුදහම රැගෙන වැඩම කිරීමෙන් පසුව පැවති ආගමික ඇදහිලි හා විශ්වාස බුදුසමයට අනුව හැඩ ගැසී වර්ධනය වූ බවට තොරතුරු මූලාශ්‍ර ග්‍රන්ථවලින් අනාවරණය වේ. මේ සඳහා දැක්විය හැකි නිදසුනක් නොවන්නේ,", "options": ["පණ්ඩුකාභය රජු ජෝතිය නම් නිඝන්ඨයාට ගෘහයක් හා කුම්භණ්ඩ නම් නිඝන්ඨයාට දේවාලයක් ඉදිකර දී පුද පූජා පැවැත්වීමයි. *(King Pandukabhaya building a house for Jotiya Nigantha and a temple for Kumbhanda Nigantha.)*", "ලාංකිකයන් අර්ථවත් බෝධි වන්දනාවට නැඹුරු වීමයි. *(Sri Lankans turning to meaningful Bodhi worship.)*", "කුලකර්ම සිදුකොට මළවුන්ට පිං දීමයි. *(Performing family rituals to transfer merit to the dead.)*", "කුලකර්ම සිදුකොට දෙවියන්ට පින් අනුමෝදන් කිරීමයි. *(Performing family rituals to transfer merit to deities.)*", "ස්තූප, ප්‍රතිමා වැනි ස්මාරක ඉදිකොට වන්දනයට යොමුවීමයි. *(Erecting and worshipping monuments like stupas and statues.)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** Pandukabhaya's patronage of Jotiya and Kumbhanda happened in the pre-Buddhist era, long before the arrival of Mihindu Thera. The other options are clear examples of pre-Buddhist rituals (tree worship, ancestor worship, monument worship) adapting into Buddhist practices."}, {"qNum": 92, "q": "92. අනුස්මරණීය පුද්ගලයින් වෙනුවෙන් කිසියම් නිර්මාණයක් කොට ඔවුන්ට ගෞරවයට ලක් කිරීම ලෝකයේ බොහෝ රටවල සිදු වේ. එම ක්‍රියාව බෞද්ධ සමාජය මඟින් ද දක්නට ඇත්තේ ස්තූප නිර්මාණය මඟින්ය. එම නිර්මාණය විවිධ සම්ප්‍රදායන් මඟින් නවතාවයකට ලක් ව ඇත. එසේ සංවර්ධනය වූ ස්තූපයන්හි ගර්භයෙන් ප්‍රකාශිත ආගමික සංකල්පය වන්නේ,", "options": ["සුවාසූ දහසක් ධර්මස්කන්ධයයි *(The 84,000 aggregates of Dhamma)*", "ත්‍රිවිධ රත්නයයි *(The Triple Gem)*", "සත්තිස් බෝධිපාක්ෂික ධර්මයයි *(The 37 factors of Enlightenment [Bodhipakkhiya Dhamma])*", "නවංග ශාස්තෘ ශාසනයයි *(The ninefold teachings of the Master)*", "දිව්‍ය ලෝකයත් ය *(The heavenly worlds)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** බෞද්ධ ස්තූපයක ඇති ප්‍රධානතම කොටසක් වන ගෝලාකාර **'ගර්භය' (The Dome)** මඟින් සංකේතවත් කරන්නේ නිවන අවබෝධ කර ගැනීම සඳහා උපකාර වන උතුම් **'සත්තිස් බෝධිපාක්ෂික ධර්ම සමූහය' (37 Factors of Enlightenment)** යි."}, {"qNum": 93, "q": "93. දඹදෙණි යුගයේ රචිත පූජාවලිය රචනා කරන ලද්දේ,", "options": ["ධර්මසේන හිමියන් විසිනි. *(Ven. Dharmasena)*", "තොටගමුවේ ශ්‍රී රාහුල හිමියන් විසිනි. *(Ven. Totagamuwe Sri Rahula)*", "මයුරපාද පරිවෙනාධිපති බුද්ධපුත්‍ර හිමියන් විසිනි. *(Ven. Mayurapada Parivenadhipati Buddhaputra)*", "නාගසේන හිමියන් විසිනි. *(Ven. Nagasena)*", "විද්‍යා චක්‍රවර්තීන් විසිනි. *(Vidya Chakravarti)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** Ven. Buddhaputra, the chief of the Mayurapada Pirivena, wrote the Pujavaliya during the reign of King Bosath Vijayabahu IV in the Dambadeniya period.\n\n---"}, {"qNum": 94, "q": "94. දසබල ඥානයන්හි \"පෙර විසූ භවයන් විමසීමේ නුවණ\" හඳුන්වන්නේ,", "options": ["ආසවක්ඛය ඥානය නමිනි. *(Asavakkhaya Jnana - knowledge of destruction of taints)*", "චුතූපපාත ඥානය නමිනි. *(Cutupapata Jnana - knowledge of passing away and rebirth of beings)*", "ඉන්ද්‍රිය පරෝපරියත්ත ඥානය නමිනි. *(Indriya-paropariyatta Jnana - knowledge of the faculties of others)*", "පුබ්බේනිවාසනුස්සති ඥානය නමිනි. *(Pubbenivasanussati Jnana - recollection of past lives)*", "යථාභූත ඥානය නමිනි. *(Yathabhuta Jnana - knowledge of things as they truly are)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** Pubbenivasanussati-nana is the specific wisdom of the Buddha that allows Him to recall His own and others' infinite past births.\n\n---"}, {"qNum": 95, "q": "95. ධනෝපායනය, ධන පරිහරණය උපදෙස් දක්වා ඇති ප්‍රමුඛ මූලාශ්‍රයක් ලෙස 'රාසිය සූත්‍රය' පෙන්වා දිය හැකි ය. එහි ඊට අදාළ ප්‍රධාන උපදෙස් හතරක් දක්වා ඇති අතර, එම උපදෙස් අතරට අයත් නොවන කරුණකි,", "options": ["යහපත්ව සමාජය හැදීම. *(Systematically reform/develop society.)*", "තමා සැපවත්වීම. *(Making oneself happy/comfortable.)*", "පරිත්‍යාග කිරීම. *(Practicing generosity/sharing.)*", "දැහැමෙන් ඉපයීම. *(Earning livelihood through righteous means.)*", "ගිජුකමින් තොරව පරිහරණය කිරීම. *(Consuming wealth without attachment/greed.)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** The Rasiya Sutta outlines four specific duties of a lay householder regarding wealth: righteous earning, self-happiness/comfort, sharing with others/merit, and utilizing wealth without obsession or greed."}, {"qNum": 96, "q": "96. \"නිවැරදි කායික වාචසික කර්මයන්ගෙන් යුක්ත වූ ආර්ය ශ්‍රාවකයා සැපයට පැමිණෙයි. සොම්නසට පැමිණෙයි.\" අනණ සූත්‍රගත ඉහත සැපය හැඳින්වෙන්නේ,", "options": ["අත්ථි සුඛ ලෙස යි. *(Happiness of possession / Atthi-sukha)*", "භෝග සුඛ ලෙස යි. *(Happiness of consumption / Bhoga-sukha)*", "අනණ සුඛ ලෙස යි. *(Happiness of debtlessness / Anana-sukha)*", "අනවජ්ජ සුඛ ලෙස යි. *(Happiness of blamelessness / Anavajja-sukha)*", "නිරාමිස සුඛ ලෙස යි. *(Dispassionate happiness)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** විෂය නිර්දේශයේ සම්මත කරුණු සහ ඓතිහාසික සාධක අනුව වරණ **(4)** නිවැරදි පිළිතුර වේ."}, {"qNum": 97, "q": "97. උපතේ සිට මරණය දක්වා සෑම වැදගත් අවස්ථාවකම නිසි චාරිත්‍ර විධි ඉටුකිරීම ශ්‍රී ලාංකේය සිංහල බෞද්ධ ජන සමාජයේ ප්‍රමුඛ ලක්ෂණයකි. ඒ අනුව පුද්ගල ජීවිතයක මුල් කාල පරිච්ඡේදයේ සිදු කරනු ලබන චාරිත්‍ර කිහිපයක් පහත දැක්වේ.", "options": ["A, B, D, E, C ය *(A, B, D, E, C)*", "B, C, D, E, A ය *(B, C, D, E, A)*", "B, D, C, A, E ය *(B, D, C, A, E)*", "B, D, A, E, C ය *(B, D, A, E, C)*", "D, A, B, E, C ය *(D, A, B, E, C)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** The traditional chronological order of childhood sacraments (Samskaras) in Sinhala Buddhist culture is: Naming the child (B - නම් තැබීම), Cutting the first hair/head-shaving (D - දොළත වැඩීම), Feeding the first solid food (A - ඉඳුල් කට ගෑම), Initiating letters/alphabet (E - අකුරු කියවීම), and finally School enrollment (C - ශාස්ත්‍ර සාලාවකට බාරදීම)."}, {"qNum": 98, "q": "98. සිගාලෝවාද සූත්‍රයෙහි දැක්වෙන යුතුකම් කිහිපයක් පහත දැක්වේ.", "options": ["A සහ B තුළය.", "B සහ C තුළය.", "D සහ E තුළය.", "A සහ C තුළය.", "A සහ E තුළය."], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** In the Sigalovada Sutta, the five duties of parents are: Restrain children from evil, guide them to do good (E), train them in a profession (B), arrange a suitable marriage, and hand over inheritance in due time (A). Thus, A and E are correct parental duties.\n\n---"}, {"qNum": 99, "q": "99. ගිහි සමාජයේ අභිවෘද්ධිය පිණිස මංගල සූත්‍රයේ ඉගැන්වෙන කරුණු අතුරින් පවුලක එදිනෙදා යහපැවැත්මට අදාළ කරගත හැකි ඉගැන්වීමක් නොවන්නේ,", "options": ["අසේවනාච බාලානං යන්නය. *(Avoiding fools.)*", "මාතාපිතු උපට්ඨානං යන්නය. *(Supporting mother and father.)*", "පුත්තදාරස්ස සංගහෝ යන්නය. *(Cherishing wife and children.)*", "නිබ්බාණ සච්ඡිකිරියාච යන්නය. *(Realizing Nirvana.)*", "මජ්ජපානාච සඤ්ඤමෝ යන්නය. *(Abstaining from intoxicants.)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** \"Nibbanasacchikiriya\" (realizing Nirvana) is the ultimate spiritual goal of Buddhist practice, unlike the other options which represent ethical, social, and domestic duties essential for day-to-day family life."}, {"qNum": 100, "q": "100. සෞන්දර්ය රසස්වාදය බුදුදහම තුළ අවතක්සේරු කොට නොමැත. බුදුරදුන් පවා ඇතැම් අවස්ථාවන්හිදී විරාගි රස වින්දනය අගය කොට ඇත. එලෙස බුදුරදුන් සෞන්දර්ය අගය කළ අවස්ථාවක් දැක්වෙන මූලාශ්‍රයක් වන්නේ,", "options": ["ඒතදග්ග පාළියයි *(Etadagga Pali)*", "ථේර ථේරී ගාථා ආදියයි *(Thera and Theri Gatha, etc.)*", "සක්කපඤ්ඤ සූත්‍රයයි *(Sakkapanha Sutta)*", "වතෝපම සූත්‍රයයි *(Watopama Sutta)*", "චක්කවත්තිසීහනාද සූත්‍රයයි *(Cakkavattisihanada Sutta)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** දීඝනිකායට අයත් සක්කපඤ්හ සූත්‍රයේදී පංචසිඛ දිව්‍ය පුත්‍රයා විසින් බෙලුවපණ්ඩු වීණාව වාදනය කරමින් ගායනා කළ ශෘංගාරාත්මක හා දහම් මිශ්‍ර ගීතය අසා බුදුරජාණන් වහන්සේ එම සෞන්දර්යාත්මක ගායනය සහ වාදනය බෙහෙවින් අගය කළහ."}, {"qNum": 101, "q": "101. මිනිසුන්ට පමණක් නොව තිරිසන් සතුන් වෙනුවෙන්ද ගිලන් හල් ඉදිකරමින් පරමාදර්ශීව ක්‍රියා කළ රජෙකු ලෙස ...................... හැඳින්විය හැකිය.", "options": ["දුටුගැමුණු රජු *(King Dutugemunu)*", "එළාර රජු *(King Elara)*", "බුද්ධදාස රජු *(King Buddhadasa)*", "දේවානම්පියතිස්ස රජු *(King Devanampiya Tissa)*", "වළගම්බා රජු *(King Valagamba)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** King Buddhadasa (4th century CE) was a highly skilled physician who wrote the medical treatise \"Sarartha Sangrahaya\" and established state-supported medical clinics and animal shelters across the island.\n\n---"}, {"qNum": 102, "q": "102. සිඟාලෝවාද සූත්‍රයේ එන සදෘශ වන්දනය තුළින් නිරූපිත අන්‍යෝන්‍ය යුතුකම් හා වගකීම් කිහිපයක් පහත දැක්වේ.", "options": ["A සහ B පමණි *(A and B only)*", "A සහ C පමණි *(A and C only)*", "A සහ D පමණි *(A and D only)*", "B සහ D පමණි *(B and D only)*", "B සහ E පමණි *(B and E only)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** In the Sigalovada Sutta, the South direction represents the Teacher-Student relationship. The student's duties include \"Sussusaya\" (listening attentively - B), and the teacher's duties include protecting the student in all directions and letting them depart safely (A)."}, {"qNum": 103, "q": "103. ලෝකයේ පෞරාණිකම විහාරය වශයෙන් මෙන්ම ශ්‍රී ලංකා ද්වීපයේ ප්‍රථම විහාරය වශයෙන් දැක්වෙන්නේ,", "options": ["ජේතවන විහාරය යි. *(Jetavana Vihara)*", "අනුරාධපුර මහා විහාරය යි. *(Anuradhapura Maha Vihara)*", "වේළුවන කලන්දක නිවාපය යි. *(Veluvana Kalandaka Nivapa)*", "ථූපාරාමය විහාරය යි. *(Thuparamaya Vihara)*", "මින්නේරිය විහාරය යි. *(Minneriya Vihara)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** The Anuradhapura Maha Vihara was founded by King Devanampiya Tissa under the guidance of Arahant Mahinda, serving as the first grand monastic center and the fortress of Theravada orthodoxy.\n\n---"}, {"qNum": 104, "q": "104. අශෝක රජු අභිෂේකයෙන් විසි වන වර්ෂයේදී ලුම්බිණිය වැඳීමට ගොස් එම ග්‍රාමය අයබදු වලින් නිදහස් කළ බව සඳහන් වන්නේ,", "options": ["නිගාලි සාගර් ලිපියේ ය. *(Nigali Sagar Pillar Inscription)*", "සාරානාත් ටැම් ලිපියේ ය. *(Sarnath Pillar Inscription)*", "රුම්මින්දේයි ටැම් ලිපියේ ය. *(Rummindei/Lumbini Pillar Inscription)*", "රූප්නාත් ගිරි ලිපියේ ය. *(Rupnath Rock Inscription)*", "ගිර්නාර් ශිලා ලිපියේ ය. *(Girnar Rock Inscription)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** The Rummindei Pillar Inscription stands at the Buddha's birthplace in Lumbini, stating that Ashoka visited, worshipped, and declared the village of Lumbini tax-free (*lummini-game ubalike kate*).\n\n---"}, {"qNum": 105, "q": "105. වේදයෙන් දම්     කඳ", "options": ["බුද්ධ බුදු ගුණය යි. *(Buddha)*", "භගවා බුදු ගුණය යි. *(Bhagava)*", "සම්මා සම්බුද්ධ බුදු ගුණය යි. *(Samma Sambuddha)*", "ලෝකවිදූ බුදු ගුණය යි. *(Lokavidu)*", "සුගත බුදු ගුණය යි. *(Sugata)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** This Sinhala verse, emphasizing the distribution and teaching of the Dhamma, traditionally extols the \"Bhagava\" virtue of the Buddha."}, {"qNum": 106, "q": "106. \"ලෝකයේ සුප්‍රසිද්ධ ආගම්වලින් මා බුදු දහමට, විශේෂයෙන් මුල් බුදු දහමට කැමැතිවන්නේ එය කිසිවකු නොපෙළන බැවිනි.\" මෙම ප්‍රකාශය කරන ලද්දේ,", "options": ["ඇල්බට් අයින්ස්ටයින් ය. *(Albert Einstein)*", "මහාචාර්ය ලක්ෂ්මී නරසු ය. *(Prof. Lakshmi Narasu)*", "බර්ට්‍රන්ඩ් රසල් ය. *(Bertrand Russell)*", "මහාචාර්ය සෝන්ඩර්ස් ය. *(Prof. Saunders)*", "එඩ්වින් ආර්නෝල්ඩ් ය. *(Edwin Arnold)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** The Nobel laureate philosopher Bertrand Russell made this famous statement praising the non-violent, compassionate nature of early Buddhism."}, {"qNum": 107, "q": "107. තමන් වහන්සේගේ ඇවෑමෙන් පසු ඡන්න භික්ෂුවට බ්‍රහ්මදණ්ඩනය පනවන ලෙස බුදුරදුන් කරන ලද නියමයට අනුව ප්‍රථම සංගීතිකාරක තේරවරු උන්වහන්සේට බ්‍රහ්මදණ්ඩනය පැනවීමට තීරණය කළහ. බ්‍රහ්මදණ්ඩනයේ ස්වභාවය ඇසුරින් ඡන්න භික්ෂූන් සිහි සන් ව ඇද වැටුණි. එහි දැක්වෙන බ්‍රහ්මදණ්ඩනය යනු,", "options": ["වැඩ වසන ආරාමයෙන් නෙරපීම යි. *(Expulsion from the monastery)*", "වැඩ වසන ග්‍රාමයෙන් නෙරපීම යි. *(Expulsion from the village)*", "සිවුරු හරවා ගිහි බවට පත් කරවීම යි. *(Forcible disrobing)*", "කිසිදු ගෘහස්ථ කටයුත්තකට සහභාගි කරවා නො ගැනීම යි. *(Exclusion from hou රණය / Academic Justification:** Sanjaya Belatthiputta was an agnostic/skeptic who refused to give a definitive answer to metaphysical questions (e.g., Is there an afterlife? Is there karma?), earning his teaching the name \"Amaravikkhepavada\" because his arguments slipped away like an eel.\n\n---"}, {"qNum": 117, "q": "117. ලංකාවේ බෞද්ධ ප්‍රතිමා ශිල්පයේදී ප්‍රධාන මුද්‍රා හයක් දක්නට ලැබේ. එයින් බෝ මැඩ මාර පරාජයේ දී බුදුරජාණන් වහන්සේ පාරමිතා පිරූ බවට මහපොළොව සාක්ෂි දැරීම සංකේතවත් කරන්නේ,", "options": ["සමාධි මුද්‍රාව තුළිනි. *(Samadhi Mudra)*", "භූමි ස්පර්ශ මුද්‍රාව තුළිනි. *(Bhumisparsha Mudra)*", "අභය මුද්‍රාව තුළිනි. *(Abhaya Mudra)*", "වරද මුද්‍රාව තුළිනි. *(Varada Mudra)*", "විතර්ක මුද්‍රාව තුළිනි. *(Vitarka Mudra)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** Bhumisparsha Mudra (the earth-touching gesture) represents the moment Siddhartha Gautama touched the ground with His right hand, calling the Earth to witness His path of perfections (*paramis*) to defeat Mara.\n\n---"}, {"qNum": 118, "q": "118. කුලවාදය භාරතීය සමාජයේ තහවුරු කිරීම සඳහා බ්‍රාහ්මණයන් විසින් යොදාගත් ප්‍රධානතම ආගමික ඉගැන්වීම වූයේ,", "options": ["වර්ණ ධර්මය යි. *(Varna Dharma)*", "ආශ්‍රම ධර්මය යි. *(Ashrama Dharma)*", "ස්ව ධර්මය යි. *(Svadharma)*", "ආපද් ධර්මය යි. *(Apaddharma)*", "යාගය යි. *(Yaga / Sacrifice)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** විෂය නිර්දේශයේ සම්මත කරුණු සහ ඓතිහාසික සාධක අනුව වරණ **(1)** නිවැරදි පිළිතුර වේ."}, {"qNum": 119, "q": "119. “මාගේ මේ ව්‍යායාමය කිසි කලෙකත් රජ සැප පිණිස නොව සම්බුද්ධ ශාසනයේ චිරස්ථිතිය සඳහාම ය.” දුටුගැමුණු රජතුමා සිදු කළ ප්‍රකාශනයෙන් පැවසෙන්නේ,", "options": ["ආදර්ශවත් නායකත්වයයි *(Exemplary leadership)*", "විශිෂ්ට ශාස්තෘත්වයයි *(Excellent teacher-like qualities)*", "නීති ගරුකත්වයයි *(Rule of law)*", "පුද්ගල ශක්තිය හා ස්වාධීනත්වයයි *(Individual strength and independence)*", "ශාසන මාමකත්වයයි *(Deep devotion and commitment to the Sasana)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** This famous slogan, made before his campaign to unite the country, expresses the king's ultimate spiritual loyalty and dedication (Shasana-mamakatvaya) over worldly power or royal luxury."}, {"qNum": 120, "q": "120. චිත්‍ර, මූර්ති, කැටයම්, ගෘහ නිර්මාණ ආදී වූ බෞද්ධ කලා නිර්මාණ තුළින් අරමුණු රැසක් සාධනය වේ.", "options": ["A සහ B ය *(A and B)*", "B සහ C ය *(B and C)*", "A, B සහ C ය *(A, B, and C)*", "A, B, C සහ D ය *(A, B, C, and D)*", "A, B, C, D සහ E යන සියල්ලමය *(All A, B, C, D, and E)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** Buddhist arts and monuments in Sri Lanka serve both profound spiritual purposes (A and B) and significant cultural, historical, and economic roles (C, D, and E) by preserving national identity and attracting global tourism."}, {"qNum": 121, "q": "121. පණ්ඩුකාභය රජු යක්ෂයින්ට විවිධ ස්ථානවල වාසස්ථාන ඉදි කර දෙන ලදී. ඒ අනුව කාලවේල යක්ෂයාට දේවාලයක් ඉදි කර දෙන ලද්දේ,", "options": ["අභය වැවේ යටි කොනෙන් ය *(The lower corner of the Abhaya reservoir)*", "රජ මැදුර ආසන්නයේ ය *(Near the royal palace)*", "නුවරින් නැගෙනහිර දිසාවෙන් ය *(In the eastern direction of the city)*", "කලා වැව ආසන්නයේ ය *(Near the Kala reservoir)*", "තිසා වැවේ උඩ කොනින් ය *(The upper corner of the Tissa reservoir)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** මහාවංශයේ දසවන පරිච්ඡේදයට අනුව, පණ්ඩුකාභය රජතුමා අනුරාධපුර නගරය නිර්මාණය කිරීමෙන් පසු තමාට උපකාර කළ යක්ෂයින්ට කෘතගුණ සැලකීමක් ලෙස **කාලවේල යක්ෂයාට** දේවාලයක් ඉදි කර දුන්නේ නගරයේ නැගෙනහිර දිශාවෙහි (Puratthima disabhage) ය."}, {"qNum": 122, "q": "122. \"දන් කැඳ පැන් ලා - සුරනල් සිනා සීලා.........\" යන පද්‍යය ඇතුළත් ග්‍රන්ථය වන්නේ,", "options": ["පැරකුම්බා සිරිතේ ය. *(Parakumba Siritha)*", "ලෝවැඩ සඟරාවේ ය. *(Lowada Sangarawa)*", "බුදුගුණ අලංකාරයේ ය. *(Buduguna Alankaraya)*", "සුභාෂිතයේ ය. *(Subhashitaya)*", "කාව්‍යශේඛරයේ ය. *(Kavyashekharaya)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** Kavyashekharaya, a masterpiece written by the legendary scholar-monk Ven. Totagamuwe Sri Rahula in the Kotte period, contains this celebrated stanza describing cultural and religious activities.\n\n---"}, {"qNum": 123, "q": "123. වටිනා භාණ්ඩ ලෙස පෙන්වා රවටා මුදල් පිළිබඳ වංචා කිරීම ...................... නමින් හඳුන්වයි.", "options": ["තුලකූට *(Tulakuta - false weighing)*", "මානකූට *(Manakuta - false measuring)*", "කංසකූට *(Kamsakuta - false metal counterfeiting / presenting fake items as gold)*", "උක්කෝටන *(Ukkotana - bribery/judicial corruption)*", "නිකති *(Nikati - general fraud)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** Kamsakuta specifically refers to counterfeiting or plating base metals to look like valuable gold or bronze to swindle others.\n\n---"}, {"qNum": 124, "q": "124. 'න පරේසං විලෝමානි - න පරේසං කතාකතං...' යන ධම්මපද ගාථාවට වඩාත් ගැළපෙන වරණය කුමක් ද?", "options": ["පවිටු මිතුරන් ඇසුරු නොකළ යුතු ය. *(One must not associate with evil friends.)*", "තමා තමා ගැන සොයා බලා ක්‍රියා කළ යුතු ය. *(One should look at one's own deeds, not others' faults.)*", "අනුන්ගේ පව් තමන් අනුන් කළ නොකළ දේ නොසෙවිය යුතු ය. *(One must not search for others' faults or what they have done or not done.)*", "අනර්ථ සිදුවන පරලොව දැහැමි ජීවිතයක් පැවතිය යුතුය. *(Worldly life should be righteous.)*", "ක්‍රෝධ කරන්නා ජයගත හැක්කේ සත්පුරුෂ කමිනි. *(Anger must be conquered with goodness.)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** The Dhammapada verse states: \"Do not look at the faults of others, nor what they have done or left undone. Observe rather what you yourself have done or left undone.\""}, {"qNum": 125, "q": "125. \"දොරකඩ අස්න කීම\" සිදු කරනු ලබන්නේ,", "options": ["දානමය පින්කමකදී පුණ්‍යානුමෝදනාව අවසානයේදීය. *(At the end of merit sharing in almsgiving)*", "ධර්ම දේශනාවක් පැවැත්වීමට පෙරය. *(Before a Dhamma sermon)*", "මතක වස්ත්‍ර පූජා කළ පසුව ය. *(After offering Pansakula robes)*", "සති පිරිත් පින්කමක් අවසානයේ ය. *(At the conclusion of a week-long Sathi Pirith chanting)*", "මංගල වාරිත්‍රයක් වන අෂ්ටක කීමෙන් පසුව ය. *(After reciting marriage Ashtakas)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** Dorakada Asna (\"the message at the doorway\") is a traditional theatrical and religious performance delivered by a young boy representing a deity, signaling the successful conclusion of a Sathi Pirith (week-long chanting) ceremony.\n\n---"}, {"qNum": 126, "q": "126. \"ධර්මයට කැමති වන්නා දියුණුවට පත්වේ. ධර්මයට අකමැති වන්නා පිරිහීමට පත්වේ\" යනුවෙන් බුදුරජාණන් වහන්සේ දේශනා කළහ. එම දේශනාව අන්තර්ගත සූත්‍රය වන්නේ,", "options": ["වසල සූත්‍රය යි. *(Vasala Sutta)*", "පරාභව සූත්‍රය යි. *(Parabhava Sutta)*", "ව්‍යග්ඝපජ්ජ සූත්‍රය යි. *(Vyagghapajja Sutta)*", "මංගල සූත්‍රය යි. *(Mangala Sutta)*", "බාලපණ්ඩිත සූත්‍රය යි. *(Balapandita Sutta)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** විෂය නිර්දේශයේ සම්මත කරුණු සහ ඓතිහාසික සාධක අනුව වරණ **(2)** නිවැරදි පිළිතුර වේ."}, {"qNum": 127, "q": "127. බුද්ධකාලීන භාරතයේ පැවති සොළොස් මහා ජනපද අතරින් පාලන ක්‍රම දෙකක් ක්‍රියාත්මක විය. ඒ අනුව \"ගණතන්ත්‍ර\" හෝ \"සමූහාණ්ඩු\" පාලන ක්‍රමයක් ක්‍රියාත්මක වූ ජනපදයක් වන්නේ,", "options": ["මගධ ජනපදය *(Magadha)*", "කෝසල ජනපදය *(Kosala)*", "වත්ස ජනපදය *(Vatsa)*", "අවන්ති ජනපදය *(Avanti)*", "මල්ල ජනපදය *(Malla)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** While Magadha, Kosala, Vatsa, and Avanti were powerful absolute monarchies (rajanas), the Vajji and Malla confederacies were prominent republics (Gana-Sangha) ruled by assemblies of clans.\n\n---\n\n### Page 5"}, {"qNum": 128, "q": "128. ගොවියකු වූ ප්‍රියන්ත සිය පවුලේ අවමංගල්‍යය සපුරා ගත්තේ මහත් වූ ආර්ථික දුෂ්කරතා මැදදී ය. ස්වාමිපුරුෂයාගේ ගොවිතැන් කටයුතුවලට උදව් කිරීම හා ගෙදර දොර කටයුතු කිරීම හැර බිරිඳට ස්ථිර රැකියාවක් නො තිබුණි. ඒ නිසා දරුවන් සිව් දෙනාගේ කටයුතු ද ඉටු කර ගත්තේ ඉතා අපහසුවෙනි. මෙසේ කාලය ගෙවන අතරතුර සති අන්තයේ බැංකුවකින් යැයි සංශෝධනයක් සහිත ව ප්‍රියන්තගේ නිවසට පැමිණෙන බවට ඇමතුමක් ලැබුණි. ඉන් සැමියා කම්පනයට පත් වේ යැයි බිරිඳ සිතුන ද ප්‍රියන s)*", "කුඹල්කරුවන් නමිනි. *(Potters)*", "පේෂ කර්මාන්තකරුවන් නමිනි. *(Weavers/Textile artisans)*", "කුලාලකයන් නමිනි. *(Potters/Clay workers)*", "සයම් කරුවන් නමිනි. *(Dyers)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** Textile and weaving industries (Pesha Karma) were highly advanced in ancient India, producing fine silk, woolen shawls, carpets, and blankets.\n\n---"}, {"qNum": 131, "q": "131. නිවැරදි පිළිතුර: 2 (කඨින උත්සවයයි)", "options": [], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** තායිලන්තයේ පවතින දීර්ඝකාලීන රාජකීය සම්ප්‍රදායට අනුව, වස්සාන කාලය අවසානයේ පවත්වන **'රාජකීය කඨින චීවර පූජා' (Royal Kathina Celebration)** උත්සවයට තායි රජතුමා අනිවාර්යයෙන්ම සහභාගි වී මහා සංඝරත්නයට කඨින චීවර පූජා කළ යුතුය."}, {"qNum": 132, "q": "132. දස පුණ්‍ය ක්‍රියාවල ඇතුළත් පිං අනුමෝදන් කිරීම................... යනුවෙන් හැඳින්වේ.", "options": ["වෙය්‍යාවච්ච *(Veyyavacca - service)*", "අපචායන *(Apacayana - reverence/humility)*", "පත්තිදාන *(Pattidana - sharing/giving merit)*", "උපදිකෘත *(Upadikruta)*", "පත්තානුමෝදනා *(Pattanumodana - rejoicing in others' merit)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** දස පුණ්‍ය ක්‍රියාවලට අනුව, තමන් කළ පින අනුන්ට පැමිණවීම/බෙදා දීම **'පත්තිදාන'** වන අතර, අනුන් කළ පින් සතුටින් පිළිගෙන සිත පහදවා ගැනීම **'පත්තානුමෝදනා' (Rejoicing in others' merit)** නමින් හැඳින්වේ."}, {"qNum": 133, "q": "133. ධම්ම පදයේ ගාථා ගණන, වර්ග ගණන හා නිධාන කථා ගණන පිළිවෙලට ඇති වරණය වන්නේ,", "options": ["423, 25, 299", "421, 26, 299", "423, 26, 298", "423, 26, 299", "421, 26, 298"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** The Dhammapada consists of exactly 423 stanzas distributed across 26 chapters (Vaggas), and is illustrated by 299 background stories (Nidhana Katha) found in the Dhammapada Commentary (Atthakatha).\n\n---"}, {"qNum": 134, "q": "134. ලෝකය සත්වයා වශයෙන් ද සමුදය වශයෙන් ද නිරෝධ වශයෙන් ද මාර්ග වශයෙන් ද සියලු ආකාරයෙන් තමන් විසින්ම අවබෝධ කළ බැවින් බුදුරජාණන් වහන්ස ාවේ ප්‍රතිඵලයක් වශයෙනි. *(First Council)*", "දෙවන ධර්ම සංගායනාවේ ප්‍රතිඵලයක් වශයෙනි. *(Second Council)*", "තෙවන ධර්ම සංගායනාවේ ප්‍රතිඵලයක් වශයෙනි. *(Third Council)*", "සිව්වන සර්වාස්තිවාදී ධර්ම සංගායනාවේ ප්‍රතිඵලයක් වශයෙනි. *(Fourth Council - Sarvastivada)*", "සිව්වන ථෙරවාදී ධර්ම සංගායනාවේ ප්‍රතිඵලයක් වශයෙනි. *(Fourth Council - Theravada)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** During the Fourth Council held in Kashmir under King Kanishka's patronage (Sarvastivada tradition), extensive commentaries called \"Vibhashas\" (Upadesha-shastra for Sutta, Vinaya-vibhasha for Vinaya, and Abhidharma-vibhasha for Abhidharma) were compiled.\n\n---"}, {"qNum": 138, "q": "138. දස සක්විතිවත් පිළිබඳ බෞද්ධ ඉගැන්වීමට අනුව සක්විති රජකු විසින් අනුගමනය කළ යුතු පිළිවෙතට ඇතුළත් නොවන ලක්ෂණය වන්නේ,", "options": ["අන්තඃපුර ජනයා කෙරෙහි ආරක්ෂාව සංවිධානය කළ යුතුය යන්න යි. *(To organize protection for the harem/palace residents.)*", "බල සෙනඟ කෙරෙහි ආරක්ෂාව සංවිධානය කළ යුතුය යන්න යි. *(To organize protection for the armed forces.)*", "බ්‍රාහ්මණ ගෘහපතීන් කෙරෙහි ආරක්ෂාව සංවිධානය කළ යුතුය යන්න යි. *(To organize protection for the Brahmin householders.)*", "විවාහක අවිවාහක ස්ත්‍රීන් කෙරෙහි ආරක්ෂාව සංවිධානය කළ යුතුය යන්න යි. *(To organize protection specifically for married and unmarried women [not in the traditional list].)*", "ශ්‍රමණ බ්‍රාහ්මණයන් කෙරෙහි ආරක්ෂාව සංවිධානය කළ යුතුය යන්න යි. *(To organize protection for recluses and Brahmins.)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** දීඝනිකායේ චක්කවත්ති සීහනාද සූත්‍රයේ එන 'දස සක්විති වත්'වලට අනුව සක්විති රජු විසින් සේනාව, ක්ෂත්‍රියයන්, බ්‍රාහ්මණයන්, වැසියන්, ශ්‍රමණ බ්‍රාහ්මණයන් සහ සතුන්/පක්ෂීන් (මෘග පක්ෂීන්) කෙරෙහි ධාර්මික ආරක්ෂාව සැපයිය යුතු අතර, විවාහක/අවිවාහක ස්ත්‍රීන් වෙනුවෙන් විශේෂ වතක් එහි වෙනම ඇතුළත් නොවේ."}, {"qNum": 139, "q": "139. බුදුරජාණන් වහන්සේ ප්‍රථම ධර්ම දේශනාව දේශනා කරන ලද්දේ කාගේ ආරාධනාවකට අනුව ද?", "options": ["බිම්බිසාර රජුගේ ඉල්ලීම අනුව ය. *(At the request of King Bimbisara)*", "මොග්ගලීපුත්ත තිස්ස හිමියන්ගේ ඉල්ලීම අනුව ය. *(At the request of Moggaliputta Tissa)*", "සහම්පති මහා බ්‍රහ්මයාගේ ආරාධනය අනුව ය. *(At the invitation of Brahma Sahampati)*", "පස්වග මහණුන්ගේ ඉල්ලීම අනුව ය. *(At the request of the five ascetics)*", "ශුද්ධෝදන රජුගේ ඉල්ලීම අනුව ය. *(At the request of King Suddhodana)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** After His Enlightenment, thinking the Dhamma was too deep for the world, the Buddha hesitated to preach, until Brahma Sahampati appeared and invited Him to do so for the benefit of those \"with little dust in their eyes.\""}, {"qNum": 140, "q": "140. බෞද්ධ පාලන සංකල්පවල එන \"දස රාජ ධර්ම\" වලට අයත් නොවන ගුණය වන්නේ,", "options": ["දානයයි *(Dana - generosity)*", "ශීලයයි *(Sila - morality)*", "මද්දවයයි *(Maddava - gentleness)*", "අක්කෝධයයි *(Akkodha - non-anger)*", "මෝහයයි *(Moha - delusion)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** Moha (delusion) is an unwholesome root (akusala mula). The Ten Royal Virtues include positive spiritual qualities like Dana, Sila, Pariccaga, Ajjava, Maddava, Tapa, Akkodha, Avihimsa, Khanti, and Avirodhana."}, {"qNum": 141, "q": "141. සමාජ ප්‍රභවය හා විකාශනය පිළිබඳ බෞද්ධ විග්‍රහය ඇතුළත් වන අග්ගඤ්ඤ සූත්‍ර දේශනාවට අනුව මානව සමාජය පරිණාමය වීමේ දී, ක්‍රමවත් පරිපාලනයක් ඇති කිරීමට මුල් වූයේ,", "options": ["මහාජන මනාපය යි. *(The consensus/agreement of the public [Mahasammata])*", "තෘෂ්ණාව යි. *(Craving / Desire)*", "දේශගුණය යි. *(Climate changes)*", "දරිද්‍රතාව යි. *(Poverty)*", "රාජ්‍යය යි. *(The State)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** The Agganna Sutta states that the first king, *Mahasammata* (the Great Elect), was chosen by popular consensus of the people to maintain order in exchange for a portion of agricultural produce."}, {"qNum": 142, "q": "142. ලාංකේය ස්තූප අංග අතුරින් සෙනරත් පරණවිතාන මහතාගේ අදහසට අනුව හතරැස් කොටුවෙන් පිළිඹිබු වන්නේ,", "options": ["සංසාරය යි. *(Samsara)*", "චතුරාර්ය සත්‍යය යි. *(The Four Noble Truths)*", "නිර්වාණය යි. *(Nirvana)*", "අෂ්ටලෝක ධර්මය යි. *(The Eight Worldly Conditions)*", "ආර්ය අෂ්ටාංගික මාර්ගය යි. *(The Noble Eightfold Path)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** Paranavitana's structural analysis of stupa architecture links the Hataras Kotuwa (the enclosure above the dome) as a representation of the Four Noble Truths.\n\n---"}, {"qNum": 143, "q": "143. ප්‍රථම ධර්ම සංගායනාවේදී ආනන්ද තේරුන්ට චෝදනා පහක් එල්ල විය. බුදුරජාණන් වහන්සේට වැසි සළුවක් මැසීම හා සම්බන්ධ චෝදනාවක් ද ඒ අතර විය. උන්වහන්සේට එම චෝදනාව එල්ල වූයේ,", "options": ["වැසි සළුව සඳහා සූදානම් වස්ත්‍රයක් භාවිත නො කිරීම හේතුවෙනි. *(For not using prepared cloth)*", "මඩ තැවරුණු වැසි සළුව මැසීම හේතුවෙනි. *(For sewing a muddy rainy-season robe)*", "සළු මැසීම භික්ෂූන්ට අකැප වීම හේතුවෙනි. *(Because sewing robes is forbidden for monks)*", "සළු මසා භාවිතයට ගැනීම බුදුරදුන් අනුමත නො කර තිබීම හේතුවෙනි. *(Because robe sewing was not approved by the Buddha)*", "පයින් මැද ගෙන වැසි සළුව මැසීම හේතුවෙනි. *(Because he trod/stepped on the robe while sewing it)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** විෂය නිර්දේශයේ සම්මත කරුණු සහ ඓතිහාසික සාධක අනුව වරණ **(5)** නිවැරදි පිළිතුර වේ."}, {"qNum": 144, "q": "144. තෙවන ධර්ම සංගායනාවේ ප්‍රතිඵලයක් ලෙස ප්‍රදේශ නවයකට ධර්මදූතයන් වහන්සේලා පිටත් කර හරින ලදී. එහිදී කාශ්මීරයට වැඩම කළේ,", "options": ["මහාදේව තෙරණුවන් ප්‍රධාන පිරිස ය. *(Ven. Mahadeva)*", "රක්ඛිත තෙරණුවන් ප්‍රධාන පිරිස ය. *(Ven. Rakkhita)*", "යෝනක ධම්මරක්ඛිත තෙරණුවන් ප්‍රධාන පිරිස ය. *(Ven. Yonaka Dhammarakkhita)*", "මහින්ද තෙරණුවන් ප්‍රධාන පිරිස ය. *(Ven. Mahinda)*", "මජ්ඣන්තික තෙරණුවන් ප්‍රධාන පිරිස ය. *(Ven. Majjhantika)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** Under the patronage of Emperor Ashoka and the leadership of Ven. Moggaliputta Tissa, Ven. Majjhantika was sent to establish Buddhism in Kashmir and Gandhara.\n\n---"}, {"qNum": 145, "q": "145. ‘සෙන්’ බුදුදහමේ ආභාසයෙන් ජපන් සංස්කෘතික රසකලා බිහිවී ඇත. ඒ අතර “ඔකුමි” නමින් හැඳින්වෙන්නේ,", "options": ["නාට්‍ය කලාවයි *(Theatrical/Drama art [Kabuki/Noh])*", "රූකඩ කලාවයි *(Puppetry)*", "මල් සැකසුම් කලාවයි *(Flower arrangement [Ikebana])*", "චිත්‍ර කලාවයි *(Zen painting [Sumie])*", "තේපෝත්සවයයි *(Tea ceremony [Chado])*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** \"Okuni\" (frequently spelled Okumi in local transcripts) was the shrine maiden of Izumo who founded Kabuki theater in Kyoto, which reflects Zen's dramatic and minimalist aesthetic expressions."}, {"qNum": 146, "q": "146. ෂට් ශාස්තෘවරුන්ගේ ඉගැන්වීම් කිහිපයක් පහත දැක්වේ.", "options": ["A සහ E ය.", "A සහ C ය.", "C සහ D ය.", "B සහ E ය.", "B සහ D ය."], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** Statement B represents Pubbekatahetuvada (all present experiences are solely due to past karma), and Statement D represents extreme Jaina Ahimsa (wearing mouth-screens to avoid killing tiny organisms while breathing). Both are key Jaina tenets.\n\n---"}, {"qNum": 147, "q": "147. ජපානයට බුදුදහම පැමිණීමට පෙරතුව එහි පැවතියේ ස්වභාවධර්මයේ කල්පිත දෙවිවරුන් හා මළවුන් ඇදහීම මුල් කරගත් වන්දනා ක්‍රමයකි. එම වන්දනා ක්‍රමය වනුයේ,", "options": ["සෙන් සම්ප්‍රදාය වශයෙනි *(The Zen tradition)*", "කොන්ෆියුසියස් දහම නමිනි *(Confucianism)*", "ෂින්තෝ ආගම නමිනි *(Shinto religion)*", "තාඕ දහම නමිනි *(Taoism)*", "ක්‍රිස්තු දහම නමිනි *(Christianity)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** බුදුදහම පැමිණීමට පෙර පුරාණ ජපානයේ පැවති ස්වභාවධර්මයේ විවිධ අදෘශ්‍යමාන බලවේග (කාමි) සහ තමන්ගේ මුතුන් මිත්තන්ගේ ආත්ම වන්දනා කිරීම පදනම් කරගත් දේශීය ආගමික ක්‍රමය **'ෂින්තෝ' (Shinto) ආගම** නම් වේ."}, {"qNum": 148, "q": "148. විනය ශික්ෂාවන්ට අනුව භික්ෂූන්ට නිල් තණ පිටිවල මල මුත්‍ර කිරීම, මලපහ කිරීම, කෙළ ගැසීම, ජලයට මූත්‍රා කිරීම, මලපහ කිරීම, කෙළ ගැසීම තහනම් විය. එසේම සියලුම ආකාරයේ පැළ වන බීජ සිඳීම භික්ෂූන්ට ආපත්තියක් විය. මේ ඉගැන්වීම් තුළින් ප්‍රකාශ වන්නේ,", "options": ["භික්ෂූන් බුදුන්වහන්සේගේ පරිසරය සම්බන් a)** නමින් නව භික්ෂු ශාඛාවක් තායිලන්තයේ පිහිටුවන ලදී."}, {"qNum": 154, "q": "154. තායිලන්තයේ 'ධම්මයුත්තික නිකාය' නමින් නව සංඝ සභාවක් පිහිටුවීමට මූලික වූ පාලකයා කවුරුන් ද?", "options": ["රාම රාජා *(King Rama I)*", "අනව්රත රජු *(King Anawrahta)*", "මොන්කුට් රජු (හතරවන රාමා) *(King Mongkut / Rama IV)*", "චූලාලංකාර රජු *(King Chulalongkorn)*", "මහින්ද රජු *(King Mahinda)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** Prince Mongkut (later King Rama IV), while residing in the Sangha for 27 years, initiated the Dhammayuttika reform movement to return to strict monastic discipline."}, {"qNum": 155, "q": "155. \"පේන කද්‍රියං දානේන\" (ජිනේ කදරියං දානේන) - යන ගාථා පදයෙන් කියැවෙන ධර්මෝපදේශය වන්නේ,", "options": ["ක්‍රෝධ කරන්නා ක්‍රෝධ නො කිරීමෙන් දිනන්නේ ය යන්න යි. *(Conquer anger with non-anger)*", "හිංසා කරන්නා මෛත්‍රියෙන් දිනන්නේ ය යන්න යි. *(Conquer harm with loving-kindness)*", "තද මසුරා තමා සතු දෑ දීමෙන් දිනන්නේ ය යන්න යි. *(Conquer the stingy/miserly with giving)*", "බොරු කියන්නා සත්‍ය කීමෙන් දිනන්නේ ය යන්න යි. *(Conquer the liar with truth)*", "අසත්පුරුෂ පුද්ගලයා සත්පුරුෂ කමෙන් දිනන්නේ ය යන්න යි. *(Conquer the bad with good)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** විෂය නිර්දේශයේ සම්මත කරුණු සහ ඓතිහාසික සාධක අනුව වරණ **(3)** නිවැරදි පිළිතුර වේ."}, {"qNum": 156, "q": "156. තායි බුදු දහම සම්බන්ධයෙන් සාවද්‍ය ප්‍රකාශය තෝරන්න.", "options": ["ක්‍රි.පූ. 329 දී “නකොම් පතොම්” නගර ශ්‍රීයෙන් බුදුදහම ව්‍යාප්තව පැවතුණි. *(Buddhism was established in Nakorn Pathom around 329 BC.)*", "ක්‍රි.ව. 700 දී පල්ලවයන් රජුගේ අනුග්‍රහයෙන් මහායාන බුදුසමය ව්‍යාප්තව පැවතුණි. *(Mahayana Buddhism flourished around 700 AD under Pallava influence.)*", "ක්‍රි.ව. 11 වන සියවසේ දී අනව්රත රජුගේ අනුග්‍රහයෙන් බුදු සමය ව්‍යාප්තව පැවතුණි. *(Buddhism expanded in the 11th century under King Anawrahta's influence.)*", "ක්‍රි.ව. 5 වන සියවසේ දී පේගු හා ථෙටෝන් නගරවල බුදුසමය ව්‍යාප්තව පැවතුණි. *(Buddhism was active in the 5th century in Pegu and Thaton.)*", "ක්‍රි.ව. 7 වන සියවසේ දී ද්වාරවතී රාජ්‍යයේ බුදු සමය ව්‍යාප්තව පැවතුණි. *(Buddhism flourished in the Dvaravati kingdom in the 7th century.)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** While Pegu and Thaton were vital Mon Buddhist centers in lower Burma that influenced Thailand, their peak Theravada expansion and historical consolidation occurred around the 9th-11th centuries, not the 5th century. This option is historically inaccurate within Thai-Mon Buddhist chronology.\n\n---\n\n### Page 8"}, {"qNum": 157, "q": "157. චතුර් වර්ණයෙන් ඉටුවිය යුතු කාර්ය කොටස් හෙවත් යුතුකම් ගැන පැවැසෙන්නේ,", "options": ["වර්ණ ධර්ම සංකල්පයෙනි *(Varna Dharma concept)*", "ස්වධර්ම සංකල්පයෙනි *(Svadharma concept)*", "ආපද් ධර්ම සංකල්පයෙනි *(Apad Dharma concept)*", "ආශ්‍රම ධර්ම සංකල්පයෙනි *(Ashrama Dharma concept)*", "ඊශ්වර නිර්මාණවාදයෙනි *(Isvara-nirmana-vada/Creationism)*"], "correct": 1, "explanation": "* **විවරණය / Academic Justification:** Svadharma refers to the unique, inherent duties prescribed to each Varna (Brahmin must teach, Kshatriya must defend, etc.) which must be strictly followed to maintain cosmic order."}, {"qNum": 158, "q": "158. ධනය, තනතුරු ආදිය පිළිබඳ මානයෙන් තද වී ස්වකීය ඥාතීන් පහත් කොට සැලකීම මූලාශ්‍රගත තොරතුරුවලට අනුව පුද්ගලයා", "options": ["හෝජා විනාශ කරන්නෙක් වෙයි *(Destroys bhoga/wealth)*", "තෘෂ්ණාවෙන් පෙළෙන්නෙක් වෙයි *(Suffers from craving)*", "පසුතැවීමට පත් වෙයි *(Comes to regret)*", "පිරිහීමට පත්වෙයි *(Falls into decline/downfall [Parabhavato hoti])*", "නිදි වර්ජිතව කටයුතු කරන්නෙක් වෙයි *(Acts sleeplessly)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** පරාභව සූත්‍රයේ එන \"ජාතිථද්ධෝ ධනථද්ධෝ ගොත්තථද්ධෝ ච යෝ නරෝ - අතිමඤ්ඤේති ඤාතිං තං පරාභවතෝ මුඛං\" යන දේශනාවට අනුව, ධනය, කුලය හෝ තනතුර නිසා මත් වී තමාගේම ඥාතීන් පහත් කොට සැලකීම පුද්ගලයාගේ පිරිහීමට (පරාභවයට) ප්‍රධානතම හේතුවකි."}, {"qNum": 159, "q": "159. අනුන්ගේ වැරදි අඩුපාඩු සෙවීම, අනුන් කළ නොකළ දේ සෙවීම නොකළ යුතුය. තමාම තමා කළ නොකළ දේ සෙවිය යුතුය. මෙම අදහස පැවසෙන ධම්මපද ගාථාව,", "options": ["“මධුවා මඤ්ඤති බාලෝ” යන ගාථාවයි. *(Madhuvā maññati bālo)*", "“සහස්සමපි චේ වාචා” යන ගාථාවයි. *(Sahassamapi ce vācā)*", "“න පරේසං විලෝමානි” යන ගාථාවයි. *(Na paresaṃ vilomāni)*", "“සුකරානි අසාධූනි” යන ගාථාවයි. *(Sukarāni asādhūni)*", "“ජයං වේරං පසවති” යන ගාථාවයි. *(Jayaṃ veraṃ pasavati)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** Dhammapada stanza 50 states: \"Na paresam vilomani, na paresam katakatam; attanova avekkheyya, katani akatani ca\" (Do not look at the faults of others, or what they have done or left undone; look rather at what you yourself have done or left undone)."}, {"qNum": 160, "q": "160. මිහිඳුමහ රහතන් වහන්සේ සහ දේවානම්පියතිස්ස රජතුමා අතර පැවති බුද්ධි ගෝචර පිළිසඳර කතා බහෙන් පසුව මිහිඳුමහ රහතන් වහන්සේ දේවානම්පියතිස්ස රජු ඇතුළු පිරිසට දේශනා කළේ,", "options": ["ධම්මචක්කප්පවත්තන සූත්‍රය යි. *(Dhammacakkappavattana Sutta)*", "කාලාම සූත්‍රය යි. *(Kalama Sutta)*", "වත්ථූපම සූත්‍රය යි. *(Vatthupama Sutta)*", "චූලහත්ථිපදෝපම සූත්‍රය යි. *(Culahatthipadopama Sutta - The Shorter Elephant Footprint Simile)*", "බ්‍රහ්මජාල සූත්‍රය යි. *(Brahmajala Sutta)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** Ven. Mahinda chose the Culahatthipadopama Sutta as his maiden discourse to explain the greatness of the Triple Gem, the life of a monk, and how one can verify the Buddha's teaching through direct experience.\n\n---"}, {"qNum": 161, "q": "161. ඉන්ද්‍රිය ප්‍රීනනයෙන් ඇති ගිජු භාවයෙන් මිරිකෙමින් තෘෂ්ණාවේ දාසභාවයට පත්ව සිටින පාර්ශවයන්ට මෙම ............................ වෙතින් මිදිය යුතු ය.", "options": ["සුභනාතයෙන් *(Subhanatha)*", "අල්ප කර්මතාවයෙන් *(Excessive worldliness / Minor activities)*", "මධ්‍යපානයෙන් *(Intoxicants)*", "බහුකීඩනත්වයෙන් *(Frivolous games/distractions)*", "ඉන්ද්‍රිය සංවරයෙන් *(Lack of sensory restraint)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** Escape from sensory entrapment and moral heedlessness requires abstaining from intoxicants (*Madjapana*), which causes the downfall of mindfulness and self-restraint."}, {"qNum": 162, "q": "162. බුද්ධකාලීන භාරතයේ පැවැති පාලන තන්ත්‍රයන් හා සම්බන්ධ ප්‍රකාශ කිහිපයක් පහත දැක්වේ.", "options": ["A, B හා C *(A, B, and C)*", "A, B හා D *(A, B, and D)*", "A, C හා D *(A, C, and D)*", "B, C හා D *(B, C, and D)*", "C, D හා E *(C, D, and E)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** Monarchies during the Buddha's era were characterized by absolute royal authority (A), a bureaucratic structure comprising a crown prince, state priest, judges, and generals (C), and aggressive military expansion over neighboring territories (D)."}, {"qNum": 163, "q": "163. සිංහල පද්‍ය සාහිත්‍යයේ ස්වර්ණමය යුගය වශයෙන් සැලකෙන්නේ,", "options": ["අනුරාධපුර යුගය යි. *(Anuradhapura period)*", "දඹදෙණි යුගය යි. *(Dambadeniya period)*", "කෝට්ටේ යුගය යි. *(Kotte period)*", "පොළොන්නරු යුගය යි. *(Polonnaruwa period)*", "කුරුණෑගල යුගය යි. *(Kurunegala period)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** The Kotte period (15th century, under King Parakramabahu VI) saw a monumental renaissance in poetry, primarily characterized by Sandesha Kavya (message poems) and major works such as Guttilaya, Kavyashekharaya, and Buduguna Alankaraya.\n\n---"}, {"qNum": 164, "q": "164. දස අකුසලයෙන් මිදීම දස කුසලයයි. ඒ අනුව දස කුසලයට අයත් වන්නේ,", "options": ["ප්‍රාණඝාතයෙන් වැළකීම *(Abstaining from killing)*", "සොරකම් කිරීම *(Stealing / Adinnadana)*", "කාමයේ හැසිරීම *(Sexual misconduct / Kamesu micchacara)*", "බොරු කීම *(Lying / Musavada)*", "කේලාම් කීම *(Slandering / Pisunavaca)*"], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** දස අකුසල්වලින් වැළකීම දස කුසල් වන බැවින්, සෙසු විකල්ප (සොරකම් කිරීම, කාමයේ හැසිරීම, බොරු කීම, කේලාම් කීම) අකුසල් වන අතර 'ප්‍රාණඝාතයෙන් වැළකීම' (Abstaining from killing) කුසලයකි."}, {"qNum": 165, "q": "165. සිංහල සාහිත්‍ය පෝෂණයට බෞද්ධ සංකල්ප වස්තු විෂය වී ඇති අවස්ථා විවිධ ග්‍රන්ථ අධ්‍යයනය මඟින් හමුවේ. ඒ නිර්මාණයන් අතරින් ගුත්තිල කාව්‍යය, කාව්‍යශේඛරය, බුදුගුණ අලංකාරය, ලෝවැඩ සඟරාව සෘජු ලෙසම බෞද්ධ ආභාසය ලබා ඇත. එයින් කාව්‍යශේඛරය රචනා කරන ලද්දේ,", "options": ["අනුරාධපුර යුගයේ ය *(Anuradhapura era)*", "පොළොන්නරු යුගයේ ය *(Polonnaruwa era)*", "දඹදෙණි යුගයේ ය *(Dambadeniya era)*", "කෝට්ටේ යුගයේ ය *(Kotte era)*", "කුරුණෑගල යුගයේ ය *(Kurunegala era)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** සිංහල පද්‍ය සාහිත්‍යයේ ස්වර්ණමය යුගය වූ කෝට්ටේ යුගයේදී, ෂඩ්භාෂා පරමේශ්වර **තොටගමුවේ ශ්‍රී රාහුල හිමියන්** විසින් VI වන පරාක්‍රමබාහු රජුගේ දියණිය වූ උලකුඩය දේවිය වෙනුවෙන් 'කාව්‍යශේඛරය' මහා පද්‍ය කාව්‍යය රචනා කරන ලදී.\n\n---\n*මෙම ලේඛනය 2024 බෞද්ධ ශිෂ්ටාචාරය විෂය නිර්දේශයට අනුව සකස් කළ නිල පිළිතුරු පත්‍රයකි.*"}, {"qNum": 166, "q": "166. මහා මංගල සූත්‍රයේ සඳහන් මංගල කරුණු කිහිපයක් පහත දැක්වේ.", "options": ["A, B හා D ය.", "A, B හා C ය.", "A, C හා E ය.", "B, D හා E ය.", "C, D හා E ය."], "correct": 0, "explanation": "* **විවරණය / Academic Justification:** The full stanza is: *\"Dānam ca dhammacariyā ca, ñātakānañ ca sangaho, Anavajjāni kammāni, etammangalamuttaman.\"* This includes Almsgiving (A), Righteous Conduct (B), and Supporting Relatives (D).\n\n---"}, {"qNum": 167, "q": "167. ලක්දිව ප්‍රථම ස්තූපය වන ථූපාරාම චෛත්‍යයේ නිදන් කරන ලද්දේ බුදුරජාණන් වහන්සේගේ කුමන ශාරීරික ධාතුව ද?", "options": ["දකුණු දළදා වහන්සේ ය. *(The Right Tooth relic)*", "ලළාට ධාතු වහන්සේ ය. *(The Frontal Bone relic)*", "අකු ධාතු වහන්සේ ය. *(The Collarbone relic [Akkha Dhatu])*", "ග්‍රීවා ධාතු වහන්සේ ය. *(The Neck relic)*", "කේශ ධාතු වහන්සේ ය. *(The Hair relic)*"], "correct": 2, "explanation": "* **විවරණය / Academic Justification:** King Devanampiya Tissa constructed the Thuparama Stupa to enshrine the collarbone relic (*Akkha Dhatu*) of the Buddha, brought from India by Sumana Samanera."}, {"qNum": 168, "q": "168. සිගාලෝවාද සූත්‍රයට අනුව භෝග විනාශ මුඛ හයට ඇතුළත් නොවන කරුණක් වන්නේ,", "options": ["රහමෙර පානය යි. *(Indulging in intoxicants)*", "නොකල්හි වීථි සංචාරය යි. *(Roaming the streets at unseemly hours)*", "නැටුම් ගැයුම් බැලීම යි. *(Frequenting theatrical shows)*", "සූදුවෙහි යෙදීම යි. *(Gambling)*", "බොරු කීම යි. *(Lying/Falsehood)*"], "correct": 4, "explanation": "* **විවරණය / Academic Justification:** The six channels of ruining wealth are: addiction to intoxicants, haunting streets at late hours, frequenting entertainment shows, gambling, bad company, and laziness. Lying (Musavada) is a moral defilement (Sila violation) but not categorized under the financial \"Bhoga-vinashamukha.\"\n\n---"}, {"qNum": 169, "q": "169. ක්‍රිස්තු වර්ෂ 475 - 775 අතර කාලයේ ඉන්දියාවේ බටහිර ප්‍රාන්ත පාලනය කළ මෛත්‍රක රජවරුන් විසින් මහා විහාරයක් ඉදිකර විශ්වවිද්‍යාලයක් බවට පත් කළේ,", "options": ["ජගද්දලා විශ්වවිද්‍යාලය යි. *(Jagaddala University)*", "නාලන්දා විශ්වවිද්‍යාලය යි. *(Nalanda University)*", "වික්‍රමශීලා විශ්වවිද්‍යාලය යි. *(Vikramashila University)*", "වලභි විශ්වවිද්‍යාලය යි. *(Valabhi University)*", "ඕදන්තපුර විශ්වවිද්‍යාලය යි. *(Odantapuri University)*"], "correct": 3, "explanation": "* **විවරණය / Academic Justification:** Valabhi University was a renowned center of Hinayana (Theravada) Buddhist learning situated in Gujarat, Western India, patronized and developed by the Maitraka dynasty.\n\n---"}, {"qNum": 170, "q": "170. බුදු සමය ස්වාභාවික පරිසරය විෂයෙහි සුහද මිත්‍රශීලී අවධානයක් යොමු කර ඇති දහමක් බැවින් පරිසර සංරක්ෂණයේ ඇති වැදගත්කම ද අවධාරණය කරයි. පහත සඳහන් ප්‍රකාශ අතරින් බෞද්ධ පරිසර සංරක්ෂණ සාකල්‍යය වඩාත් හොඳින් ප්‍රකට වන ප්‍රකාශය කුමක් ද?", "options": ["වර්ෂා කාලයේ දී ආරාම තුළ සීමා වී වාසය කිරීම. *(Remaining inside monasteries during the rainy season / Vassavasa)*", "ගිහියාගේ ආහාර පාන සිහිනෙන් තොරව තබා නොගෙන පරිහරණය කිරීම. *(Not hoarding household food needlessly.)*", "බුදුරජාණන් වහන්සේ ඉසිපතන මිගදායේ දී පළමු වස් කාලය ගත කිරීම. *(The Buddha spending His first rainy retreat in Isipatana Deer Park.)*", "සියලු ආකාරයේ පැළවන බීජ සිඳීම භික්ෂූන්ට ආපත්තියක් ලෙස පැනවීම. *(Destroying germinating seeds resulting in a disciplinary offense [apatti] for monks.)*", "බුදුරජාණන් වහන්සේ බෝ අතු වැව
