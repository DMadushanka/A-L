<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🗺️ A/L අන්තර්ක්‍රියාකාරී සිතියම් පුහුණුව</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Canvas Confetti for celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-gold: #fbbf24;
      --accent-cyan: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-blue: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Sinhala", sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 600px;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-score {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: var(--accent-gold);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* Mode Navigation */
    .nav-tabs {
      width: 100%;
      max-width: 600px;
      padding: 10px 16px;
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border-color: #818cf8;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    /* Subject & Map Selector */
    .controls-bar {
      width: 100%;
      max-width: 600px;
      padding: 0 16px 10px;
      display: flex;
      gap: 8px;
    }

    .select-input {
      flex: 1;
      padding: 8px 12px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
    }

    /* Question Prompt Box */
    .prompt-card {
      width: calc(100% - 32px);
      max-width: 568px;
      margin: 0 16px 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      text-align: center;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .prompt-subtitle {
      font-size: 0.75rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .prompt-target-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .prompt-hint {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Map Viewport Area */
    .map-container {
      width: calc(100% - 32px);
      max-width: 568px;
      height: 480px;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(0, 0, 0, 0.4);
      touch-action: none;
    }

    .map-svg-wrap {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
      transform-origin: center center;
    }

    /* Pin Marker Styles */
    .pin {
      position: absolute;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      margin-top: -22px;
      pointer-events: none;
      transform: scale(0);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 20;
    }

    .pin-user {
      filter: drop-shadow(0 2px 6px rgba(239, 68, 68, 0.8));
    }

    .pin-correct {
      filter: drop-shadow(0 2px 6px rgba(34, 197, 94, 0.8));
    }

    .pulse-ring {
      position: absolute;
      width: 40px;
      height: 40px;
      margin-left: -20px;
      margin-top: -20px;
      border: 2px solid var(--accent-green);
      border-radius: 50%;
      animation: pulseAnim 1.5s infinite;
      pointer-events: none;
    }

    @keyframes popIn {
      to { transform: scale(1); }
    }

    @keyframes pulseAnim {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* Feedback Drawer */
    .feedback-drawer {
      width: calc(100% - 32px);
      max-width: 568px;
      margin: 12px 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .feedback-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .feedback-desc {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 10px;
      white-space: pre-line;
    }

    .next-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }

    /* Map Zoom Controls */
    .zoom-controls {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
    }

    .zoom-btn {
      width: 36px;
      height: 36px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Summary Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      animation: popIn 0.35s ease;
    }

    .modal-score {
      font-size: 3rem;
      font-weight: 900;
      color: var(--accent-gold);
      margin: 10px 0;
    }

    .send-tg-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span>🗺️</span> A/L සිතියම් පුහුණුව
    </div>
    <div class="badge-score" id="scoreDisplay">
      ලකුණු: 0 / 100
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" id="tabExam" onclick="switchMode('exam')">🎯 විභාග මාදිලිය</button>
    <button class="tab-btn" id="tabPractice" onclick="switchMode('practice')">💡 පුහුණු මාදිලිය</button>
    <button class="tab-btn" id="tabExplore" onclick="switchMode('explore')">📖 අධ්‍යයනය</button>
  </div>

  <!-- Subject Controls -->
  <div class="controls-bar">
    <select class="select-input" id="subjectFilter" onchange="onSubjectChange()">
      <option value="all">📚 සියලුම විෂයයන් (History / Geo / BC)</option>
      <option value="history">📜 ඉතිහාසය (History)</option>
      <option value="geo">🌍 භූගෝල විද්‍යාව (Geography)</option>
      <option value="bc">☸️ බෞද්ධ ශිෂ්ටාචාරය (Buddhist Civ)</option>
    </select>
    <select class="select-input" id="mapSelect" onchange="onMapChange()">
      <option value="sri_lanka">🇱🇰 ශ්‍රී ලංකා සිතියම</option>
      <option value="india_bc">🇮🇳 දඹදිව / ඉන්දීය සිතියම</option>
    </select>
  </div>

  <!-- Prompt Box -->
  <div class="prompt-card" id="promptCard">
    <div class="prompt-subtitle" id="promptSub">ප්‍රශ්නය 1 / 10 • ලකුණු 10</div>
    <div class="prompt-target-name" id="promptTarget">මාන්තොට (මහාතිත්ථ)</div>
    <div class="prompt-hint" id="promptHint">ස්ථානය සලකුණු කිරීමට සිතියම මත ස්පර්ශ (Tap) කරන්න.</div>
  </div>

  <!-- Map Interactive Container -->
  <div class="map-container" id="mapViewport">
    <div class="map-svg-wrap" id="mapWrapper">
      <!-- Embedded Vector Base Maps -->
      <svg id="svgMap" viewBox="0 0 500 800" width="100%" height="100%">
        <defs>
          <radialGradient id="landGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#334155" />
            <stop offset="100%" stop-color="#1e293b" />
          </radialGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Dynamic Map Paths will be injected here via JS -->
        <g id="mapBackgroundGroup"></g>
        <g id="mapRiversGroup"></g>
        <g id="mapExploreMarkersGroup"></g>
      </svg>

      <!-- Interactive Pin Layer -->
      <div id="pinLayer"></div>
    </div>

    <!-- Zoom Controls -->
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoomMap(1.25)">+</button>
      <button class="zoom-btn" onclick="zoomMap(0.8)">-</button>
      <button class="zoom-btn" onclick="resetZoom()" style="font-size:0.8rem;">↺</button>
    </div>
  </div>

  <!-- Feedback Drawer -->
  <div class="feedback-drawer" id="feedbackDrawer">
    <div class="feedback-title" id="feedbackResult">🎯 නියමයි! නිවැරදි සලකුණු කිරීමක්</div>
    <div class="feedback-desc" id="feedbackNotes"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">මීළඟ ප්‍රශ්නය ➔</button>
  </div>

  <!-- Final Score Modal -->
  <div class="modal-overlay" id="scoreModal">
    <div class="modal-card">
      <div style="font-size: 2.5rem;">🏆</div>
      <h2 style="color: #fff; margin-top: 6px;">විභාග ප්‍රතිඵල සටහන</h2>
      <p style="color: var(--text-secondary); font-size: 0.85rem;">සිතියම් ලකුණු කිරීමේ පරීක්ෂණය අවසන්</p>
      
      <div class="modal-score" id="modalFinalScore">85%</div>
      <p id="modalFeedbackText" style="color: #38bdf8; font-size: 0.95rem; margin-bottom: 12px;"></p>

      <button class="send-tg-btn" onclick="submitToTelegram()">
        🚀 ප්‍රතිඵලය Telegram Bot වෙත යවන්න
      </button>
      <button class="tab-btn" style="width: 100%; margin-top: 8px;" onclick="restartExam()">
        🔄 නැවත පුහුණු වන්න
      </button>
    </div>
  </div>

  <script>
    // Initialize Telegram WebApp SDK
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Dataset of Vector Maps (Sri Lanka High-Accuracy Outline & India)
    const MAP_DATA = {
      sri_lanka: {
        viewBox: "0 0 500 800",
        // Scaled high-precision Sri Lanka Outline SVG Path
        path: "M 200 45 C 220 50, 240 70, 235 90 C 230 110, 205 130, 200 150 C 195 170, 160 175, 140 190 C 120 205, 130 240, 140 270 C 150 300, 145 340, 130 380 C 115 420, 105 470, 120 520 C 135 570, 150 610, 190 640 C 230 670, 260 700, 300 710 C 340 720, 370 700, 385 660 C 400 620, 425 560, 420 500 C 415 440, 400 380, 410 320 C 420 260, 400 230, 380 210 C 360 190, 340 150, 300 120 C 260 90, 220 55, 200 45 Z",
        islands: [
          "M 160 60 C 170 65, 175 75, 165 80 C 155 85, 150 75, 160 60 Z", // Kayts / Jaffna Islands
          "M 130 90 C 140 95, 145 105, 135 110 C 125 115, 120 105, 130 90 Z",
          "M 140 180 C 155 185, 160 195, 145 200 C 130 205, 125 190, 140 180 Z"  // Mannar Island
        ],
        rivers: [
          "M 260 520 Q 340 400 380 250", // Mahaweli
          "M 240 550 Q 180 540 145 530", // Kelani
          "M 220 260 Q 180 230 150 195"  // Malwathu Oya
        ]
      },
      india_bc: {
        viewBox: "0 0 600 600",
        path: "M 180 120 L 450 120 L 490 250 L 400 420 L 300 550 L 200 420 L 120 260 Z",
        islands: [],
        rivers: [
          "M 240 180 Q 380 240 500 280" // Ganges
        ]
      }
    };

    let locationsDataset = {};
    let currentMapKey = "sri_lanka";
    let currentMode = "exam"; // 'exam', 'practice', 'explore'
    let currentSubject = "all";

    // Quiz State
    let quizQueue = [];
    let currentIndex = 0;
    let currentScore = 0;
    let answeredCurrent = false;

    // Zoom and Pan State
    let zoomScale = 1;
    let panX = 0, panY = 0;
    let isDragging = false;
    let startX, startY;

    // Fetch Syllabus Locations
    async function initApp() {
      try {
        const res = await fetch('normal_quiz/map_locations.json');
        const data = await res.json();
        locationsDataset = data.maps;
      } catch (e) {
        console.warn("Using fallback local dataset:", e);
        locationsDataset = {
          sri_lanka: {
            name_si: "ශ්‍රී ලංකා සිතියම",
            locations: [
              { id: "sl_manthai", name_si: "මාන්තොට (මහාතිත්ථ)", subject: ["history", "bc"], coords: { x: 30.5, y: 24.2 }, tolerance: 4.5, description: "අනුරාධපුර යුගයේ ප්‍රධානතම ජාත්‍යන්තර වෙළෙඳ වරායයි." },
              { id: "sl_gokanna", name_si: "ගෝකණ්ණ (ත්‍රිකුණාමලය)", subject: ["history", "geo", "bc"], coords: { x: 76.2, y: 30.8 }, tolerance: 4.5, description: "නැගෙනහිර වෙරළේ පිහිටි ප්‍රධාන ස්වභාවික වරායයි." },
              { id: "sl_anuradhapura", name_si: "අනුරාධපුරය", subject: ["history", "bc"], coords: { x: 43.8, y: 32.5 }, tolerance: 4.0, description: "වසර 1400කට අධික කාලයක් ලංකාවේ අගනුවරව පැවති ශ්‍රේෂ්ඨ රාජධානිය." },
              { id: "sl_polonnaruwa", name_si: "පොළොන්නරුව", subject: ["history", "bc"], coords: { x: 62.5, y: 42.0 }, tolerance: 4.0, description: "ශ්‍රී ලංකාවේ දෙවන ඓතිහාසික රාජධානියයි." },
              { id: "sl_sigiriya", name_si: "සීගිරිය", subject: ["history"], coords: { x: 54.2, y: 41.2 }, tolerance: 3.8, description: "කාශ්‍යප රජුගේ ලෝක උරුම පර්වත මාලිගයයි." },
              { id: "sl_mahaweli_river", name_si: "මහවැලි ගඟ", subject: ["geo", "history"], coords: { x: 68.0, y: 45.0 }, tolerance: 5.5, description: "ශ්‍රී ලංකාවේ දිගම ගංගාව (335km)." },
              { id: "sl_pidurutalagala", name_si: "පිදුරුතලාගල කන්ද", subject: ["geo"], coords: { x: 55.4, y: 64.2 }, tolerance: 3.8, description: "ශ්‍රී ලංකාවේ උසම කඳු මුදුනයි (2524m)." }
            ]
          },
          india_bc: {
            name_si: "දඹදිව සිතියම",
            locations: [
              { id: "in_lumbini", name_si: "ලුම්බිණිය", subject: ["bc", "history"], coords: { x: 57.5, y: 32.5 }, tolerance: 4.5, description: "සිද්ධාර්ථ කුමාරෝත්පත්තිය සිදුවූ ස්ථානයයි." },
              { id: "in_bodhgaya", name_si: "බුද්ධගයාව", subject: ["bc", "history"], coords: { x: 64.0, y: 42.0 }, tolerance: 4.5, description: "බුදුරජාණන් වහන්සේ සම්බුද්ධත්වයට පත්වූ ස්ථානයයි." }
            ]
          }
        };
      }
      renderMapPaths();
      startQuizSession();
      setupMapInteractions();
    }

    // Render Base SVG Maps
    function renderMapPaths() {
      const mapMeta = MAP_DATA[currentMapKey];
      const svg = document.getElementById('svgMap');
      svg.setAttribute('viewBox', mapMeta.viewBox);

      const bgGroup = document.getElementById('mapBackgroundGroup');
      let html = `<path d="${mapMeta.path}" fill="url(#landGrad)" stroke="#475569" stroke-width="2.5" />`;
      if (mapMeta.islands) {
        mapMeta.islands.forEach(isl => {
          html += `<path d="${isl}" fill="url(#landGrad)" stroke="#475569" stroke-width="1.8" />`;
        });
      }
      bgGroup.innerHTML = html;

      const riversGroup = document.getElementById('mapRiversGroup');
      let riverHtml = '';
      if (mapMeta.rivers) {
        mapMeta.rivers.forEach(riv => {
          riverHtml += `<path d="${riv}" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" opacity="0.75" />`;
        });
      }
      riversGroup.innerHTML = riverHtml;

      if (currentMode === 'explore') {
        renderExploreMarkers();
      } else {
        document.getElementById('mapExploreMarkersGroup').innerHTML = '';
      }
    }

    // Start a new Exam or Practice Queue
    function startQuizSession() {
      const allLocs = locationsDataset[currentMapKey]?.locations || [];
      let filtered = allLocs;
      if (currentSubject !== 'all') {
        filtered = allLocs.filter(l => l.subject?.includes(currentSubject));
      }
      if (filtered.length === 0) filtered = allLocs;

      // Shuffle array
      quizQueue = [...filtered].sort(() => 0.5 - Math.random());
      if (currentMode === 'exam') {
        quizQueue = quizQueue.slice(0, 10);
      }
      currentIndex = 0;
      currentScore = 0;
      updateScoreBadge();
      showQuestion();
    }

    function showQuestion() {
      answeredCurrent = false;
      document.getElementById('pinLayer').innerHTML = '';
      document.getElementById('feedbackDrawer').style.display = 'none';

      if (currentIndex >= quizQueue.length) {
        finishExam();
        return;
      }

      const item = quizQueue[currentIndex];
      document.getElementById('promptSub').innerText = `ප්‍රශ්නය ${currentIndex + 1} / ${quizQueue.length} • ලකුණු 10`;
      document.getElementById('promptTarget').innerText = `📍 ${item.name_si}`;
      document.getElementById('promptHint').innerText = "ස්ථානය සලකුණු කිරීමට සිතියම මත ස්පර්ශ (Tap) කරන්න.";
    }

    // Handle Map Tap / Click
    function handleMapTap(evt) {
      if (answeredCurrent && currentMode !== 'explore') return;

      const rect = document.getElementById('mapWrapper').getBoundingClientRect();
      const clientX = evt.clientX || (evt.touches && evt.touches[0].clientX);
      const clientY = evt.clientY || (evt.touches && evt.touches[0].clientY);

      const clickX = ((clientX - rect.left) / rect.width) * 100;
      const clickY = ((clientY - rect.top) / rect.height) * 100;

      if (currentMode === 'explore') return;

      const currentItem = quizQueue[currentIndex];
      const targetX = currentItem.coords.x;
      const targetY = currentItem.coords.y;

      // Euclidean Distance Calculation
      const dist = Math.hypot(clickX - targetX, clickY - targetY);
      const tolerance = currentItem.tolerance || 4.5;

      answeredCurrent = true;

      // Place User Tap Pin
      createPin(clickX, clickY, 'pin-user', '📍');

      let gained = 0;
      let title = '';
      let isSuccess = false;

      if (dist <= tolerance) {
        gained = 10;
        title = '🎯 නියමයි! නිවැරදි සලකුණු කිරීමක් (10/10)';
        isSuccess = true;
        confetti({ particleCount: 60, spread: 60, origin: { y: 0.6 } });
      } else if (dist <= tolerance * 2) {
        gained = 5;
        title = '🟡 ඉතා ආසන්නයි! (5/10)';
      } else {
        gained = 0;
        title = '❌ ස්ථානය වැරදියි (0/10)';
      }

      currentScore += gained;
      updateScoreBadge();

      // Show Correct Green Pin & Pulse Indicator
      createPin(targetX, targetY, 'pin-correct', '🎯');
      createPulse(targetX, targetY);

      // Display Feedback Drawer
      const drawer = document.getElementById('feedbackDrawer');
      document.getElementById('feedbackResult').innerHTML = title;
      document.getElementById('feedbackResult').style.color = isSuccess ? '#22c55e' : (gained > 0 ? '#fbbf24' : '#ef4444');
      document.getElementById('feedbackNotes').innerHTML = `<b>${currentItem.name_si}:</b>\n${currentItem.description || ''}\n${currentItem.exam_points ? '<br>' + currentItem.exam_points : ''}`;
      drawer.style.display = 'block';

      if (tg?.HapticFeedback) {
        if (isSuccess) tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.notificationOccurred('error');
      }
    }

    function createPin(x, y, className, symbol) {
      const pin = document.createElement('div');
      pin.className = `pin ${className}`;
      pin.style.left = `${x}%`;
      pin.style.top = `${y}%`;
      pin.innerHTML = `<span style="font-size:18px;">${symbol}</span>`;
      document.getElementById('pinLayer').appendChild(pin);
    }

    function createPulse(x, y) {
      const pulse = document.createElement('div');
      pulse.className = 'pulse-ring';
      pulse.style.left = `${x}%`;
      pulse.style.top = `${y}%`;
      document.getElementById('pinLayer').appendChild(pulse);
    }

    function nextQuestion() {
      currentIndex++;
      showQuestion();
    }

    function updateScoreBadge() {
      const maxPossible = (quizQueue.length || 10) * 10;
      document.getElementById('scoreDisplay').innerText = `ලකුණු: ${currentScore} / ${maxPossible}`;
    }

    function finishExam() {
      const maxPossible = quizQueue.length * 10;
      const percentage = Math.round((currentScore / maxPossible) * 100);

      document.getElementById('modalFinalScore').innerText = `${percentage}%`;
      let feedback = '';
      if (percentage >= 80) feedback = '🌟 විශිෂ්ටයි! ඔබ සිතියම් ලකුණු කිරීමෙහි දක්ෂයෙකි.';
      else if (percentage >= 50) feedback = '👍 හොඳයි! තවත් ටිකක් පුහුණු වන්න.';
      else feedback = '💪 උත්සාහය අත්නොහරින්න, නැවත සිතියම අධ්‍යයනය කරන්න.';

      document.getElementById('modalFeedbackText').innerText = feedback;
      document.getElementById('scoreModal').style.display = 'flex';
      confetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } });
    }

    function submitToTelegram() {
      const percentage = Math.round((currentScore / (quizQueue.length * 10)) * 100);
      const payload = {
        type: 'map_exam_result',
        score: currentScore,
        maxScore: quizQueue.length * 10,
        percentage: percentage,
        subject: currentSubject,
        mapKey: currentMapKey
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        alert(`ලකුණු වාර්තාව: ${percentage}%\nTelegram වෙත ප්‍රතිඵලය සාර්ථකව සම්ප්‍රේෂණය විය.`);
        document.getElementById('scoreModal').style.display = 'none';
      }
    }

    function restartExam() {
      document.getElementById('scoreModal').style.display = 'none';
      startQuizSession();
    }

    // Switch Mode
    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tabExam').classList.toggle('active', mode === 'exam');
      document.getElementById('tabPractice').classList.toggle('active', mode === 'practice');
      document.getElementById('tabExplore').classList.toggle('active', mode === 'explore');

      if (mode === 'explore') {
        document.getElementById('promptCard').style.display = 'none';
        document.getElementById('feedbackDrawer').style.display = 'none';
        renderExploreMarkers();
      } else {
        document.getElementById('promptCard').style.display = 'block';
        document.getElementById('mapExploreMarkersGroup').innerHTML = '';
        startQuizSession();
      }
    }

    // Explore Mode: Markers with clickable popups
    function renderExploreMarkers() {
      const locs = locationsDataset[currentMapKey]?.locations || [];
      const group = document.getElementById('mapExploreMarkersGroup');
      let html = '';
      locs.forEach(loc => {
        const svgW = currentMapKey === 'sri_lanka' ? 500 : 600;
        const svgH = currentMapKey === 'sri_lanka' ? 800 : 600;
        const cx = (loc.coords.x / 100) * svgW;
        const cy = (loc.coords.y / 100) * svgH;
        html += `
          <g cursor="pointer" onclick="onExploreMarkerClick('${loc.id}')">
            <circle cx="${cx}" cy="${cy}" r="12" fill="#38bdf8" opacity="0.3" class="pulse-ring" />
            <circle cx="${cx}" cy="${cy}" r="6" fill="#fbbf24" stroke="#fff" stroke-width="1.5" />
          </g>
        `;
      });
      group.innerHTML = html;
    }

    window.onExploreMarkerClick = function(id) {
      const locs = locationsDataset[currentMapKey]?.locations || [];
      const found = locs.find(l => l.id === id);
      if (!found) return;

      const drawer = document.getElementById('feedbackDrawer');
      document.getElementById('feedbackResult').innerHTML = `📍 ${found.name_si}`;
      document.getElementById('feedbackResult').style.color = '#38bdf8';
      document.getElementById('feedbackNotes').innerHTML = `<b>${found.category_si || ''}</b><br>${found.description}<br><br>${found.exam_points || ''}`;
      document.getElementById('nextBtn').style.display = 'none';
      drawer.style.display = 'block';
    };

    function onSubjectChange() {
      currentSubject = document.getElementById('subjectFilter').value;
      if (currentMode !== 'explore') startQuizSession();
      else renderExploreMarkers();
    }

    function onMapChange() {
      currentMapKey = document.getElementById('mapSelect').value;
      renderMapPaths();
      if (currentMode !== 'explore') startQuizSession();
      else renderExploreMarkers();
    }

    // Zoom & Pan Engine
    function setupMapInteractions() {
      const wrap = document.getElementById('mapWrapper');
      const viewport = document.getElementById('mapViewport');

      viewport.addEventListener('click', handleMapTap);

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 0.85;
        zoomMap(factor);
      });
    }

    function zoomMap(factor) {
      zoomScale = Math.min(Math.max(1, zoomScale * factor), 3.5);
      updateTransform();
    }

    function resetZoom() {
      zoomScale = 1;
      panX = 0;
      panY = 0;
      updateTransform();
    }

    function updateTransform() {
      document.getElementById('mapWrapper').style.transform = `scale(${zoomScale}) translate(${panX}px, ${panY}px)`;
    }

    // Start App
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
