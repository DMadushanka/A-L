  <style>
    :root {
      --bg-dark: #070e17;
      --bg-card: rgba(15, 23, 42, 0.85);
      --bg-card-solid: #0f172a;
      --border-card: rgba(56, 189, 248, 0.28);

      --blue-primary: #38bdf8;
      --blue-light: #e0f2fe;
      --blue-glow: rgba(56, 189, 248, 0.45);

      --amber-accent: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.35);

      --good: #10b981;
      --good-soft: #34d399;
      --good-bg: rgba(16, 185, 129, 0.16);
      --good-border: rgba(16, 185, 129, 0.4);

      --bad: #f43f5e;
      --bad-soft: #fb7185;
      --bad-bg: rgba(244, 63, 94, 0.16);
      --bad-border: rgba(244, 63, 94, 0.4);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #cbd5e1;

      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Noto Serif Sinhala', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 14px 60px;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      z-index: -1;
      opacity: 0.65;
      animation: floatGlow 16s ease-in-out infinite alternate;
    }

    body::before {
      top: -12%;
      left: -8%;
      width: 580px;
      height: 580px;
      background: radial-gradient(circle, var(--blue-glow), transparent 70%);
    }

    body::after {
      bottom: -10%;
      right: -8%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, var(--amber-glow), transparent 70%);
      animation-delay: -8s;
    }

    @keyframes floatGlow {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(30px, -40px) scale(1.08);
      }

      100% {
        transform: translate(-20px, 30px) scale(0.95);
      }
    }

    .app-container {
      width: 100%;
      max-width: 820px;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }

    .cover-banner {
      width: 100%;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--border-card);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .cover-banner img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .header-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--blue-primary);
      text-align: center;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .header-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      gap: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue-primary), #0284c7);
      color: #040914;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
      width: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(56, 189, 248, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue-primary), var(--amber-accent));
      width: 0%;
      transition: width 0.3s ease;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .q-text {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 24px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 16px 20px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      color: var(--text-sub);
      font-size: 1rem;
      font-family: inherit;
      line-height: 1.5;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .option-btn:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: var(--blue-primary);
      color: var(--text-main);
    }

    .option-btn.selected {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--blue-primary);
      color: #fff;
    }

    .option-btn.correct {
      background: var(--good-bg) !important;
      border-color: var(--good) !important;
      color: var(--good-soft) !important;
    }

    .option-btn.wrong {
      background: var(--bad-bg) !important;
      border-color: var(--bad) !important;
      color: var(--bad-soft) !important;
    }

    .explanation-box {
      margin-top: 20px;
      padding: 16px 20px;
      background: rgba(56, 189, 248, 0.08);
      border-left: 4px solid var(--blue-primary);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-sub);
    }

    .explanation-box strong {
      color: var(--blue-primary);
    }

    .nav-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
    }

    .score-summary {
      text-align: center;
      padding: 30px 20px;
    }

    .score-badge {
      display: inline-block;
      padding: 12px 28px;
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--blue-primary);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--blue-primary);
      border-radius: var(--radius-lg);
      margin-bottom: 16px;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .verdict-text {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--amber-accent);
      margin-bottom: 24px;
    }

    .review-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 16px;
      text-align: left;
    }

    .review-item.is-correct {
      border-left: 4px solid var(--good);
    }

    .review-item.is-wrong {
      border-left: 4px solid var(--bad);
    }

    .hidden {
      display: none !important;
    }

    .chip {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .chip-good {
      background: var(--good-bg);
      color: var(--good-soft);
    }

    .chip-bad {
      background: var(--bad-bg);
      color: var(--bad-soft);
    }
  </style>
</head>

  <script>
    const QUESTIONS = [
      {
        "q": "1. පහත සඳහන් කරුණු අතුරෙන් වුවමනාවල ලක්ෂණ පමණක් අඩංගු පිළිතුර කුමක් ද?",
        "o": [
          "(1) අසීමිත වීම, විවිධ වීම හා පොදු වීම",
          "(2) ව්‍යාපාරිකයින්ට නිර්මාණය කළ හැකි වීම, පොදු වීම හා සීමිත වීම",
          "(3) පුද්ගලබද්ධ වීම, සීමිත වීම හා විවිධ වීම",
          "(4) අසීමිත වීම, විවිධ වීම හා පුද්ගලබද්ධ වීම",
          "(5) පොදු වීම, ව්‍යාපාරිකයින්ට නිර්මාණය කළ හැකි වීම හා විවිධ වීම"
        ],
        "c": 3,
        "e": "වුවමනා (Wants) අසීමිතය, විවිධය, පුද්ගලබද්ධය. අවශ්‍යතා (Needs) සීමිතය, පොදුය."
      },
      {
        "q": "2. ආර්ථිකයේ විවිධ අංශවලට අයත් ව්‍යාපාර කටයුතු කිහිපයක් පහත දැක්වේ. ඒ අතුරෙන් සේවා අංශයට අයත් ව්‍යාපාර කටයුතු දැක්වෙන පිළිතුර තෝරන්න.",
        "o": [
          "(1) ගෘහ කර්මාන්තය හා ආනයන වෙළෙඳාම",
          "(2) කුරුඳු ආශ්‍රිත නිපැයුම් සැකසීම හා ප්‍රවාහනය",
          "(3) ඉදිකිරීම් හා ගෑස්",
          "(4) ප්‍රවාහනය හා ධීවර කටයුතු",
          "(5) සන්නිවේදනය හා ප්‍රවාහනය"
        ],
        "c": 4,
        "e": "සන්නිවේදනය හා ප්‍රවාහනය යනු තෘතීයික (සේවා) අංශයට අයත් ව්‍යාපාර කටයුතු වේ."
      },
      {
        "q": "3. පහත සඳහන් යුගල අතුරෙන් නොගැළපෙන භාණ්ඩ සඳහා නිවැරදි පිළිතුර තෝරන්න.",
        "o": [
          "(1) ජීවිත රක්ෂණය හා පුද්ගල හදිසි අනතුරු රක්ෂණය",
          "(2) මෝටර් රථය හා මෝටර් රථ රක්ෂණය",
          "(3) පුද්ගල හදිසි අනතුරු රක්ෂණය හා නිවස",
          "(4) ප්‍රවෘත්ති පත්‍රය හා මෝටර් රථය",
          "(5) නිවස සහ ගිනි රක්ෂණය"

    let current = 0;
    let userAnswers = new Array(QUESTIONS.length).fill(null);
    let timerInterval = null;
    let secondsElapsed = 0;

    function startQuiz() {
      document.getElementById('welcomeScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');

      secondsElapsed = 0;
      startTimer();
      renderQuestion();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
        const s = (secondsElapsed % 60).toString().padStart(2, '0');
        document.getElementById('timerText').innerText = `⏱️ ${m}:${s}`;
      }, 1000);
    }

    function renderQuestion() {
      const q = QUESTIONS[current];
      document.getElementById('qCount').innerText = `ප්‍රශ්නය ${current + 1} / ${QUESTIONS.length}`;

      const pct = ((current + 1) / QUESTIONS.length) * 100;
      document.getElementById('progressBar').style.width = `${pct}%`;

      document.getElementById('qText').innerHTML = q.q;

      const optionsList = document.getElementById('optionsList');
      optionsList.innerHTML = '';

      q.o.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        if (userAnswers[current] === idx) btn.classList.add('selected');

        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        optionsList.appendChild(btn);
      });

      const expBox = document.getElementById('explanationBox');
      if (userAnswers[current] !== null) {
        expBox.innerHTML = `<strong>💡 විග්‍රහය:</strong> ${q.e}`;
        expBox.classList.remove('hidden');
      } else {
        expBox.classList.add('hidden');
      }

      document.getElementById('prevBtn').style.visibility = current === 0 ? 'hidden' : 'visible';

      const nextBtn = document.getElementById('nextBtn');
      if (current === QUESTIONS.length - 1) {
        nextBtn.innerText = 'අවසන් කරන්න 🏁';
      } else {
        nextBtn.innerText = 'ඊළඟ ➡️';
      }
    }

    function selectOption(idx) {
      userAnswers[current] = idx;
      renderQuestion();
    }

    function goPrev() {
      if (current > 0) {
        current--;
        renderQuestion();
      }
    }

    function goNext() {
      if (current < QUESTIONS.length - 1) {
        current++;
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      clearInterval(timerInterval);

      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('hidden');

      let score = 0;
      QUESTIONS.forEach((q, i) => {
        if (userAnswers[i] === q.c) score++;
      });

      const total = QUESTIONS.length;
      const pct = Math.round((score / total) * 100);

      document.getElementById('finalScore').innerText = `${score} / ${total}`;

      let verdict = '🎉 විශිෂ්ටයි! ඔබ ව්‍යාපාර අධ්‍යයනය 2015 MCQ ප්‍රශ්න පත්‍රය සාර්ථකව නිම කළා.';
      if (pct < 50) verdict = '👍 මූලික අවබෝධයක් ඇත — තවදුරටත් පුහුණු වන්න.';
      else if (pct < 75) verdict = '🌟 හොඳයි! තවදුරටත් පුනරීක්ෂණය කරන්න.';
      document.getElementById('verdictText').innerText = verdict;

      // Build Review List
      const reviewContainer = document.getElementById('reviewContainer');
      reviewContainer.innerHTML = '<h2 style="margin-bottom:16px; color:var(--blue-primary);">📋 පිළිතුරු සමාලෝචනය (Answer Review)</h2>';

      QUESTIONS.forEach((q, i) => {
        const isCorrect = userAnswers[i] === q.c;
        const item = document.createElement('div');
        item.className = `review-item ${isCorrect ? 'is-correct' : 'is-wrong'}`;

        const userAnsStr = userAnswers[i] !== null ? q.o[userAnswers[i]] : 'පිළිතුරක් සපයා නැත';
        const correctAnsStr = q.o[q.c];

        item.innerHTML = `
        <div style="margin-bottom:8px;">
          <span class="chip ${isCorrect ? 'chip-good' : 'chip-bad'}">${isCorrect ? '✓ නිවැරදියි' : '✗ වැරදියි'}</span>
          <strong>ප්‍රශ්නය ${i + 1}</strong>
        </div>
        <div style="font-weight:700; margin-bottom:10px;">${q.q}</div>
        <div style="font-size:0.9rem; color:var(--text-sub); margin-bottom:4px;">ඔබේ පිළිතුර: <span style="color:${isCorrect ? 'var(--good-soft)' : 'var(--bad-soft)'}">${userAnsStr}</span></div>
        ${!isCorrect ? `<div style="font-size:0.9rem; color:var(--good-soft); margin-bottom:6px;">නිවැරදි පිළිතුර: ${correctAnsStr}</div>` : ''}
        <div style="font-size:0.85rem; color:var(--text-muted); margin-top:8px;">💡 ${q.e}</div>
      `;
        reviewContainer.appendChild(item);
      });
    }

    function restartQuiz() {
      userAnswers = new Array(QUESTIONS.length).fill(null);
      current = 0;
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');
      secondsElapsed = 0;
      startTimer();
      renderQuestion();
    }
  </script>
</body>

</html>
