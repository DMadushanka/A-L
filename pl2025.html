  <style>
    :root {
      --bg-dark: #090b15;
      --bg-card: rgba(18, 22, 41, 0.75);
      --bg-card-solid: #121629;
      --border-card: rgba(139, 92, 246, 0.22);
      
      --purple-primary: #8b5cf6;
      --purple-light: #a78bfa;
      --purple-glow: rgba(139, 92, 246, 0.4);

      --gold-accent: #fbbf24;
      --gold-glow: rgba(251, 191, 36, 0.35);

      --cyan-bright: #38bdf8;
      
      --good: #10b981;
      --good-soft: #34d399;
      --good-bg: rgba(16, 185, 129, 0.16);
      --good-border: rgba(16, 185, 129, 0.4);

      --bad: #f43f5e;
      --bad-soft: #fb7185;
      --bad-bg: rgba(244, 63, 94, 0.16);
      --bad-border: rgba(244, 63, 94, 0.4);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #cbd5e1;

      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Noto Sans Sinhala', 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 14px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Dynamic Glowing Background Blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      opacity: 0.7;
      animation: floatGlow 14s ease-in-out infinite alternate;
    }

    body::before {
      top: -12%;
      left: -8%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, var(--purple-glow), transparent 70%);
    }

    body::after {
      bottom: -10%;
      right: -8%;
      width: 580px;
      height: 580px;
      background: radial-gradient(circle, var(--gold-glow), transparent 70%);
      animation-delay: -7s;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(25px, -35px) scale(1.08); }
      100% { transform: translate(-20px, 20px) scale(0.95); }
    }

    .app-container {
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header Styling */
    .header-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-title-box {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--purple-primary), var(--gold-accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 20px var(--purple-glow);
    }

    .header-text h1 {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ffffff, var(--purple-light), var(--gold-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.2px;
    }

    .header-text p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: rgba(139, 92, 246, 0.2);
      border-color: var(--purple-primary);
      transform: translateY(-1px);
    }

    .timer-badge {
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.3);
      color: var(--gold-accent);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', monospace;
    }

    /* Question Nav Strip */
    .nav-strip-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .strip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
      gap: 8px;
    }

    .strip-btn {
      width: 100%;
      height: 36px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .strip-btn:hover {
      border-color: var(--purple-light);
      color: #fff;
    }

    .strip-btn.curr {
      border-color: var(--gold-accent);
      box-shadow: 0 0 12px var(--gold-glow);
      color: var(--gold-accent);
      transform: scale(1.08);
    }

    .strip-btn.ok {
      background: var(--good-bg);
      border-color: var(--good-border);
      color: var(--good-soft);
    }

    .strip-btn.no {
      background: var(--bad-bg);
      border-color: var(--bad-border);
      color: var(--bad-soft);
    }

    .strip-btn.flagged::after {
      content: '★';
      position: absolute;
      top: -4px;
      right: -2px;
      font-size: 10px;
      color: var(--gold-accent);
    }

    /* Main Quiz Content Card */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 32px 36px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .q-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .q-tag {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--purple-light);
      background: rgba(139, 92, 246, 0.12);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .q-counter {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .q-text {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.7;
      color: var(--text-main);
      margin-bottom: 24px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .opt-btn {
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      color: var(--text-sub);
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.6;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .opt-btn:hover:not(:disabled) {
      background: rgba(139, 92, 246, 0.12);
      border-color: var(--purple-light);
      color: #ffffff;
      transform: translateX(4px);
    }

    .opt-badge {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.2s ease;
    }

    .opt-btn:hover:not(:disabled) .opt-badge {
      background: var(--purple-primary);
      color: #fff;
      border-color: var(--purple-light);
    }

    .opt-btn.correct {
      background: var(--good-bg) !important;
      border-color: var(--good) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
    }

    .opt-btn.correct .opt-badge {
      background: var(--good) !important;
      color: #ffffff !important;
      border-color: var(--good-soft) !important;
    }

    .opt-btn.incorrect {
      background: var(--bad-bg) !important;
      border-color: var(--bad) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 20px rgba(244, 63, 94, 0.25);
    }

    .opt-btn.incorrect .opt-badge {
      background: var(--bad) !important;
      color: #ffffff !important;
      border-color: var(--bad-soft) !important;
    }

    .opt-btn:disabled {
      cursor: default;
    }

    /* Explanation Box */
    .explain-card {
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      margin-bottom: 26px;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .explain-card.ok {
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .explain-card.no {
      background: rgba(244, 63, 94, 0.08);
      border-color: rgba(244, 63, 94, 0.3);
    }

    .explain-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .explain-card.ok .explain-title { color: var(--good-soft); }
    .explain-card.no .explain-title { color: var(--bad-soft); }

    .explain-desc {
      font-size: 0.92rem;
      line-height: 1.65;
      color: var(--text-sub);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Navigation Row */
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--purple-primary), #7c3aed);
      border: 1px solid var(--purple-light);
      color: #ffffff;
      box-shadow: 0 4px 16px var(--purple-glow);
    }

    .btn.primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #9333ea, var(--purple-primary));
      box-shadow: 0 6px 24px var(--purple-glow);
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Start Screen */
    .welcome-box {
      text-align: center;
      padding: 20px 10px;
    }

    .welcome-badge {
      display: inline-block;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.3);
      color: var(--gold-accent);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .welcome-title {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff, var(--purple-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-text {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 620px;
      margin: 0 auto 32px;
    }

    .features-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 36px;
      text-align: left;
    }

    .feature-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .feature-icon {
      font-size: 1.5rem;
      background: rgba(139, 92, 246, 0.15);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--purple-light);
    }

    .feature-info h4 {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .feature-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Results Screen */
    .results-card {
      text-align: center;
    }

    .results-header {
      margin-bottom: 32px;
    }

    .gauge-wrapper {
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gauge-circle {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .gauge-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 10;
    }

    .gauge-fill {
      fill: none;
      stroke: url(#scoreGradient);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s ease-out;
    }

    .gauge-text {
      position: absolute;
      font-size: 2.2rem;
      font-weight: 800;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
    }

    .results-verdict {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gold-accent);
      margin-bottom: 8px;
    }

    .results-sub {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.4rem;
      font-weight: 800;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
    }

    .stat-lbl {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .filter-chips {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip.active {
      background: var(--purple-primary);
      border-color: var(--purple-light);
      color: #fff;
      box-shadow: 0 4px 12px var(--purple-glow);
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    .review-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 20px;
    }

    .review-q-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      font-weight: 700;
      font-size: 1.02rem;
      color: var(--text-main);
      margin-bottom: 14px;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.ok {
      background: var(--good-bg);
      color: var(--good-soft);
      border: 1px solid var(--good-border);
    }

    .badge.no {
      background: var(--bad-bg);
      color: var(--bad-soft);
      border: 1px solid var(--bad-border);
    }

    .review-ans-line {
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
    }

    .review-ans-line.user {
      background: var(--bad-bg);
      color: var(--bad-soft);
      border: 1px solid var(--bad-border);
    }

    .review-ans-line.correct {
      background: var(--good-bg);
      color: var(--good-soft);
      border: 1px solid var(--good-border);
    }

    .review-explain {
      font-size: 0.88rem;
      color: var(--text-sub);
      background: rgba(139, 92, 246, 0.08);
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 12px;
      border-left: 3px solid var(--purple-primary);
    }

    @media (max-width: 640px) {
      body { padding: 14px 10px 40px; }
      .card { padding: 22px 18px; }
      .header-card { padding: 18px 20px; }
      .q-text { font-size: 1.05rem; }
      .opt-btn { padding: 14px 16px; font-size: 0.94rem; }
    }
  </style>
</head>

<body>
  <div class="app-container">

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.12); // E5
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.25); // G5
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'wrong') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now); // A3
          osc.frequency.exponentialRampToValueAtTime(164.81, now + 0.2); // E3
          gain.gain.setValueAtTime(0.15, now);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'click') {
          const osc = audioCtx.createOscillator();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);

          osc.start(now);
          osc.stop(now + 0.06);

      let verdict = '';
      if (pct >= 80) verdict = 'විශිෂ්ටයි! — දේශපාලන විද්‍යාව පිළිබඳ ඉහළ සුදානමක් ඇත.';
      else if (pct >= 60) verdict = 'හොඳයි! — තවදුරටත් සිද්ධාන්ත හා ව්‍යවස්ථා සංශෝධන පුනරීක්ෂණය කරන්න.';
      else if (pct >= 40) verdict = 'මූලික අවබෝධයක් ඇත — තවත් ප්‍රශ්න පත්‍ර පරිශීලනය කරන්න.';
      else verdict = 'දේශපාලන විද්‍යාව පාඩම් කොටස් නැවත අවධානයෙන් අධ්‍යයනය කරන්න.';

      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');

      let reviewItemsHtml = '';
      QUESTIONS.forEach((q, i) => {
        const uAns = userAnswers[i];
        const isOk = uAns === q.c;
        const isFlag = flaggedQuestions[i];

        if (reviewFilter === 'wrong' && isOk) return;
        if (reviewFilter === 'right' && !isOk) return;
        if (reviewFilter === 'flagged' && !isFlag) return;

        const yourAnsStr = uAns === null ? 'පිළිතුරු නොදුන්නා' : `${OPT_NUMS[uAns]} ${q.o[uAns]}`;
        const correctAnsStr = `${OPT_NUMS[q.c]} ${q.o[q.c]}`;

        reviewItemsHtml += `
          <div class="review-item">
            <div class="review-q-header">
              <span>${q.q}</span>
              <span class="badge ${isOk ? 'ok' : 'no'}">${isOk ? 'නිවැරදි' : 'වැරදි'}</span>
            </div>
            ${!isOk ? `
              <div class="review-ans-line user">
                <strong>ඔබේ පිළිතුර:</strong> <span>${yourAnsStr}</span>
              </div>
            ` : ''}
            <div class="review-ans-line correct">
              <strong>නිවැරදි පිළිතුර:</strong> <span>${correctAnsStr}</span>
            </div>
            <div class="review-explain">💡 ${q.e}</div>
          </div>
        `;
      });

      quizArea.innerHTML = `
        <div class="card results-card">
          <div class="results-header">
            <div class="gauge-wrapper">
              <svg class="gauge-circle" viewBox="0 0 120 120">
                <defs>
                  <linearGradient id="scoreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8b5cf6" />
                    <stop offset="100%" stop-color="#fbbf24" />
                  </linearGradient>
                </defs>
                <circle class="gauge-bg" cx="60" cy="60" r="${radius}" />
                <circle class="gauge-fill" cx="60" cy="60" r="${radius}" 
                  stroke-dasharray="${circumference}" 
                  stroke-dashoffset="${dashoffset}" />
              </svg>
              <div class="gauge-text">${pct}%</div>
            </div>

            <div class="results-verdict">${verdict}</div>
            <div class="results-sub">ඔබ ප්‍රශ්න ${total} කින් ${okCount} ක් නිවැරදිව පිළිතුරු දුන්නා.</div>
          </div>

          <div class="stats-row">
            <div class="stat-card">
              <div class="stat-val" style="color:var(--good-soft);">${okCount}</div>
              <div class="stat-lbl">නිවැරදි පිළිතුරු</div>
            </div>
            <div class="stat-card">
              <div class="stat-val" style="color:var(--bad-soft);">${noCount}</div>
              <div class="stat-lbl">වැරදි පිළිතුරු</div>
            </div>
            <div class="stat-card">
              <div class="stat-val">${m}:${s}</div>
              <div class="stat-lbl">ගත වූ කාලය</div>
            </div>
          </div>

          <div class="filter-chips">
            <button class="chip ${reviewFilter === 'all' ? 'active' : ''}" onclick="setReviewFilter('all')">සියල්ල (${total})</button>
            <button class="chip ${reviewFilter === 'wrong' ? 'active' : ''}" onclick="setReviewFilter('wrong')">වැරදි (${noCount})</button>
            <button class="chip ${reviewFilter === 'right' ? 'active' : ''}" onclick="setReviewFilter('right')">නිවැරදි (${okCount})</button>
            <button class="chip ${reviewFilter === 'flagged' ? 'active' : ''}" onclick="setReviewFilter('flagged')">ලකුණු කළ ප්‍රශ්න</button>
          </div>

          <div class="review-list">
            ${reviewItemsHtml || '<p style="text-align:center; color:var(--text-muted); padding:20px;">තෝරාගත් කාණ්ඩයේ ප්‍රශ්න නොමැත.</p>'}
          </div>

          <div style="margin-top: 32px;">
            <button class="btn primary" style="padding: 14px 32px;" onclick="startQuiz()">නැවත උත්සාහ කරන්න 🔄</button>
          </div>
        </div>
      `;
    }

    function setReviewFilter(f) {
      reviewFilter = f;
      renderResultsScreen();
    }

    function render() {
      renderStrip();
      if (currentIdx === -2) renderWelcomeScreen();
      else if (currentIdx === -1) renderResultsScreen();
      else renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initial Launch
    render();
  </script>
</body>

</html>
