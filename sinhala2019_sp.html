    :root {
      --bg-dark: #07131e;
      --bg-gradient-1: rgba(0, 230, 118, 0.15);
      --bg-gradient-2: rgba(0, 210, 255, 0.12);
      --bg-gradient-3: rgba(255, 215, 0, 0.10);

      --panel: #0d2134;
      --panel-2: #142e47;

      --emerald-primary: #00e676;
      --emerald-light: #69f0ae;
      --gold-glow: #ffd700;
      --cyan-accent: #00d2ff;

      color: var(--text);

      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 14px 60px;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
      opacity: 0.85;
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    body::before {
      top: -10%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #00e676, transparent 70%);
    }

    body::after {
      bottom: -10%;
      right: -10%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, #ffd700, transparent 70%);
      animation-delay: -6s;
    }

    @keyframes floatGlow {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(40px, 50px) scale(1.15);
      }

      100% {
        transform: translate(-30px, 30px) scale(0.95);
      }
    }

    .stage {
      width: 100%;
      max-width: 760px;
    }

    .masthead {
      text-align: center;
      margin-bottom: 20px;
    }

    .masthead .kicker {
      font-size: 12px;
      letter-spacing: 0.18em;
      color: var(--gold-glow);
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 8px;
      font-weight: 700;
      background: rgba(255, 215, 0, 0.12);
      padding: 4px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 215, 0, 0.25);
    }

    .masthead h1 {
      font-family: 'Noto Serif Sinhala', serif;
      font-weight: 800;
      font-size: clamp(22px, 4.8vw, 32px);
      margin: 6px 0 8px;
      background: linear-gradient(135deg, #ffffff 0%, var(--emerald-light) 40%, var(--gold-glow) 70%, var(--emerald-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.3;
    }

    .masthead p {
      margin: 0;
      font-size: 13.5px;
      color: var(--text-dim);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(13, 33, 52, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px 16px;
      margin-bottom: 18px;

      gap: 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .tally-item {
      display: flex;
      align-items: center;
      gap: 6px;

      color: var(--bad-soft);

      border-radius: 999px;
      font-size: 12.5px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;

    .btn-sound:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--emerald-primary);
    }

      gap: 6px;
      overflow-x: auto;
      padding: 6px 4px 12px;
      margin-bottom: 18px;
      scrollbar-width: thin;
      scrollbar-color: var(--emerald-primary) transparent;
    }

    .lantern-strip::-webkit-scrollbar {
      height: 4px;
    }

    .lantern-strip::-webkit-scrollbar-thumb {
      background: var(--emerald-primary);
      border-radius: 999px;
    }

    .lantern {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lantern.current {
      border-color: var(--gold-glow);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
      color: #fff;
      transform: scale(1.15);
    }

    .lantern.correct {
      background: var(--good);
      border-color: var(--good);
      color: #000;
    }

    .lantern.wrong {
      background: var(--bad);
      border-color: var(--bad);
      color: #fff;
    }

    .card {
      background: rgba(13, 33, 52, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius);
      padding: 24px 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    .qmeta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    .qnum {
      color: var(--emerald-light);
      font-weight: 700;
    }

    .qtext {
      font-family: 'Noto Serif Sinhala', serif;
      font-size: 17.5px;
      font-weight: 600;
      line-height: 1.65;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .opt {
      background: rgba(20, 46, 71, 0.7);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 13px 16px;
      color: var(--text);
      font-size: 14.5px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
      line-height: 1.5;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .opt:hover:not([disabled]) {
      background: rgba(30, 66, 102, 0.9);
      border-color: var(--cyan-accent);
      transform: translateX(4px);
    }

    .opt.correct {
      background: var(--good-bg) !important;
      border-color: var(--good) !important;
      color: #ffffff !important;
      font-weight: 600;
    }

    .opt.incorrect {
      background: var(--bad-bg) !important;
      border-color: var(--bad) !important;
      color: #ffffff !important;
    }

    .opt .tag {
      font-weight: 700;
      color: var(--gold-glow);
      flex: 0 0 auto;
    }

    .explain-box {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.6;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .explain-box.show {
      display: block;
    }

    .explain-box.ok {
      background: rgba(0, 230, 118, 0.12);
      border: 1px solid rgba(0, 230, 118, 0.3);
      color: #e2ffe8;
    }

    .explain-box.no {
      background: rgba(255, 42, 109, 0.12);
      border: 1px solid rgba(255, 42, 109, 0.3);
      color: #ffe2eb;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .navrow {
      display: flex;
      justify-content: space-between;
      margin-top: 22px;
      gap: 12px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
      padding: 11px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .btn:hover:not([disabled]) {
      background: rgba(255, 255, 255, 0.18);
      border-color: var(--emerald-primary);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--emerald-primary), #00b0ff);
      color: #000;
      border: none;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0, 230, 118, 0.3);
    }

    .btn.primary:hover:not([disabled]) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 230, 118, 0.45);
    }

    .btn[disabled] {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .start-btn {
      background: linear-gradient(135deg, var(--emerald-primary), var(--cyan-accent));
      color: #041019;
      font-weight: 800;
      font-size: 18px;
      padding: 16px 36px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 230, 118, 0.4);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .start-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 32px rgba(0, 230, 118, 0.6);
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .feat-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
    }

    .feat-icon {
      font-size: 24px;
      display: block;
      margin-bottom: 6px;
    }

    .feat-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--emerald-light);
      display: block;
    }

    .feat-desc {
      font-size: 11px;
      color: var(--text-dim);
    }

    .results-head {
      text-align: center;
      margin-bottom: 24px;
    }

    .score-plate {
      display: inline-block;
      background: rgba(0, 230, 118, 0.12);
      border: 2px solid var(--good);
      border-radius: 20px;
      padding: 18px 36px;
      margin-bottom: 12px;
    }

    .score-plate .num {
      font-size: 44px;
      font-weight: 800;
      color: var(--good);
      font-family: 'Noto Serif Sinhala', serif;
    }

    .score-plate .frac {
      font-size: 13px;
      color: var(--text-dim);
    }

    .score-sub {
      font-size: 15px;
      color: var(--gold-glow);
      margin: 8px 0;
      font-weight: 600;
    }

    .filter-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      cursor: pointer;
      font-family: inherit;
    }

    .chip.active {
      background: var(--cyan-accent);
      color: #000;
      font-weight: 700;
      border-color: var(--cyan-accent);
    }

    .review-item {
      background: rgba(20, 46, 71, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: left;
    }

    .review-item .rq {
      font-weight: 700;
      font-size: 14.5px;
      margin-bottom: 8px;
      color: #fff;
    }

    .review-item .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      margin-left: 6px;
    }

    .badge.ok {
      background: var(--good);
      color: #000;
    }

    .badge.no {
      background: var(--bad);
      color: #fff;
    }

    .review-item .rline {
      font-size: 13px;
      margin-top: 4px;

    }

    .review-item .rline.wrong {
      color: var(--bad-soft);
    }

    .review-item .rline.right {
      color: var(--good-soft);
    }

    .review-item .rexplain {
      font-size: 12.5px;
      color: var(--text-dim);
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
    }
  </style>
</head>

      quizArea.innerHTML = `
        <div class="card start-card" style="text-align:center; padding: 38px 24px;">
          <div style="margin-bottom:16px;">
            <span class="kicker" style="font-size:12.5px; padding:6px 18px; letter-spacing:0.14em;">✨ A/L MCQ HUB — SINHALA 2019 SP ✨</span>
          </div>
          
          <h2 style="font-family:'Noto Serif Sinhala',serif; font-size:clamp(22px, 5.2vw, 32px); margin:12px 0; background:linear-gradient(135deg, #ffffff 0%, var(--gold-glow) 50%, var(--emerald-primary) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:800; line-height:1.4;">
            සිංහල භාෂාව 2019 (දකුණු පළාත) — I කොටස MCQ
          </h2>
          
          <p style="color:var(--text-dim); font-size:15px; max-width:540px; margin:0 auto 28px; line-height:1.75;">
            2019 ජූලි 13 ශ්‍රේණිය දකුණු පළාත් අවසාන වාර පරීක්ෂණයේ සිංහල ප්‍රශ්න 20 සඳහා පිළිතුරු සපයා නිවැරදි ව්‍යාකරණ විග්‍රහයන් සමඟ ඔබේ දැනුම ක්ෂණිකව පරික්ෂා කරගන්න!
          </p>

          <div class="feature-grid">
            <div class="feat-box">
              <span class="feat-icon">📚</span>
              <span class="feat-title">ප්‍රශ්න 20 යි</span>
              <span class="feat-desc">සම්පූර්ණ I කොටස</span>
            </div>
            <div class="feat-box">
              <span class="feat-icon">💡</span>
              <span class="feat-title">ව්‍යාකරණ විග්‍රහ</span>
              <span class="feat-desc">නිවැරදි පැහැදිලි කිරීම්</span>
            </div>
            <div class="feat-box">
              <span class="feat-icon">🔊</span>
              <span class="feat-title">ශබ්ද සංඥා</span>
              <span class="feat-desc">Audio FX Feedback</span>
            </div>
            <div class="feat-box">
              <span class="feat-icon">📊</span>
              <span class="feat-title">සමාලෝචනය</span>
              <span class="feat-desc">ලකුණු විග්‍රහය</span>
            </div>
          </div>

          <div style="margin-top:36px;">
            <button class="start-btn" onclick="startQuiz()">
              <span>ප්‍රශ්න පත්‍රය ආරම්භ කරන්න</span>
              <span style="font-size:22px;">🚀</span>
            </button>
          </div>
        </div>
      `;
    }

    function ensureAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
      }
      return audioCtx;
    }

    function playTone(freq, start, dur, type, vol) {
      const ctx = ensureAudio();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.02);
    }

    function playCorrectSound() {
      if (!soundOn) return;
      playTone(523.25, 0, 0.12, 'sine', 0.2);
      playTone(659.25, 0.08, 0.14, 'sine', 0.2);
      playTone(783.99, 0.16, 0.22, 'sine', 0.2);
    }

    function playWrongSound() {
      if (!soundOn) return;
      playTone(220, 0, 0.16, 'sawtooth', 0.15);
      playTone(174.61, 0.1, 0.24, 'sawtooth', 0.15);
    }

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById('soundBtn').textContent = soundOn ? '🔊 හඬ: ක්‍රියාත්මකයි' : '🔇 හඬ: නැත';
    }

    const quizArea = document.getElementById('quizArea');
    const lanternStrip = document.getElementById('lanternStrip');
    const okCountEl = document.getElementById('okCount');
    const noCountEl = document.getElementById('noCount');

    function buildStrip() {
      lanternStrip.innerHTML = '';
      QUESTIONS.forEach((_, i) => {
        const b = document.createElement('button');
        b.className = 'lantern';
        b.textContent = i + 1;
        b.title = 'ප්‍රශ්නය ' + (i + 1);
        b.addEventListener('click', () => { current = i; render(); });
        lanternStrip.appendChild(b);
      });
      refreshStrip();
    }

    function refreshStrip() {
      const items = lanternStrip.children;
      for (let i = 0; i < items.length; i++) {
        const el = items[i];
        el.classList.remove('current', 'correct', 'wrong');
        if (answers[i] !== null) {
          el.classList.add(answers[i] === QUESTIONS[i].c ? 'correct' : 'wrong');
        }
        if (i === current) el.classList.add('current');
      }
    }

    function updateTally() {
      okCountEl.textContent = okCount;
      noCountEl.textContent = noCount;
    }

    function selectAnswer(qi, oi) {
      if (answers[qi] !== null) return;
      answers[qi] = oi;
      const isCorrect = oi === QUESTIONS[qi].c;
      if (isCorrect) { okCount++; playCorrectSound(); }
      else { noCount++; playWrongSound(); }
      updateTally();
      refreshStrip();
      renderQuestion();
    }

    function renderQuestion() {
      const q = QUESTIONS[current];
      const chosen = answers[current];
      const answered = chosen !== null;

      const optsHtml = q.o.map((text, oi) => {
        let cls = '';
        if (answered) {
          if (oi === q.c) cls = 'correct';
          else if (oi === chosen) cls = 'incorrect';
        }
        const disabledAttr = answered ? 'disabled' : '';
        return `<button class="opt ${cls}" ${disabledAttr} onclick="selectAnswer(${current},${oi})">
          <span class="tag">${OPT_LABELS[oi]}</span><span>${text}</span>
        </button>`;
      }).join('');

      let explainHtml = '';
      if (answered) {
        const isCorrect = chosen === q.c;
        explainHtml = `<div class="explain-box show ${isCorrect ? 'ok' : 'no'}">
          <div style="font-weight:700; margin-bottom:4px;">${isCorrect ? '✓ නිවැරදියි!' : '✗ වැරදියි — නිවැරදි පිළිතුර: ' + OPT_LABELS[q.c]}</div>
          <div>💡 <strong>ව්‍යාකරණ විග්‍රහය:</strong> ${q.e}</div>
        </div>`;
      }

      quizArea.innerHTML = `
        <div class="card">
          <div class="qmeta">
            <span class="qnum">ප්‍රශ්නය ${current + 1}</span>
            <span class="qcount">${current + 1} / ${QUESTIONS.length}</span>
          </div>
          <div class="qtext">${q.q}</div>
          <div class="options">${optsHtml}</div>
          ${explainHtml}
          <div class="navrow">
            <button class="btn" onclick="goPrev()" ${current === 0 ? 'disabled' : ''}>← පෙර ප්‍රශ්නය</button>
            ${current === QUESTIONS.length - 1
              ? `<button class="btn primary" onclick="showResults()" ${answered ? '' : 'disabled'}>ප්‍රතිඵල බලන්න</button>`
              : `<button class="btn primary" onclick="goNext()" ${answered ? '' : 'disabled'}>ඊළඟ ප්‍රශ්නය →</button>`}
          </div>
        </div>
      `;
    }

    function goPrev() { if (current > 0) { current--; render(); } }
    function goNext() { if (current < QUESTIONS.length - 1) { current++; render(); } }

    function restart() {
      answers = new Array(QUESTIONS.length).fill(null);
      okCount = 0; noCount = 0;
      updateTally();
      current = 0;
      render();
    }

    let reviewFilter = 'all';
    function showResults() { current = -1; render(); }

    function renderResults() {
      const score = okCount;
      const pct = Math.round((score / QUESTIONS.length) * 100);

      let verdict;
      if (pct >= 80) verdict = 'විශිෂ්ටයි! — සිංහල ව්‍යාකරණ පිළිබඳ ඉහළ සුදානමක් ඇත.';
      else if (pct >= 60) verdict = 'හොඳයි! — තවදුරටත් අක්ෂර වින්‍යාස හා ව්‍යාකරණ රීති පුනරීක්ෂණය කරන්න.';
      else if (pct >= 40) verdict = 'මූලික අවබෝධයක් ඇත — තවත් ප්‍රශ්න පත්‍ර පරිශීලනය කරන්න.';
      else verdict = 'සිංහල ව්‍යාකරණ පාඩම් කොටස් නැවත අවධානයෙන් අධ්‍යයනය කරන්න.';

      const filterRow = `
        <div class="filter-row">
          <button class="chip ${reviewFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">සියල්ල · ${QUESTIONS.length}</button>
          <button class="chip ${reviewFilter === 'wrong' ? 'active' : ''}" onclick="setFilter('wrong')">වැරදි · ${noCount}</button>
          <button class="chip ${reviewFilter === 'right' ? 'active' : ''}" onclick="setFilter('right')">නිවැරදි · ${okCount}</button>
        </div>`;

      let reviewHtml = '';
      QUESTIONS.forEach((q, i) => {
        const isCorrect = answers[i] === q.c;
        if (reviewFilter === 'wrong' && isCorrect) return;
        if (reviewFilter === 'right' && !isCorrect) return;
        const yourAns = answers[i] === null ? 'පිළිතුරු නොදුන්නා' : (OPT_LABELS[answers[i]] + ' ' + q.o[answers[i]]);
        const correctAns = OPT_LABELS[q.c] + ' ' + q.o[q.c];
        reviewHtml += `
          <div class="review-item">
            <div class="rq">${q.q} <span class="badge ${isCorrect ? 'ok' : 'no'}">${isCorrect ? 'නිවැරදි' : 'වැරදි'}</span></div>
            ${!isCorrect ? `<div class="rline wrong"><span class="lab">ඔබේ පිළිතුර</span><span class="val">${yourAns}</span></div>` : ''}
            <div class="rline right"><span class="lab">නිවැරදි පිළිතුර</span><span class="val">${correctAns}</span></div>
            <div class="rexplain">💡 ${q.e}</div>
          </div>`;
      });

      quizArea.innerHTML = `
        <div class="card">
          <div class="results-head">
            <div class="score-plate">
              <div class="num">${pct}%</div>
              <div class="frac">${score} / ${QUESTIONS.length} නිවැරදියි</div>
            </div>
            <p class="score-sub">${verdict}</p>
          </div>
          ${filterRow}
          <div id="reviewList">${reviewHtml || '<p style="text-align:center;color:var(--text-dim);padding:20px 0;">මෙම කාණ්ඩයේ ප්‍රශ්න නැත</p>'}</div>
          <div class="navrow" style="justify-content:center;margin-top:28px;">
            <button class="btn primary" onclick="restart()">නැවත උත්සාහ කරන්න 🔄</button>
          </div>
        </div>
      `;
    }

    function setFilter(f) { reviewFilter = f; renderResults(); }

    function render() {
      refreshStrip();
      if (current === -2) renderStartScreen();
      else if (current === -1) renderResults();
      else renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    buildStrip();
    updateTally();
    render();
  </script>
</body>

</html>
