<style>
  :root{
    --ink: #1c1420;
    --ink-2: #241a2c;
    --card: #2b1f34;
    --gold: #d9a441;
    --gold-soft: #e8c07a;
    --jade: #4f9c85;
    --rose: #c1666b;
    --parchment: #f3ead8;
    --stone: #a999ab;
    --hair: rgba(243,234,216,0.10);
    --shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(217,164,65,0.12), transparent 60%),
      radial-gradient(900px 600px at 100% 110%, rgba(79,156,133,0.10), transparent 60%),
      var(--ink);
    color: var(--parchment);
    font-family: 'Noto Sans Sinhala', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }

  .stage{
    width:100%;
    max-width: 720px;
  }

  /* ---- header / mala progress ---- */
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 22px;
    gap: 16px;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand .eyebrow{
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--gold-soft);
    text-transform: uppercase;
  }
  .brand h1{
    font-family:'Noto Serif Sinhala', serif;
    font-size: 20px;
    margin:0;
    font-weight:700;
    color: var(--parchment);
  }
  .counter{
    font-family:'Noto Serif Sinhala', serif;
    font-size: 14px;
    color: var(--stone);
    white-space:nowrap;
  }
  .counter b{ color: var(--gold-soft); font-size:16px; }

  .mala-track{
    position:relative;
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding: 6px 4px 14px;
    margin-bottom: 6px;
    scrollbar-width: thin;
  }
  .mala-track::-webkit-scrollbar{ height:4px; }
  .mala-track::-webkit-scrollbar-thumb{ background: var(--hair); border-radius:4px; }
  .bead{
    flex: 0 0 auto;
    width:12px; height:12px;
    border-radius:50%;
    background: rgba(243,234,216,0.12);
    border: 1px solid rgba(243,234,216,0.16);
    transition: transform .25s ease, background .25s ease, box-shadow .25s ease;
  }
  .bead.current{
    transform: scale(1.35);
    background: var(--gold);
    box-shadow: 0 0 0 4px rgba(217,164,65,0.18);
  }
  .bead.correct{ background: var(--jade); border-color: var(--jade); }
  .bead.wrong{ background: var(--rose); border-color: var(--rose); }

  /* ---- card ---- */
  .card{
    background: linear-gradient(180deg, var(--card), var(--ink-2));
    border: 1px solid var(--hair);
    border-radius: 20px;
    padding: 30px 28px 26px;
    box-shadow: var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-60px; right:-60px;
    width:180px; height:180px;
    background: radial-gradient(circle, rgba(217,164,65,0.14), transparent 70%);
    pointer-events:none;
  }

  .qtext{
    font-family:'Noto Serif Sinhala', serif;
    font-size: 19px;
    line-height: 1.75;
    font-weight: 600;
    color: var(--parchment);
    margin: 0 0 22px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    text-align:left;
    width:100%;
    background: rgba(243,234,216,0.04);
    border: 1px solid var(--hair);
    color: var(--parchment);
    font-family:'Noto Sans Sinhala', sans-serif;
    font-size: 15.5px;
    line-height:1.55;
    padding: 13px 16px;
    border-radius: 12px;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .opt:hover:not(:disabled){
    background: rgba(217,164,65,0.10);
    border-color: rgba(217,164,65,0.35);
  }
  .opt:active:not(:disabled){ transform: scale(0.99); }
  .opt:disabled{ cursor:default; }
  .opt .num{
    flex:0 0 auto;
    width:26px; height:26px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    font-weight:700;
    color: var(--stone);
    border:1px solid var(--hair);
    background: rgba(0,0,0,0.18);
  }
  .opt.correct{
    background: rgba(79,156,133,0.16);
    border-color: var(--jade);
  }
  .opt.correct .num{ background: var(--jade); color: #0d1f1a; border-color: var(--jade); }
  .opt.wrong{
    background: rgba(193,102,107,0.16);
    border-color: var(--rose);
  }
  .opt.wrong .num{ background: var(--rose); color: #2a0f10; border-color: var(--rose); }
  .opt.dim{ opacity:0.45; }

  .foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top: 22px;
    min-height: 38px;
  }
  .hint{
    font-size:13px;
    color: var(--stone);
  }
  .next-btn{
    font-family:'Noto Sans Sinhala', sans-serif;
    font-size:14px;
    font-weight:600;
    padding: 10px 20px;
    border-radius: 10px;
    border:1px solid var(--gold);
    background: var(--gold);
    color: #241a09;
    cursor:pointer;
    opacity:0;
    transform: translateY(4px);
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease, background .15s ease;
  }
  .next-btn.show{ opacity:1; transform:none; pointer-events:auto; }
  .next-btn:hover{ background: var(--gold-soft); }

  .score-live{
    font-size:13px; color: var(--stone);
  }
  .score-live b{ color: var(--gold-soft); }

  /* ---- results screen ---- */
  .result{
    text-align:center;
    padding: 10px 4px 4px;
  }
  .result .ring-wrap{
    margin: 6px auto 22px;
    width:150px; height:150px;
    position:relative;
  }
  .result svg{ width:150px; height:150px; transform: rotate(-90deg); }
  .result .ring-bg{ fill:none; stroke: rgba(243,234,216,0.08); stroke-width:10; }
  .result .ring-fg{ fill:none; stroke: var(--gold); stroke-width:10; stroke-linecap:round; transition: stroke-dashoffset 1s ease; }
  .result .ring-label{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .result .ring-label .n{
    font-family:'Noto Serif Sinhala', serif;
    font-size: 34px; font-weight:700; color: var(--parchment);
  }
  .result .ring-label .of{ font-size:12px; color: var(--stone); }
  .result h2{
    font-family:'Noto Serif Sinhala', serif;
    font-size: 21px;
    margin: 0 0 8px;
  }
  .result p.msg{ color: var(--stone); font-size:14px; margin: 0 0 26px; }

  .review{
    text-align:left;
    max-height: 260px;
    overflow-y:auto;
    margin-bottom: 22px;
    padding-right: 4px;
  }
  .review::-webkit-scrollbar{ width:5px; }
  .review::-webkit-scrollbar-thumb{ background: var(--hair); border-radius:4px; }
  .rev-item{
    border-top: 1px solid var(--hair);
    padding: 10px 2px;
    font-size: 13.5px;
    line-height:1.6;
  }
  .rev-item:first-child{ border-top:none; }
  .rev-item .rq{ color: var(--stone); margin-bottom:4px; }
  .rev-item .ra{ color: var(--rose); }
  .rev-item .rc{ color: var(--jade); }

  .restart-btn{
    font-family:'Noto Sans Sinhala', sans-serif;
    font-size:14.5px;
    font-weight:600;
    padding: 12px 26px;
    border-radius: 12px;
    border:1px solid var(--gold);
    background: transparent;
    color: var(--gold-soft);
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  .restart-btn:hover{ background: var(--gold); color:#241a09; }

  .muted-toggle{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color: var(--stone);
    cursor:pointer;
    user-select:none;
  }
  .muted-toggle input{ accent-color: var(--gold); }

  @media (max-width: 480px){
    .card{ padding: 24px 18px 20px; border-radius:16px; }
    .qtext{ font-size:17px; }
    .opt{ font-size:14.5px; padding:11px 13px; }
    .brand h1{ font-size:17px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>

<div class="stage">

    <div class="brand">
      <span class="eyebrow">2022 ‌බෞද්ධ ශිෂ්ටාචාරය I පත්‍රය</span>

    </div>
    <div class="counter"><b id="qnum">1</b> / <span id="qtotal">50</span></div>
  </div>

  <div class="mala-track" id="malaTrack"></div>

  <div class="card" id="cardArea"></div>

let current = 0;
let score = 0;
let locked = false;
let answered = new Array(QUESTIONS.length).fill(null); // null | true | false
let soundOn = true;

const cardArea = document.getElementById('cardArea');
const malaTrack = document.getElementById('malaTrack');
const qnumEl = document.getElementById('qnum');
document.getElementById('qtotal').textContent = QUESTIONS.length;

/* ---------- sound (Web Audio API, no external files) ---------- */
let audioCtx = null;
function ctx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}
function tone(freq, start, dur, type, gainPeak){
  const c = ctx();
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, c.currentTime + start);
  gain.gain.setValueAtTime(0, c.currentTime + start);
  gain.gain.linearRampToValueAtTime(gainPeak, c.currentTime + start + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
  osc.connect(gain).connect(c.destination);
  osc.start(c.currentTime + start);
  osc.stop(c.currentTime + start + dur + 0.05);
}
function playCorrect(){
  if(!soundOn) return;
  // soft ascending bell-like chime, singing-bowl flavored
  tone(660, 0,    0.5, 'sine', 0.14);
  tone(880, 0.08, 0.55,'sine', 0.11);
  tone(1320,0.16, 0.45,'sine', 0.06);
}
function playWrong(){
  if(!soundOn) return;
  // short low dull thud, not harsh
  tone(160, 0,    0.22, 'triangle', 0.16);
  tone(110, 0.05, 0.28, 'sine', 0.12);
}

/* ---------- mala beads ---------- */
function renderMala(){
  malaTrack.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const b = document.createElement('div');
    b.className = 'bead';
    if(i === current) b.classList.add('current');
    if(answered[i] === true) b.classList.add('correct');
    if(answered[i] === false) b.classList.add('wrong');
    malaTrack.appendChild(b);
  });
  const cur = malaTrack.children[current];
  if(cur) cur.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
}

/* ---------- render question ---------- */
function renderQuestion(){
  locked = false;
  qnumEl.textContent = current + 1;
  const q = QUESTIONS[current];

  const wasAnswered = answered[current] !== null;

  let html = `<p class="qtext">${escapeHtml(q.q)}</p><div class="options">`;
  q.options.forEach((opt, i) => {
    html += `<button class="opt" data-i="${i}"><span class="num">${i+1}</span><span>${escapeHtml(opt)}</span></button>`;
  });
  html += `</div>
    <div class="foot">
      <span class="hint" id="hintText">${wasAnswered ? '' : 'නිවැරදි යැයි සිතන පිළිතුර තෝරන්න'}</span>
      <button class="next-btn" id="nextBtn">${current === QUESTIONS.length - 1 ? 'ප්‍රතිඵල බලන්න' : 'ඊළඟ ප්‍රශ්නය'}</button>
    </div>`;
  cardArea.innerHTML = html;

  const buttons = cardArea.querySelectorAll('.opt');
  buttons.forEach(btn => btn.addEventListener('click', onSelect));

  if(wasAnswered){
    locked = true;
    const chosen = wasAnswered !== null ? null : null;
    revealAnswer(q, buttons, null, true);
  }

  document.getElementById('nextBtn').addEventListener('click', goNext);
  renderMala();
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function onSelect(e){
  if(locked) return;
  locked = true;
  const btn = e.currentTarget;
  const chosen = parseInt(btn.dataset.i, 10);
  const q = QUESTIONS[current];
  const isCorrect = chosen === q.correct;
  answered[current] = isCorrect;
  if(isCorrect) score++;

  const buttons = cardArea.querySelectorAll('.opt');
  revealAnswer(q, buttons, chosen, false);

  if(isCorrect) playCorrect(); else playWrong();
  renderMala();

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.classList.add('show');
  document.getElementById('hintText').textContent = isCorrect ? 'නිවැරදියි! 🙏' : 'වැරදියි — නිවැරදි පිළිතුර සලකුණු කර ඇත.';
}

function revealAnswer(q, buttons, chosen, isReplay){
  buttons.forEach((b, i) => {
    b.disabled = true;
    if(i === q.correct){
      b.classList.add('correct');
    } else if(i === chosen){
      b.classList.add('wrong');
    } else {
      b.classList.add('dim');
    }
  });
  if(!isReplay){
    // nothing extra
  } else {
    document.getElementById('nextBtn').classList.add('show');
    document.getElementById('hintText').textContent = answered[current] ? 'නිවැරදියි! 🙏' : 'වැරදියි — නිවැරදි පිළිතුර සලකුණු කර ඇත.';
  }
}

function goNext(){
  if(current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
  } else {
    renderResults();
  }
}

function renderResults(){
  const total = QUESTIONS.length;
  const pct = Math.round((score/total) * 100);
  const circumference = 2 * Math.PI * 65;
  const offset = circumference * (1 - score/total);

  let wrongList = '';
  QUESTIONS.forEach((q, i) => {
    if(answered[i] === false){
      wrongList += `<div class="rev-item">
        <div class="rq">${i+1}. ${escapeHtml(q.q)}</div>
        <div class="rc">✓ ${escapeHtml(q.options[q.correct])}</div>
      </div>`;
    }
  });
  if(!wrongList){
    wrongList = `<div class="rev-item" style="text-align:center; color: var(--jade);">සියලු ප්‍රශ්නවලට නිවැරදිව පිළිතුරු දී ඇත. සාධු! 🙏</div>`;
  }

  let msg;
  if(pct === 100) msg = 'පරිපූර්ණයි — සම්පූර්ණ දැනුමකි.';
  else if(pct >= 80) msg = 'විශිෂ්ටයි — ඉතා හොඳ දැනුමකි.';
  else if(pct >= 60) msg = 'හොඳයි — තව ටිකක් සමාලෝචනය කරන්න.';
  else if(pct >= 40) msg = 'මධ්‍යස්ථයි — නැවත පරිශීලනය කිරීම වැදගත් ය.';
  else msg = 'නැවත හොඳින් අධ්‍යයනය කර උත්සාහ කරන්න.';

  cardArea.innerHTML = `
    <div class="result">
      <div class="ring-wrap">
        <svg viewBox="0 0 150 150">
          <circle class="ring-bg" cx="75" cy="75" r="65"></circle>
          <circle class="ring-fg" cx="75" cy="75" r="65"
            stroke-dasharray="${circumference}"
            stroke-dashoffset="${circumference}"
            id="ringFg"></circle>
        </svg>
        <div class="ring-label">
          <span class="n">${score}</span>
          <span class="of">/ ${total}</span>
        </div>
      </div>
      <h2>${pct}% ලකුණු</h2>
      <p class="msg">${msg}</p>
      <div class="review">${wrongList}</div>
      <button class="restart-btn" id="restartBtn">නැවත උත්සාහ කරන්න</button>
    </div>
  `;
  malaTrack.style.display = 'none';
  document.querySelector('.top').style.display = 'none';

  requestAnimationFrame(() => {
    const ring = document.getElementById('ringFg');
    ring.style.strokeDashoffset = offset;
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    current = 0; score = 0;
    answered = new Array(QUESTIONS.length).fill(null);
    malaTrack.style.display = '';
    document.querySelector('.top').style.display = '';
    renderQuestion();
  });
}

renderQuestion();
</script>
</body>
</html>
